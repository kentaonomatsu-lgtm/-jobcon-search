<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>ブース＆プレディクティブ ワンタップ</title>
<style>
/* 見慣れたiPhone「設定」アプリ風: 大きな見出し / 角丸の白いリスト / 緑のスイッチ / 下のタブバー */
:root{
--bg:#f2f2f7; --cell:#ffffff; --fill:#e9e9ee; --fg:#111114; --sub:#6e6e76; --sep:#e3e3e8;
--blue:#0a74ff; --green:#30b455; --green-soft:#e1f5e7; --red:#d92d3f; --red-soft:#fde8ea; --amber:#b86e00; --amber-soft:#fdf0d7;
--brand:#b11f35; --tab:58px;
--font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#000000; --cell:#1c1c1e; --fill:#2c2c2e; --fg:#f5f5f7; --sub:#98989f; --sep:#38383a;
--blue:#4096ff; --green:#34c759; --green-soft:#12301c; --red:#ff6b78; --red-soft:#3a1a1e; --amber:#f0b24a; --amber-soft:#3a2d12; --brand:#ff5a70; color-scheme:dark;}}
:root[data-theme="dark"]{
--bg:#000000; --cell:#1c1c1e; --fill:#2c2c2e; --fg:#f5f5f7; --sub:#98989f; --sep:#38383a;
--blue:#4096ff; --green:#34c759; --green-soft:#12301c; --red:#ff6b78; --red-soft:#3a1a1e; --amber:#f0b24a; --amber-soft:#3a2d12; --brand:#ff5a70; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
padding-block:0 calc(var(--tab) + 150px)}
.wrap{max-width:640px;margin:0 auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
/* ===== ログイン ===== */
.login{padding-top:max(56px,env(safe-area-inset-top,0px));display:grid;gap:20px}
.logo{width:64px;height:64px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;letter-spacing:-.02em}
.login h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.01em}
.login p{margin:6px 0 0;color:var(--sub);font-size:14px}
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.group .fld{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;padding:0 16px;min-height:48px;border-bottom:1px solid var(--sep)}
.group .fld:last-child{border-bottom:0}
.group .fld label{font-size:15px}
.group .fld input{border:0;background:transparent;height:48px;width:100%;min-width:0;outline:0;font-size:16px}
.bigbtn{height:52px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:17px;width:100%}
.bigbtn:disabled{opacity:.5}
.err{background:var(--red-soft);color:var(--red);border-radius:12px;padding:12px 14px;font-size:14px}
.note{font-size:12.5px;color:var(--sub);padding:0 4px}
/* ===== ヘッダー ===== */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);padding:10px 0 6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.navrow{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.navrow .lk{border:0;background:transparent;color:var(--blue);font-size:16px;padding:6px 2px}
.navrow .lk.muted{color:var(--sub)}
.title{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:2px 0 10px}
/* ===== 状況カード ===== */
.status{background:var(--cell);border-radius:16px;padding:16px;display:grid;gap:12px;margin-bottom:14px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-size:40px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big span{color:var(--sub);font-size:15px}
.big em{font-style:normal;margin-left:auto;font-weight:700;border-radius:999px;padding:3px 12px;font-size:14px;background:var(--green-soft);color:var(--green)}
.big em.full{background:var(--amber-soft);color:var(--amber)}
.slots{display:flex;gap:5px;flex-wrap:wrap}
.slot{width:22px;height:22px;border-radius:6px;background:var(--fill)}
.slot.used{background:var(--green)}
.facts{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--sub);font-size:13.5px}
.facts b{color:var(--fg);font-variant-numeric:tabular-nums}
/* ===== 絞り込み ===== */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;margin-bottom:10px}
.seg button{border:0;background:transparent;height:34px;border-radius:8px;font-size:14px;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--cell);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;height:38px;border:0;border-radius:10px;background:var(--fill);padding:0 12px;font-size:16px;outline:0}
.search input::placeholder{color:var(--sub)}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 12px}
.pill{border:0;background:var(--cell);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--blue)}
.pill b{color:var(--sub);font-weight:500;margin-left:4px}
/* ===== スタッフ一覧 ===== */
.list{background:var(--cell);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;min-height:66px;border-bottom:1px solid var(--sep);position:relative}
.row:last-child{border-bottom:0}
.row .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--sep);flex:none;display:grid;place-items:center;color:#fff;font-size:15px;line-height:1}
.row.sel .chk{background:var(--blue);border-color:var(--blue)}
.row.sel{background:color-mix(in srgb,var(--blue) 8%,var(--cell))}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px}
.info{min-width:0;flex:1}
.nm{font-weight:600;font-size:16.5px;overflow-wrap:anywhere;line-height:1.3}
.sb{color:var(--sub);font-size:12.5px;overflow-wrap:anywhere;margin-top:1px}
.tag{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--fill);color:var(--sub)}
.tag.on{background:var(--green-soft);color:var(--green)}
.sw{position:relative;width:60px;height:36px;border-radius:999px;border:0;background:#c7c7cc;flex:none;transition:background .18s;padding:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sw{background:#48484a}}
:root[data-theme="dark"] .sw{background:#48484a}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .18s}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(24px)}
.empty{padding:34px 12px;text-align:center;color:var(--sub)}
.linkcard{margin-top:18px}
.linkcard .cap{font-size:13px;color:var(--sub);text-transform:none;padding:0 14px 6px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-bottom:1px solid var(--sep);color:var(--fg);text-decoration:none;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.lrow:last-child{border-bottom:0}
.lrow .chev{color:var(--sub)}
.lrow small{display:block;color:var(--sub);font-size:12.5px}
/* ===== 下部: 選択バー + タブバー ===== */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px));z-index:9;padding:10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--cell) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--sep)}
.dock .in{max-width:640px;margin:0 auto;display:grid;gap:8px}
.dock .cnt{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub)}
.dock .cnt button{border:0;background:transparent;color:var(--blue);font-size:14px;padding:4px 0}
.dock .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{height:50px;border-radius:14px;border:0;font-weight:700;font-size:16px}
.act.assign{background:var(--green);color:#fff}
.act.release{background:var(--red-soft);color:var(--red)}
.act:disabled{opacity:.4}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;height:calc(var(--tab) + env(safe-area-inset-bottom,0px));padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--cell) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--sep);display:grid;grid-template-columns:1fr 1fr}
.tabbar button{border:0;background:transparent;display:grid;justify-items:center;align-content:center;gap:2px;color:var(--sub);font-size:11.5px;font-weight:600}
.tabbar button[aria-selected="true"]{color:var(--blue)}
.tabbar svg{width:26px;height:26px}
/* ===== シート・トースト・読込 ===== */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;margin:8px;margin-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.sheet .box{background:var(--cell);border-radius:16px;padding:18px 16px 14px;display:grid;gap:8px;text-align:center}
.sheet h2{margin:0;font-size:17px}
.sheet .names{font-size:13px;color:var(--sub);max-height:120px;overflow:auto;overflow-wrap:anywhere}
.sheet .btn{height:54px;border-radius:14px;border:0;background:var(--cell);font-size:17px;font-weight:600;color:var(--blue)}
.sheet .btn.go{background:var(--cell);color:var(--green);font-weight:700}
.sheet .btn.go.release{color:var(--red)}
.sheet input.nm2{height:46px;border:0;border-radius:10px;background:var(--fill);padding:0 12px;font-size:16px;text-align:left;outline:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:50;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14.5px;max-width:min(92%,520px);box-shadow:0 8px 28px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center}
.toast.bad{background:var(--red);color:#fff}
.busy{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.18);display:grid;place-items:center}
.busy i{width:36px;height:36px;border-radius:50%;border:4px solid var(--cell);border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.busy i{animation:none}.sw,.sw::after{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<!-- ログイン -->
<section id="login" class="login" hidden>
<div>
<div class="logo">LN</div>
</div>
<div>
<h1>リスナビ<br>ブース割当</h1>
<p>ブースとプレディクティブの割当・解除を、ワンタップで。</p>
</div>
<form id="loginForm" style="display:grid;gap:14px" autocomplete="on">
<div class="group">
<div class="fld"><label for="lId">ログインID</label><input id="lId" autocomplete="username" autocapitalize="off" autocorrect="off" required></div>
<div class="fld"><label for="lPw">パスワード</label><input id="lPw" type="password" autocomplete="current-password" required placeholder="必須"></div>
<div class="fld"><label for="lUrl">ログインURL</label><input id="lUrl" type="url" inputmode="url"></div>
</div>
<div id="lErr" class="err" hidden></div>
<button class="bigbtn" id="lGo" type="submit">ログイン</button>
<div class="note">パスワードはこの端末に保存しません。ブラウザの「パスワードを保存」を使うと、次回から自動で入力されます。</div>
</form>
<div class="group linkcard" id="admLogin"></div>
</section>
<!-- メイン -->
<section id="main" hidden>
<div class="nav">
<div class="navrow">
<button class="lk muted" id="bOut">ログアウト</button>
<div style="display:flex;gap:16px"><button class="lk" id="bReload">更新</button><button class="lk" id="bEdit">選択</button></div>
</div>
</div>
<div class="title" id="title">ブース割当</div>
<div class="status" id="status"></div>
<div id="segTargetWrap"></div>
<div class="seg" id="segFilter"></div>
<div class="search"><input id="q" type="search" placeholder="名前・IDで検索" aria-label="検索"></div>
<div class="sets" id="presets"></div>
<div class="list" id="list"></div>
<div class="linkcard" id="admMain"><div class="cap">リンク</div><div class="group" id="admMainBox"></div></div>
</section>
</div>
<div class="dock" id="dock" hidden><div class="in">
<div class="cnt"><span id="dockInfo"></span><button id="bAll">すべて選択</button></div>
<div class="two"><button class="act assign" id="bOn">割当</button><button class="act release" id="bOff">解除</button></div>
</div></div>
<nav class="tabbar" id="tabbar" hidden>
<button id="tabBooth" role="tab" aria-selected="true">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
ブース割当</button>
<button id="tabPred" role="tab" aria-selected="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
プレディクティブ</button>
</nav>
<div id="layer"></div>
<script>
(()=>{
const BASE="https://lisnavi.com";
const DEF={dbName:"alegria001",tenantUlId:"01K7NH0N5MCETXGG713R5MP6NR",loginId:"alegria001"};
const CONTRACT_BOOTHS=15, PRED_BOOTHS=6;
const ADMIN_URL="https://lisnavi.com/alegria001/01K7NH0N5MCETXGG713R5MP6NR/admin/list-search?project-id=1&searchMode=normal";
const $=s=>document.querySelector(s);
const store={
get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const S={
auth:store.get("lnv.auth",null),
tab:store.get("lnv.tab","booth"),
target:store.get("lnv.target","staff"),
filter:"all",q:"",edit:false,
sel:new Set(),
presets:store.get("lnv.presets",[]),
staffs:[],admins:[],booths:[],groups:{},predStaffs:[],predSum:{contractedBoothCount:PRED_BOOTHS,unassignedBoothCount:null}
};
/* ---------- API ---------- */
class ApiErr extends Error{constructor(m,st){super(m);this.status=st}}
async function api(path,{method="GET",body,auth=true}={}){
const h={Accept:"application/json"};
if(body!==undefined)h["Content-Type"]="application/json";
if(auth){h.Authorization="Bearer "+S.auth.token;h["X-Tenant-Db-Name"]=S.auth.dbName}
let r;
try{r=await fetch(BASE+path+(method==="GET"?(path.includes("?")?"&":"?")+"_="+Date.now():""),{method,cache:"no-store",headers:h,body:body!==undefined?JSON.stringify(body):undefined})}
catch(e){throw new ApiErr("通信できません。ネットワークを確認してください。",0)}
let j=null;try{j=await r.json()}catch(e){}
if(r.status===401){doLogout(true);throw new ApiErr("ログインの有効期限が切れました。もう一度ログインしてください。",401)}
if(!r.ok||(j&&j.status===false)){
const m=(j&&(j.message||(j.data&&j.data.message)))||("エラー "+r.status);
throw new ApiErr(m,r.status);
}
return j;
}
async function login(loginId,password,dbName,tenantUlId){
const j=await api("/api/admin/login",{method:"POST",auth:false,body:{loginId,password,dbName,tenantUlId}});
let t=j.token||(j.data&&j.data.token)||"";
t=String(t).replace(/^Bearer\s+/i,"");
if(!t)throw new ApiErr("トークンを取得できませんでした。",0);
return t;
}
/* ---------- data ---------- */
async function loadCore(){
const [st,ad,bo,gr]=await Promise.all([
api("/api/admin/staff-settings"),api("/api/admin/admin-booth-assignments"),
api("/api/booths"),api("/api/staff-groups").catch(()=>({data:[]}))
]);
S.staffs=(st.data||[]).slice().sort((a,b)=>(a.order??a.id)-(b.order??b.id));
S.admins=ad.data||[];
S.booths=(bo.data||[]).slice().sort((a,b)=>a.id-b.id);
S.groups=Object.fromEntries((gr.data||[]).map(g=>[g.id,g.name]));
}
async function loadPred(){
const [a,b]=await Promise.all([api("/api/admin/predictive-booth/staffs"),api("/api/admin/predictive-booth/booth-count-summary").catch(()=>null)]);
S.predStaffs=(a.data||[]).map(r=>{const st=S.staffs.find(x=>x.id===r.id)||{};return {...r,groupId:st.groupId}});
if(b&&b.data)S.predSum=b.data;
}
const boothById=id=>S.booths.find(b=>b.id===id);
const usedBoothIds=()=>new Set([...S.staffs,...S.admins].map(x=>x.boothId).filter(v=>v!=null));
const freeBooths=()=>{const u=usedBoothIds();return S.booths.filter(b=>!u.has(b.id))};
/* ---------- UI helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg,bad){
const old=$("#toast");if(old)old.remove();
const d=document.createElement("div");d.id="toast";d.className="toast"+(bad?" bad":"");d.textContent=(bad?"⚠ ":"✓ ")+msg;
$("#layer").appendChild(d);setTimeout(()=>d.remove(),bad?7000:2600);
}
let busyN=0;
function busy(on){
busyN+=on?1:-1;
const ex=$("#busy");
if(busyN>0&&!ex){const d=document.createElement("div");d.id="busy";d.className="busy";d.innerHTML="<i></i>";$("#layer").appendChild(d)}
if(busyN<=0&&ex){ex.remove();busyN=0}
}
function confirmSheet({title,names,okLabel,release}){
return new Promise(res=>{
const sc=document.createElement("div");sc.className="scrim";
sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="box"><h2></h2><div class="names"></div></div><button class="btn go ${release?"release":""}" id="cOk"></button><button class="btn" id="cNo">キャンセル</button></div>`;
sc.querySelector("h2").textContent=title;sc.querySelector(".names").textContent=names;
const ok=sc.querySelector("#cOk");ok.textContent=okLabel;
const done=v=>{sc.remove();res(v)};
ok.onclick=()=>done(true);sc.querySelector("#cNo").onclick=()=>done(false);
sc.addEventListener("click",e=>{if(e.target===sc)done(false)});
$("#layer").appendChild(sc);ok.focus();
});
}
const hue=id=>(Number(id)*47)%360;
/* ---------- view model ---------- */
function rows(){
let src;
if(S.tab==="booth")src=S.target==="staff"?S.staffs:S.admins;else src=S.predStaffs;
const key=S.tab==="booth"?(r=>r.boothId!=null):(r=>r.predictiveBoothId!=null);
const q=S.q.trim().toLowerCase();
return src.filter(r=>{
if(S.filter==="on"&&!key(r))return false;
if(S.filter==="off"&&key(r))return false;
if(q&&!(`${r.name} ${r.loginId||""} ${S.groups[r.groupId]||""}`.toLowerCase().includes(q)))return false;
return true;
}).map(r=>({...r,_on:key(r)}));
}
const kind=()=>S.tab==="booth"?(S.target==="staff"?"staff":"admin"):"pred";
/* ---------- render ---------- */
function slotsHtml(total,used){
let h="";for(let i=0;i<total;i++)h+=`<i class="slot ${i<used?"used":""}"></i>`;return h;
}
function render(){
const authed=!!S.auth;
$("#login").hidden=authed;$("#main").hidden=!authed;$("#tabbar").hidden=!authed;
if(!authed){$("#dock").hidden=true;return}
$("#tabBooth").setAttribute("aria-selected",S.tab==="booth");
$("#tabPred").setAttribute("aria-selected",S.tab==="pred");
$("#title").textContent=S.tab==="booth"?"ブース割当":"プレディクティブ";
$("#bEdit").textContent=S.edit?"完了":"選択";
// 状況カード
const st=$("#status");
if(S.tab==="booth"){
const total=S.booths.length||CONTRACT_BOOTHS, used=usedBoothIds().size, free=Math.max(total-used,0);
const as=S.staffs.filter(x=>x.boothId!=null).length, aa=S.admins.filter(x=>x.boothId!=null).length;
st.innerHTML=`<div class="big"><b>${used}</b><span>/ ${total} ブース使用中</span><em class="${free===0?"full":""}">空き ${free}</em></div>
<div class="slots" aria-hidden="true">${slotsHtml(total,used)}</div>
<div class="facts"><span>スタッフ <b>${as}/${S.staffs.length}</b></span><span>管理者 <b>${aa}/${S.admins.length}</b></span></div>`;
}else{
const total=S.predSum.contractedBoothCount??PRED_BOOTHS, un=S.predSum.unassignedBoothCount;
const used=un==null?S.predStaffs.filter(r=>r.predictiveBoothId!=null).length:Math.max(total-un,0), free=Math.max(total-used,0);
st.innerHTML=`<div class="big"><b>${used}</b><span>/ ${total} プレディクティブブース使用中</span><em class="${free===0?"full":""}">空き ${free}</em></div>
<div class="slots" aria-hidden="true">${slotsHtml(total,used)}</div>
<div class="facts"><span>対象は通常ブースを持つスタッフ <b>${S.predStaffs.length}人</b></span></div>`;
}
// 絞り込み
$("#segTargetWrap").innerHTML=S.tab==="booth"
?`<div class="seg" id="segTarget"><button data-v="staff" aria-pressed="${S.target==="staff"}">スタッフ</button><button data-v="admin" aria-pressed="${S.target==="admin"}">管理者</button></div>`:"";
$("#segFilter").innerHTML=[["all","すべて"],["on","割当済み"],["off","未割当"]].map(([v,l])=>`<button data-v="${v}" aria-pressed="${S.filter===v}">${l}</button>`).join("");
// 選択セット(選択モードのときだけ)
$("#presets").innerHTML=S.edit
? S.presets.map((p,i)=>`<button class="pill" data-p="${i}">${esc(p.name)}<b>${p.ids.length}</b></button>`).join("")
+`<button class="pill" id="pSave">＋ 今の選択を保存</button>`+(S.presets.length?`<button class="pill" id="pDel" style="color:var(--red)">セットを削除</button>`:"")
: "";
// 一覧
const rs=rows(), k=kind(), L=$("#list");
if(!rs.length)L.innerHTML=`<div class="empty">該当する人がいません</div>`;
else L.innerHTML=rs.map(r=>{
const b=r.boothId!=null?boothById(r.boothId):null;
const g=S.groups[r.groupId]||"";
let tag;
if(k==="pred")tag=r._on?`<span class="tag on">プレディクティブ ${r.predictiveBoothId}</span>`:`<span class="tag">未割当</span>`;
else tag=b?`<span class="tag on">ブース ${esc(b.sipId)}</span>`:`<span class="tag">未割当</span>`;
return `<div class="row ${S.sel.has(r.id)?"sel":""}" data-id="${r.id}">
${S.edit?`<span class="chk" aria-hidden="true">${S.sel.has(r.id)?"✓":""}</span>`:""}
<span class="av" style="background:hsl(${hue(r.id)} 45% 48%)" aria-hidden="true">${esc([...String(r.name).trim()][0]||"?")}</span>
<div class="info"><div class="nm">${esc(r.name)}</div><div class="sb">${esc(g)}${g?" ・ ":""}ID ${esc(r.loginId||"")}</div>${tag}</div>
<button class="sw" role="switch" aria-checked="${r._on}" aria-label="${esc(r.name)}を${r._on?"解除":"割当"}"></button></div>`;
}).join("");
// 下の選択バー
const dock=$("#dock");dock.hidden=!S.edit;
const n=S.sel.size;
$("#dockInfo").textContent=n?`${n}人を選択中`:"人をタップして選択";
$("#bOn").disabled=!n;$("#bOff").disabled=!n;
$("#bOn").textContent=n?`${n}人を割当`:"割当";$("#bOff").textContent=n?`${n}人を解除`:"解除";
document.body.style.paddingBottom=`calc(var(--tab) + ${S.edit?170:40}px + env(safe-area-inset-bottom,0px))`;
}
function renderAdm(){
const html=`<a class="lrow" href="${ADMIN_URL}" target="_blank" rel="noopener"><span>リスナビ管理者画面を開く<small>案件1・リスト検索</small></span><span class="chev">›</span></a>
<button class="lrow" data-copy="id"><span>ログインIDをコピー<small>${esc(DEF.loginId)}</small></span><span class="chev">⧉</span></button>`;
$("#admLogin").innerHTML=html;$("#admMainBox").innerHTML=html;
}
/* ---------- actions ---------- */
function targets(){return rows().filter(r=>S.sel.has(r.id))}
async function refresh(){
busy(true);
try{await loadCore();if(S.tab==="pred")await loadPred();render()}
catch(e){toast(e.message,true)}
finally{busy(false)}
}
async function boothApply(list,assign){
const k=kind();
let payload=[];
if(assign){
const free=freeBooths();
const need=list.filter(r=>r.boothId==null);
if(!need.length){toast("すべて割当済みです");return}
if(need.length>free.length){toast(`空きブースが足りません（必要${need.length} / 空き${free.length}）。先に解除してください。`,true);return}
payload=need.map(r=>({id:r.id})); // 空きブースはリスナビ側が自動で当てる
}else{
payload=list.filter(r=>r.boothId!=null).map(r=>({id:r.id,boothId:r.boothId}));
if(!payload.length){toast("すべて未割当です");return}
}
busy(true);
try{
const path=k==="staff"?"/api/staff-booth":"/api/admin-booths";
const key=k==="staff"?"staffBoothAssignment":"adminBoothAssignment";
const j=await api(path,{method:"POST",body:{[key]:payload}});
const failed=j&&j.data&&j.data.failedUnassignStaffNames;
await loadCore();render();
const pool=k==="staff"?S.staffs:S.admins;
const miss=payload.filter(x=>{const r=pool.find(y=>y.id===x.id);const has=r&&r.boothId!=null;return assign?!has:has});
if(failed&&failed.length)toast("解除できませんでした（通話中など）: "+failed.join("、"),true);
else if(miss.length)toast(`${miss.length}件が反映されませんでした: `+miss.map(x=>(pool.find(y=>y.id===x.id)||{}).name).join("、")+"。リスナビの画面で確認してください",true);
else toast((assign?"割り当てました":"解除しました")+"（"+payload.length+"件）");
}catch(e){toast(e.message,true)}
finally{busy(false)}
}
async function predApply(list,on){
busy(true);
try{
await loadPred();
const cur=Object.fromEntries(S.predStaffs.map(r=>[r.id,r]));
const tg=list.map(r=>cur[r.id]).filter(Boolean);
const payload=on?tg.filter(r=>r.predictiveBoothId==null).map(r=>({boothId:r.boothId}))
:tg.filter(r=>r.predictiveBoothId!=null).map(r=>({boothId:r.boothId,predictiveBoothId:r.predictiveBoothId}));
if(!payload.length){render();toast(on?"すべて割当済みです":"すべて未割当です");return}
const free=S.predSum.unassignedBoothCount;
if(on&&free!=null&&payload.length>free){render();toast(`プレディクティブブースの空きが足りません（必要${payload.length} / 空き${free}）。先に解除してください。`,true);return}
await api("/api/admin/predictive-booth/staff-assignment",{method:"POST",body:payload});
await loadPred();render();
const now=Object.fromEntries(S.predStaffs.map(r=>[r.id,r]));
const bad=tg.filter(r=>{const n=now[r.id];const has=n&&n.predictiveBoothId!=null;return on?!has:has});
if(bad.length)toast(`${bad.length}件が反映されませんでした: `+bad.map(r=>r.name).join("、")+"。リスナビの画面で確認してください",true);
else toast("プレディクティブを"+(on?"割り当てました":"解除しました")+"（"+payload.length+"件）");
}catch(e){toast(e.message,true)}
finally{busy(false)}
}
async function bulk(on){
const list=targets();
if(!list.length){toast("対象を選んでください",true);return}
const word=on?"割当":"解除";
const where=S.tab==="booth"?(S.target==="staff"?"スタッフ":"管理者")+"のブース":"プレディクティブブース";
const ok=await confirmSheet({title:`${list.length}人を${word}します`,names:`${where}\n`+list.map(r=>r.name).join("、"),okLabel:`${word}する`,release:!on});
if(!ok)return;
if(S.tab==="booth")await boothApply(list,on);else await predApply(list,on);
S.sel.clear();render();
}
async function toggleOne(id){
const pool=S.tab==="booth"?(S.target==="staff"?S.staffs:S.admins):S.predStaffs;
const x=pool.find(x=>x.id===id);if(!x)return;
const r={...x,_on:S.tab==="booth"?x.boothId!=null:x.predictiveBoothId!=null};
if(S.tab==="booth")await boothApply([r],!r._on);else await predApply([r],!r._on);
}
/* ---------- events ---------- */
document.addEventListener("click",e=>{
const t=e.target;
if(t.closest("#segTarget button")){S.target=t.closest("button").dataset.v;store.set("lnv.target",S.target);S.sel.clear();render();return}
if(t.closest("#segFilter button")){S.filter=t.closest("button").dataset.v;render();return}
const sw=t.closest(".sw");if(sw){toggleOne(Number(sw.closest(".row").dataset.id));return}
const row=t.closest(".row");
if(row&&S.edit){const id=Number(row.dataset.id);S.sel.has(id)?S.sel.delete(id):S.sel.add(id);render();return}
const pc=t.closest("[data-p]");
if(pc){const p=S.presets[Number(pc.dataset.p)];S.sel=new Set(p.ids);render();toast(`「${p.name}」を選びました`);return}
if(t.closest("#pDel")){S.presets=[];store.set("lnv.presets",S.presets);render();return}
if(t.closest("#pSave")){if(!S.sel.size){toast("先に人を選んでください",true);return}savePresetSheet();return}
const cp=t.closest("[data-copy]");
if(cp){(async()=>{try{await navigator.clipboard.writeText(DEF.loginId);toast("ログインIDをコピーしました")}catch(x){toast("コピーできませんでした。手入力してください",true)}})();return}
});
function savePresetSheet(){
const sc=document.createElement("div");sc.className="scrim";
sc.innerHTML=`<div class="sheet"><div class="box"><h2>選択セットを保存</h2><div class="names">${S.sel.size}人を、あとから1タップで選べます（例: 午前シフト）</div><input class="nm2" id="pn" maxlength="20" placeholder="セット名"></div><button class="btn go" id="pok">保存</button><button class="btn" id="pno">キャンセル</button></div>`;
$("#layer").appendChild(sc);const inp=sc.querySelector("#pn");inp.focus();
const go=()=>{const n=inp.value.trim();if(!n)return;S.presets.push({name:n,ids:[...S.sel]});store.set("lnv.presets",S.presets);sc.remove();render()};
sc.querySelector("#pok").onclick=go;sc.querySelector("#pno").onclick=()=>sc.remove();
sc.addEventListener("click",e=>{if(e.target===sc)sc.remove()});
inp.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
}
$("#q").addEventListener("input",e=>{S.q=e.target.value;renderListOnly()});
function renderListOnly(){const y=window.scrollY;render();window.scrollTo(0,y)}
$("#tabBooth").onclick=()=>setTab("booth");
$("#tabPred").onclick=()=>setTab("pred");
async function setTab(t){if(S.tab===t)return;S.tab=t;store.set("lnv.tab",t);S.filter="all";S.sel.clear();render();window.scrollTo(0,0);if(t==="pred")await refresh()}
$("#bReload").onclick=()=>refresh();
$("#bOut").onclick=()=>doLogout(false);
$("#bEdit").onclick=()=>{S.edit=!S.edit;if(!S.edit)S.sel.clear();render()};
$("#bOn").onclick=()=>bulk(true);
$("#bOff").onclick=()=>bulk(false);
$("#bAll").onclick=()=>{rows().forEach(r=>S.sel.add(r.id));render()};
/* ---------- login ---------- */
function parseUrl(u){const m=String(u).match(/lisnavi\.com\/([^\/]+)\/([^\/]+)\/admin/);return m?{dbName:m[1],tenantUlId:m[2]}:null}
$("#loginForm").addEventListener("submit",async e=>{
e.preventDefault();
const err=$("#lErr");err.hidden=true;
const p=parseUrl($("#lUrl").value)||DEF;
const id=$("#lId").value.trim(), pw=$("#lPw").value;
$("#lGo").disabled=true;
try{
const token=await login(id,pw,p.dbName,p.tenantUlId);
S.auth={token,dbName:p.dbName,tenantUlId:p.tenantUlId,loginId:id};
store.set("lnv.auth",S.auth);store.set("lnv.url",$("#lUrl").value);
await refresh();
}catch(x){err.textContent=x.message;err.hidden=false}
finally{$("#lGo").disabled=false}
});
function doLogout(expired){
S.auth=null;store.del("lnv.auth");S.edit=false;S.sel.clear();render();
if(expired){const err=$("#lErr");err.textContent="ログインの有効期限が切れました。もう一度ログインしてください。";err.hidden=false}
}
/* ---------- boot ---------- */
$("#lUrl").value=store.get("lnv.url",`${BASE}/${DEF.dbName}/${DEF.tenantUlId}/admin/login`);
const last=store.get("lnv.auth",null);
$("#lId").value=(last&&last.loginId)||DEF.loginId;
renderAdm();render();
if(S.auth)refresh();
})();
</script>
</body>
</html>
