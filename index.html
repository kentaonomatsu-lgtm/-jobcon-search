<title>JCコールナビ｜ログイン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;background:#f2f7f2;color:#231815;font-size:15px;line-height:1.55;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:#fff;border-radius:16px;border-top:5px solid #168a27;box-shadow:0 4px 14px rgba(0,0,0,.10);padding:28px 22px 22px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.ic{width:44px;height:44px;border-radius:11px;background:linear-gradient(160deg,#168a27 0 60%,#44e34a 60% 100%);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center}
.logo b{display:block;font-size:20px;font-weight:900;font-style:italic;line-height:1.15}
.logo b span{color:#168a27}
.logo small{display:block;font-size:11px;font-weight:700;color:#6b7280}
label.f{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
input[type=password],input[type=text]{width:100%;height:48px;padding:0 14px;border:1.5px solid #d1d5db;border-radius:10px;font-size:16px;background:#f9fafb}
input:focus{outline:none;border-color:#168a27;background:#fff;box-shadow:0 0 0 3px rgba(22,138,39,.15)}
.keep{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:13px;color:#374151}
.keep input{width:18px;height:18px;accent-color:#168a27}
button.go{width:100%;height:48px;margin-top:14px;border-radius:10px;background:#168a27;color:#fff;font-size:16px;font-weight:800;border:none;cursor:pointer}
button.go:disabled{opacity:.6;cursor:default}
.err{min-height:22px;margin-top:10px;font-size:13px;font-weight:700;color:#dc2626}
.note{margin-top:8px;font-size:12px;color:#6b7280}
.busy{text-align:center;color:#6b7280;padding:24px 0}
</style>
</head>

<script>
(function(){
  'use strict';
  var KEEP_DAYS=30;
  var $=function(i){return document.getElementById(i)};
  var V=JSON.parse($('jc-vault').textContent), fails=0;
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function norm(s){return String(s).normalize('NFKC').trim()}
  function ui(mode,msg){
    $('busy').hidden=mode!=='busy'; $('fm').hidden=mode!=='form';
    $('err').textContent=msg||'';
    if(mode==='form'){ $('go').disabled=false; try{$('pw').focus()}catch(e){} }
  }
  function decrypt(pass){
    var s=window.crypto&&crypto.subtle;
    if(!s) return Promise.reject(new Error('NOCRYPTO'));
    var enc=new TextEncoder();
    return s.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']).then(function(km){
      return s.deriveKey({name:'PBKDF2',salt:b64(V.s),iterations:V.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){
      return s.decrypt({name:'AES-GCM',iv:b64(V.iv)},key,b64(V.ct));
    }).then(function(buf){return new TextDecoder().decode(buf)});
  }
  function save(pass,keep){
    try{sessionStorage.setItem('jc_pass',pass)}catch(e){}
    try{
      if(keep) localStorage.setItem('jc_pass_v1',JSON.stringify({p:pass,exp:Date.now()+KEEP_DAYS*86400000}));
      else localStorage.removeItem('jc_pass_v1');
    }catch(e){}
  }
  function forget(){try{sessionStorage.removeItem('jc_pass');localStorage.removeItem('jc_pass_v1')}catch(e){}}
  function stored(){
    try{
      var p=sessionStorage.getItem('jc_pass'); if(p) return p;
      var r=JSON.parse(localStorage.getItem('jc_pass_v1')||'null');
      if(r&&r.p&&r.exp>Date.now()) return r.p;
    }catch(e){}
    return '';
  }
  function show(html){document.open();document.write(html);document.close()}
  function fatal(e){
    ui('form', (e&&e.message==='NOCRYPTO')
      ? 'この環境では開けません。https:// のアドレスから、最新のブラウザで開いてください。'
      : 'ページを開けませんでした。再読み込みしてください。');
  }

  var auto=stored();
  if(auto){
    ui('busy');
    decrypt(auto).then(show,function(e){
      if(e&&e.message==='NOCRYPTO') return fatal(e);
      forget(); ui('form','パスワードが変更されています。もう一度入力してください。');
    });
  } else ui('form');

  $('fm').addEventListener('submit',function(ev){
    ev.preventDefault();
    var pass=norm($('pw').value), keep=$('keep').checked;
    if(!pass) return;
    $('go').disabled=true; $('err').textContent='確認しています…';
    decrypt(pass).then(function(html){ save(pass,keep); show(html); },function(e){
      if(e&&e.message==='NOCRYPTO') return fatal(e);
      fails++; $('pw').value='';
      var wait=Math.min(4000,500*Math.pow(2,fails-1));   // 連続で間違えるほど少し待たせる
      $('err').textContent='パスワードが違います。';
      setTimeout(function(){$('go').disabled=false;try{$('pw').focus()}catch(x){}},wait);
    });
  });
})();
</script>
</body>
</html>
