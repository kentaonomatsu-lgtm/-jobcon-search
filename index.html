<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>JCSearch｜ジョブコン求人サーチ</title>
<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --ink:#111827;
  --ink2:#374151;
  --sub:#6b7280;
  --line:#e5e7eb;
  --line2:#d1d5db;
  --pri:#1e9e42;
  --pri-d:#16803a;
  --pri-bg:#edfdf3;
  --pri-line:#86efac;
  --grn:#047857;
  --grn-bg:#ecfdf5;
  --grn-line:#6ee7b7;
  --or:#c2410c;
  --or-bg:#fff7ed;
  --or-line:#fdba74;
  --ylw:#92400e;
  --ylw-bg:#fffbeb;
  --ylw-line:#fcd34d;
  --red:#dc2626;
  --red-bg:#fef2f2;
  --gry:#f3f4f6;
  --outs:#1a3560;
  --outs-d:#122648;
  --outs-bg:#eff4ff;
  --outs-line:#93b4ef;
  --outs-accent:#f59e0b;
  --hd-h:56px;
  --qbar-h:52px;
  --nav-h:60px;
  --r:14px;
  --r-sm:10px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --sh-md:0 4px 12px rgba(0,0,0,.10),0 2px 4px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;scroll-behavior:smooth;}
body{
  font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:3px solid #3b82f6;outline-offset:2px;border-radius:4px;}

#loadbar{
  position:fixed;top:0;left:0;height:3px;
  background:linear-gradient(90deg,var(--pri),#4ade80);
  z-index:9999;transition:width .3s ease,opacity .5s ease;width:0;opacity:1;
}

header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--hd-h);background:#fff;
  border-bottom:1px solid var(--line);box-shadow:var(--sh);
  display:flex;align-items:center;gap:10px;
  padding:0 max(14px,env(safe-area-inset-left));
  padding-right:max(14px,env(safe-area-inset-right));
}
.hd-brand{display:flex;align-items:center;gap:8px;flex:none;}
.hd-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--pri),#16803a);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex:none;color:#fff;
  box-shadow:0 2px 6px rgba(30,158,66,.35);
  transition:background .3s;
}
body.outs-mode .hd-icon{background:linear-gradient(135deg,var(--outs),var(--outs-d));box-shadow:0 2px 6px rgba(26,53,96,.35);}
.hd-logo{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
.hd-logo span{color:var(--pri);transition:color .3s;}
body.outs-mode .hd-logo span{color:var(--outs);}
.hd-search{flex:1;min-width:0;position:relative;}
.hd-search input{
  width:100%;height:38px;padding:0 38px 0 14px;
  border:1.5px solid var(--line2);border-radius:30px;
  font-size:14px;background:var(--gry);transition:border-color .15s,background .15s;
}
.hd-search input:focus{outline:none;border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(30,158,66,.12);}
.hd-search-x{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  color:var(--sub);font-size:18px;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
}
.hd-cnt{
  flex:none;font-size:13px;font-weight:800;
  color:var(--pri);background:var(--pri-bg);
  border:1px solid var(--pri-line);padding:5px 10px;border-radius:20px;
  white-space:nowrap;transition:all .3s;
}
.hd-cnt b{font-size:17px;}
body.outs-mode .hd-cnt{color:var(--outs);background:var(--outs-bg);border-color:var(--outs-line);}

.hd-tel-wrap{
  display:flex;align-items:center;gap:4px;flex:none;
  background:var(--gry);border:1.5px solid var(--line2);
  border-radius:30px;padding:0 4px 0 12px;height:38px;
}
.hd-tel-wrap.ng-active{border-color:#dc2626;background:#fef2f2;}
.hd-tel-wrap.ok-active{border-color:#16803a;background:#edfdf3;}
.hd-tel-wrap input{border:none;background:none;width:190px;font-size:13px;color:var(--ink);}
.hd-tel-wrap input:focus{outline:none;}
.hd-tel-btn{height:30px;padding:0 10px;background:var(--ink);color:#fff;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap;flex:none;}
.hd-tel-btn:disabled{background:#aaa;cursor:not-allowed;}
.hd-tel-clr{height:30px;width:30px;color:var(--sub);font-size:16px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none;}
@media(max-width:700px){.hd-tel-wrap input{width:110px;}.hd-tel-btn{padding:0 8px;}}

.qbar{
  position:fixed;top:var(--hd-h);left:0;right:0;z-index:99;
  background:#fff;border-bottom:1px solid var(--line);
  height:var(--qbar-h);display:flex;align-items:center;
  gap:8px;padding:0 14px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.qbar::-webkit-scrollbar{display:none;}
.qb-chip{
  display:inline-flex;align-items:center;gap:5px;
  min-height:36px;padding:0 13px;
  border:1.5px solid var(--line2);background:#fff;
  border-radius:30px;font-size:13px;font-weight:700;
  color:var(--ink2);white-space:nowrap;flex:none;transition:all .15s;
}
.qb-chip.active{background:var(--pri);border-color:var(--pri);color:#fff;}
.qb-chip input{border:none;background:none;width:44px;text-align:center;font-size:13px;font-weight:800;color:inherit;padding:0;}
.qb-chip input::placeholder{color:rgba(0,0,0,.35);}
.qb-chip.active input::placeholder{color:rgba(255,255,255,.6);}
.qb-chip input:focus{outline:none;}
.qb-sep{width:1px;height:24px;background:var(--line2);flex:none;margin:0 2px;}
.qb-sort{
  display:inline-flex;align-items:center;gap:4px;
  min-height:36px;padding:0 11px;
  border:1.5px solid var(--line2);border-radius:30px;
  font-size:13px;font-weight:700;color:var(--ink2);
  white-space:nowrap;flex:none;background:#fff;
}
.qb-sort select{border:none;background:none;padding:0;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;appearance:none;-webkit-appearance:none;}
.qb-clear-pill{
  display:inline-flex;align-items:center;min-height:36px;padding:0 13px;
  border:1.5px solid var(--red);background:var(--red-bg);
  border-radius:30px;font-size:13px;font-weight:800;color:var(--red);white-space:nowrap;flex:none;
}

/* ===== PC メインタブ ===== */
.main-tabs{
  display:none;
  margin-bottom:12px;
  background:#fff;border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);
}
.main-tab-btn{
  flex:1;min-height:48px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;font-weight:800;color:var(--sub);
  border-right:1px solid var(--line);transition:all .15s;background:#fff;
}
.main-tab-btn:last-child{border-right:none;}
.main-tab-btn.active{background:var(--pri);color:#fff;}
.main-tab-btn.active.outs-btn{background:var(--outs);color:#fff;}
.main-tab-badge{
  font-size:11px;font-weight:800;
  padding:2px 8px;border-radius:20px;
  background:rgba(0,0,0,.08);color:inherit;
  display:none;
}
.main-tab-btn.active .main-tab-badge{display:inline;background:rgba(255,255,255,.25);color:#fff;}
@media(min-width:769px){.main-tabs{display:flex;}}

/* ===== アウトソバナー（メイン上部） ===== */
.outs-banner{
  display:none;align-items:center;gap:10px;
  background:linear-gradient(135deg,var(--outs),var(--outs-d));
  color:#fff;border-radius:var(--r-sm);
  padding:11px 16px;margin-bottom:10px;
  box-shadow:var(--sh-md);
}
.outs-banner.show{display:flex;}
.outs-banner-icon{font-size:22px;}
.outs-banner-text{flex:1;}
.outs-banner-title{font-size:14px;font-weight:800;}
.outs-banner-sub{font-size:11.5px;opacity:.8;font-weight:700;margin-top:1px;}

/* ===== ★ アウトソ採用可能バナー（カード内・求人一覧タブ用） ===== */
.outs-available-banner{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(90deg,#1a3560,#1e4d8c);
  padding:10px 14px;
  border-bottom:3px solid var(--outs-accent);
}
.oab-icon{font-size:20px;flex:none;}
.oab-body{flex:1;}
.oab-title{
  font-size:13px;font-weight:900;color:#fff;
  letter-spacing:.02em;
}
.oab-title em{
  color:var(--outs-accent);font-style:normal;
  font-size:15px;
}
.oab-sub{font-size:11px;color:rgba(255,255,255,.75);font-weight:700;margin-top:1px;}
.oab-badge{
  flex:none;
  background:var(--outs-accent);color:#1a1a1a;
  font-size:11px;font-weight:900;
  padding:4px 10px;border-radius:20px;
  white-space:nowrap;
}

/* ===== ボトムナビ ===== */
.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:var(--nav-h);background:#fff;
  border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.08);
  padding-bottom:env(safe-area-inset-bottom);
}
.bn-inner{display:flex;height:100%;}
.bn-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:10px;font-weight:700;color:var(--sub);transition:color .15s;padding-bottom:2px;
}
.bn-tab.active{color:var(--pri);}
.bn-tab.active.outs-tab{color:var(--outs);}
.bn-icon{font-size:22px;line-height:1;}
.bn-badge{
  position:absolute;top:-2px;right:-4px;
  background:var(--red);color:#fff;font-size:10px;font-weight:800;
  min-width:18px;height:18px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  padding:0 4px;border:2px solid #fff;
}
.bn-tab .rel{position:relative;display:inline-block;}

.layout{
  display:flex;padding-top:calc(var(--hd-h) + var(--qbar-h));
  min-height:100vh;max-width:1400px;margin:0 auto;
}

.side{
  width:280px;flex:none;
  position:sticky;top:calc(var(--hd-h) + var(--qbar-h));
  height:calc(100vh - var(--hd-h) - var(--qbar-h));
  overflow-y:auto;padding:14px;
  display:flex;flex-direction:column;gap:10px;
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
}
.side::-webkit-scrollbar{width:4px;}
.side::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);}
.panel.dorm-panel{background:linear-gradient(135deg,#fff7ed,#fff);border:1.5px solid var(--or-line);}
.panel-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.panel-t{font-size:13px;font-weight:800;color:var(--ink);}
.panel-clr{font-size:12px;color:var(--pri);font-weight:700;text-decoration:underline;}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.tile{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;transition:all .12s;cursor:pointer;}
.tile.on{background:var(--or);border-color:var(--or);}
.t-l{font-size:11.5px;font-weight:800;color:#9a3412;margin-bottom:3px;}
.t-c{font-size:18px;font-weight:800;color:var(--or);}
.tile.on .t-l,.tile.on .t-c{color:#fff;}
.tile.on .t-l::before{content:"✓ ";}

.age-row{display:flex;gap:6px;align-items:center;}
.age-btn{width:44px;height:44px;border:2px solid var(--line);background:var(--gry);border-radius:10px;font-size:22px;font-weight:800;color:var(--sub);flex:none;}
.age-in{flex:1;height:44px;text-align:center;font-size:20px;font-weight:800;border:2px solid var(--line);border-radius:10px;}
.age-in.set{background:var(--ylw-bg);border-color:var(--ylw-line);color:var(--ylw);}
.hint{font-size:12px;color:var(--sub);margin-top:7px;line-height:1.5;}

.tabs{display:flex;gap:6px;}
.tab{flex:1;min-height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:800;color:var(--sub);text-align:center;transition:all .12s;}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.tab.on::before{content:"✓ ";}

.sal-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.sal-in{width:80px;height:44px;text-align:center;font-size:20px;font-weight:800;border:2px solid var(--line);border-radius:10px;}
.sal-in.set{background:var(--grn-bg);border-color:var(--grn-line);color:var(--grn);}
.sal-u{font-size:13px;color:var(--sub);font-weight:800;}
input[type=range]{width:100%;-webkit-appearance:none;height:8px;background:var(--line);border-radius:4px;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--grn);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);}

.chk-list{display:flex;flex-direction:column;gap:5px;}
.co-search{width:100%;height:40px;border:1.5px solid var(--line2);border-radius:9px;font-size:13px;font-weight:700;padding:0 12px;margin-bottom:8px;background:var(--gry);}
.co-search:focus{outline:none;border-color:var(--pri);background:#fff;}
.co-list-wrap{max-height:260px;overflow-y:auto;}
.chk{display:flex;align-items:center;justify-content:space-between;min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer;transition:all .12s;}
.chk.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.chk.on .chk-lab::before{content:"✓ ";}
.chk-c{font-size:12px;font-weight:800;color:var(--sub);background:var(--gry);padding:2px 8px;border-radius:20px;flex:none;}
.chk.on .chk-c{background:rgba(255,255,255,.25);color:#fff;}

.area-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--sh);margin-bottom:10px;}
.regions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.reg{min-height:38px;padding:0 13px;border:2px solid var(--line);background:#fff;border-radius:30px;font-size:12.5px;font-weight:800;color:var(--ink2);cursor:pointer;transition:all .12s;}
.reg.act{background:var(--pri);border-color:var(--pri);color:#fff;}
.reg.has{border-color:var(--pri);color:var(--pri);background:var(--pri-bg);}
.reg b{font-size:10.5px;opacity:.7;margin-left:3px;}
.prefs-wrap{display:flex;flex-wrap:wrap;gap:5px;padding-top:8px;border-top:1.5px dashed var(--line);}
.prefs-wrap:empty{display:none;}
.pref{min-height:36px;padding:0 11px;border:1.5px solid var(--line);background:var(--gry);border-radius:8px;font-size:12.5px;font-weight:800;color:var(--ink2);cursor:pointer;transition:all .12s;}
.pref.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.pref.on::before{content:"✓ ";}
.pref b{font-size:10.5px;opacity:.7;margin-left:2px;}
.area-hint{font-size:12px;color:var(--sub);margin-top:6px;}

.active-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;}
.active-bar:empty{display:none;}
.af-label{font-size:11.5px;font-weight:800;color:var(--sub);}
.af{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid var(--pri);color:var(--pri);min-height:32px;padding:0 4px 0 10px;border-radius:30px;font-size:12.5px;font-weight:800;box-shadow:var(--sh);}
.af button{color:var(--pri);font-size:16px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;}

.count-bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 13px;box-shadow:var(--sh);margin-bottom:10px;}
.cnt-text{font-size:13px;font-weight:700;color:var(--sub);}
.cnt-text b{font-size:18px;color:var(--ink);font-weight:800;}
.cnt-sp{flex:1;}

.main{flex:1;min-width:0;padding:14px;}

.cards{display:flex;flex-direction:column;gap:10px;}
mark.hit{background:#fef08a;color:inherit;padding:0 1px;border-radius:2px;font-weight:800;}

/* ===== カード ===== */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:box-shadow .15s;
}
.card:hover{box-shadow:var(--sh-md);}

/* ★ アウトソ対象カードは左ボーダーを強調 */
.card.outs-card{
  border-left:4px solid var(--outs);
}

.quota-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 13px;font-weight:900;font-size:13px;}
.quota-banner.qb-group{display:block;border:2px dashed rgba(255,255,255,.6);}
.quota-banner.qb-group.qb-mid,.quota-banner.qb-group.qb-none{border-color:rgba(0,0,0,.2);}
.qb-group-row{margin:0 0 3px;}
.qb-group-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.02em;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.25);}
.quota-banner.qb-group.qb-mid .qb-group-tag,.quota-banner.qb-group.qb-none .qb-group-tag{background:rgba(0,0,0,.07);}
.qb-main-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.quota-banner .qb-label{font-size:12px;opacity:.85;}
.quota-banner .qb-num{font-size:18px;line-height:1;}
.quota-banner .qb-num b{font-size:24px;margin:0 2px;}
.quota-banner .qb-total{font-size:12px;opacity:.8;}
.qb-out{background:var(--red);color:#fff;}
.qb-low{background:var(--or);color:#fff;}
.qb-mid{background:#fde68a;color:#7c4a03;}
.qb-full{background:var(--grn);color:#fff;}
.qb-none{background:var(--gry);color:#6b7280;}

.sal-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 13px;font-weight:900;font-size:13px;}
.sal-banner .sb-label{font-size:11.5px;opacity:.85;}
.sal-banner .sb-num{font-size:18px;line-height:1;}
.sal-banner .sb-num b{font-size:24px;margin:0 2px;}
.sb-m{background:var(--grn-bg);color:var(--grn);border-bottom:1px solid var(--grn-line);}
.sb-h{background:#e0f2fe;color:#0e7490;border-bottom:1px solid #7dd3fc;}

.c-top{padding:13px 14px;display:flex;gap:12px;align-items:flex-start;}
.c-l{flex:1;min-width:0;}
.c-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
.c-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.badge{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:6px;}
.badge.pri{background:var(--gry);color:var(--sub);border:1px solid var(--line);}
.badge.outs{background:var(--outs-bg);color:var(--outs);border:1px solid var(--outs-line);}
.c-co{font-size:16px;font-weight:800;line-height:1.35;word-break:break-all;}
.c-ti{font-size:12.5px;color:#4b5563;margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
.sal-block{background:var(--grn-bg);border:1.5px solid var(--grn-line);border-radius:11px;padding:8px 12px;text-align:right;min-width:130px;}
.sal-tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;margin-bottom:2px;}
.sal-tag.h{background:#0e7490;color:#fff;}
.sal-tag.m{background:#047857;color:#fff;}
.sal-n{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
.sal-un{font-size:12.5px;font-weight:800;}
.sal-main{display:flex;align-items:baseline;justify-content:flex-end;gap:2px;color:var(--grn);}

.c-id{font-size:12px;font-weight:800;color:var(--sub);background:var(--gry);border:1.5px solid var(--line);min-height:36px;padding:0 10px;border-radius:8px;white-space:nowrap;cursor:pointer;transition:all .15s;}
.c-id.ok{background:#059669;border-color:#059669;color:#fff;}
/* 仕事No.（カード上に常時表示・タップでコピー） */
.c-jn{display:flex;align-items:center;gap:6px;width:100%;margin-top:6px;padding:5px 9px;text-align:left;font-family:inherit;background:var(--gry);border:1.5px solid var(--line);border-radius:8px;cursor:pointer;transition:all .15s;}
.c-jn .jn-l{flex-shrink:0;font-size:10.5px;font-weight:800;color:var(--sub);}
.c-jn .jn-v{flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--ink);word-break:break-all;line-height:1.35;}
.c-jn .jn-c{flex-shrink:0;font-size:10.5px;font-weight:800;color:var(--sub);}
.c-jn.ok{background:#059669;border-color:#059669;}
.c-jn.ok .jn-l,.c-jn.ok .jn-v,.c-jn.ok .jn-c{color:#fff;}

.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
.pill{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:30px;white-space:nowrap;}
.pill.loc{background:var(--pri-bg);color:var(--pri);}
.pill.age{background:var(--ylw-bg);color:var(--ylw);}
.pill.age.ng{background:var(--red-bg);color:var(--red);border:1.5px solid #fca5a5;}
.pill.gen{background:var(--pri-bg);color:var(--pri);}
.pill.dorm{background:var(--grn-bg);color:var(--grn);}
.pill.free{background:var(--or);color:#fff;}
.pill.sub{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;}
.pill.bx{background:var(--or-bg);color:var(--or);border:1px solid var(--or-line);}
.pill.sf,.pill.emp{background:var(--gry);color:#374151;}

.c-meta{font-size:11.5px;color:#6b7280;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.c-foot{display:flex;gap:7px;align-items:center;padding:0 14px 12px;flex-wrap:wrap;}
.c-btn{min-height:38px;padding:0 13px;border:1.5px solid var(--line);background:#fff;border-radius:9px;font-size:13px;font-weight:800;color:var(--ink2);display:inline-flex;align-items:center;transition:all .12s;}
.c-btn:hover{background:var(--gry);}
.c-btn.go{background:var(--pri);border-color:var(--pri);color:#fff;}
.c-btn.go:hover{background:var(--pri-d);}
.c-maker{display:inline-flex;align-items:center;font-size:12px;font-weight:800;color:var(--sub);background:var(--gry);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-height:38px;white-space:nowrap;}

.det{display:none;padding:12px 14px;background:var(--gry);border-top:1px solid var(--line);font-size:13px;line-height:1.7;}
.det.open{display:block;}
.det dt{font-size:11.5px;font-weight:800;color:var(--sub);margin-top:8px;}
.det dt:first-child{margin-top:0;}
.det dd{color:var(--ink2);}

.empty{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:48px 20px;text-align:center;color:var(--sub);}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px;}

.more-text{text-align:center;padding:10px;color:var(--sub);font-size:12.5px;font-weight:700;}
.load-more{display:block;width:100%;min-height:48px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:14px;font-weight:800;color:var(--ink2);margin-top:4px;}

@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.skel{background:linear-gradient(90deg,#f0f0f0 25%,#f8f8f8 50%,#f0f0f0 75%);background-size:600px 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
.skel-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);}
.skel-line{height:14px;margin-bottom:8px;}
.skel-line.w80{width:80%;}.skel-line.w60{width:60%;}.skel-line.w40{width:40%;}

ruby{ruby-position:over;}
ruby rt{font-size:58%;opacity:.85;font-weight:700;letter-spacing:0;}

.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;opacity:0;transition:opacity .25s;}
.drawer-overlay.open{display:block;opacity:1;}
.drawer{position:fixed;bottom:0;left:0;right:0;z-index:201;background:#fff;border-radius:20px 20px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);}
.drawer.open{transform:translateY(0);}
.drawer-handle{width:40px;height:5px;background:var(--line2);border-radius:3px;margin:10px auto 0;flex:none;}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);flex:none;}
.drawer-title{font-size:16px;font-weight:800;}
.drawer-close{font-size:24px;color:var(--sub);width:36px;height:36px;display:flex;align-items:center;justify-content:center;}
.drawer-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:max(24px,env(safe-area-inset-bottom));}
.drawer-body .panel{box-shadow:none;}

@media(max-width:768px){
  :root{--hd-h:52px;--qbar-h:48px;--nav-h:60px;}
  .layout{flex-direction:column;padding-bottom:var(--nav-h);}
  .side{display:none;}
  .bottom-nav{display:block;}
  .main{padding:10px;}
  .hd-logo{display:none;}
  .hd-cnt{display:none;}
  .c-top{flex-direction:column;gap:10px;}
  .c-r{flex-direction:row;align-items:center;width:100%;justify-content:space-between;}
  .sal-block{min-width:0;flex:1;text-align:left;}
  .sal-main{justify-content:flex-start;}
  .qbar{gap:6px;padding:0 10px;}
  .qb-chip{min-height:34px;padding:0 10px;font-size:12.5px;}
  .qb-chip input{width:38px;font-size:12.5px;}
  /* スマホでもアウトソバナーを読みやすく */
  .oab-title{font-size:12px;}
  .oab-title em{font-size:13px;}
  .oab-badge{font-size:10px;padding:3px 8px;}
}
@media(min-width:769px){.drawer,.drawer-overlay,.bottom-nav{display:none !important;}}
@media(min-width:769px) and (max-width:1080px){.side{width:240px;}}

/* ===== 住所から近い順 ===== */
.near-wrap{display:inline-flex;align-items:center;flex:none;}
.near-chip{border-color:var(--or)!important;color:var(--or);background:var(--or-bg);font-weight:800;max-width:200px;}
.near-chip #nearTxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.near-wrap.on .near-chip{background:var(--or);color:#fff;border-radius:30px 0 0 30px;border-right:none;}
.near-x{min-height:36px;width:36px;border:1.5px solid var(--or);background:#9a3412;color:#fff;border-radius:0 30px 30px 0;font-size:14px;font-weight:800;flex:none;}
.near-x[hidden]{display:none;}
.near-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 13px;font-weight:900;font-size:13px;}
.near-banner .nb-l{font-size:12px;opacity:.9;}
.near-banner .nb-v{font-size:18px;line-height:1.15;text-align:right;}
.near-banner .nb-v small{font-size:11.5px;opacity:.85;font-weight:800;margin-left:6px;}
.nb-1{background:var(--grn);color:#fff;}
.nb-2{background:#fde68a;color:#7c4a03;}
.nb-3{background:var(--or);color:#fff;}
.nb-4{background:#6b7280;color:#fff;}
.nb-0{background:var(--gry);color:#6b7280;}
.ns-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;opacity:0;transition:opacity .2s;}
.ns-overlay.open{display:block;opacity:1;}
.ns{position:fixed;z-index:301;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .28s cubic-bezier(.32,.72,0,1),visibility 0s linear .28s;}
.ns.open{transform:translateY(0);visibility:visible;transition:transform .28s cubic-bezier(.32,.72,0,1),visibility 0s;}
.ns-handle{width:40px;height:5px;background:var(--line2);border-radius:3px;margin:10px auto 0;flex:none;}
.ns-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex:none;}
.ns-title{font-size:17px;font-weight:900;}
.ns-x{font-size:22px;color:var(--sub);width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.ns-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 10px;display:flex;flex-direction:column;gap:8px;}
.ns-lab{font-size:12.5px;font-weight:800;color:var(--ink2);margin-top:4px;}
.ns select,.ns input{width:100%;height:50px;border:2px solid var(--line2);border-radius:12px;padding:0 12px;font-size:16px;background:#fff;}
.ns select:focus,.ns input:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(194,65,12,.12);}
.ns-sel{font-size:13.5px;font-weight:800;color:var(--or);min-height:0;}
.ns-sel:empty{display:none;}
.ns-cands{display:flex;flex-wrap:wrap;gap:8px;max-height:min(36vh,280px);overflow-y:auto;padding:2px;}
.ns-c{min-height:46px;padding:0 15px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:15px;font-weight:800;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;}
.ns-c:active{background:var(--or-bg);}
.ns-c.on{background:var(--or);border-color:var(--or);color:#fff;}
.ns-c small{font-size:11px;color:var(--sub);font-weight:700;}
.ns-c.on small{color:rgba(255,255,255,.85);}
.ns-c i{font-style:normal;font-size:10.5px;background:var(--gry);color:var(--sub);padding:1px 6px;border-radius:10px;}
.ns-empty{font-size:13px;color:var(--sub);padding:10px 2px;}
.ns-note{font-size:11.5px;color:var(--sub);line-height:1.6;}
.ns-foot{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none;}
.ns-go{flex:1;min-height:54px;border-radius:14px;background:var(--or);color:#fff;font-size:16px;font-weight:900;}
.ns-go:disabled{background:#d1d5db;cursor:not-allowed;}
.ns-reset{min-height:54px;padding:0 18px;border:1.5px solid var(--red);color:var(--red);background:#fff;border-radius:14px;font-size:14px;font-weight:800;}
.ns-reset[hidden]{display:none;}
#nearToast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:800;z-index:400;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;}
@media(min-width:769px){
  .ns{left:50%;right:auto;bottom:auto;top:50%;width:540px;max-height:82vh;border-radius:18px;transform:translate(-50%,-46%);opacity:0;transition:transform .2s,opacity .2s,visibility 0s linear .2s;}
  .ns.open{transform:translate(-50%,-50%);opacity:1;transition:transform .2s,opacity .2s,visibility 0s;}
  .ns-handle{display:none;}
}
</style>
</head>
<body>

<div id="loadbar"></div>

<header>
  <div class="hd-brand">
    <div class="hd-icon">🔍</div>
    <div class="hd-logo">ジョブコン<span>サーチ</span></div>
  </div>
  <div class="hd-search">
    <input id="kw" type="search" placeholder="社名・地域・職種・案件ID・仕事No.で検索（スペースでAND）"
      aria-label="キーワード検索" oninput="setKw(this.value)" autocomplete="off">
    <button class="hd-search-x" id="kwx" aria-label="検索をクリア"
      onclick="setKw('');document.getElementById('kw').value='';" hidden>×</button>
  </div>
  <div class="hd-cnt" aria-live="polite"><b id="hc">-</b> / <span id="ht">-</span>件</div>
  <div class="hd-tel-wrap" id="hdTelWrap">
    <input id="hdTelInput" type="tel" inputmode="numeric" placeholder="電話番号で送客可否チェック"
      aria-label="電話番号で送客可否チェック" autocomplete="tel"
      onkeydown="if(event.key==='Enter')checkTel()">
    <button class="hd-tel-btn" id="hdTelBtn" onclick="checkTel()">チェック</button>
    <button class="hd-tel-clr" id="hdTelClr" onclick="clearTelCheck()" hidden aria-label="クリア">✕</button>
  </div>
</header>

<div class="qbar" aria-label="クイック絞り込み">
  <span class="near-wrap" id="nearWrap">
    <button class="qb-chip near-chip" id="nearBtn" onclick="openNear()" aria-label="住所から近い順に並べ替え"><span>📍</span><span id="nearTxt">住所から近い順</span></button>
    <button class="near-x" id="nearClr" onclick="clearNear()" hidden aria-label="住所を解除">✕</button>
  </span>

  <button class="qb-chip" id="hdRefreshBtn" onclick="manualRefresh()">
    <span id="hdRefreshLabel">⟳ 更新</span>
  </button>
  <a class="qb-chip" href="./script.html"
     style="background:#1a3560;color:#fff;border-color:#1a3560;text-decoration:none;">📞 架電スクリプト</a>
  <div class="qb-sep"></div>
  <label class="qb-chip" id="qb-age-chip">
    <span>年齢</span>
    <input class="age-sync" id="qb-age-in" type="number" inputmode="numeric"
      placeholder="45" min="15" max="80" oninput="onAge(this.value)" aria-label="年齢">
    <span>歳〜</span>
  </label>
  <button class="qb-chip gender-sync" data-g="男性" onclick="setGender('男性')" aria-pressed="false">男性</button>
  <button class="qb-chip gender-sync" data-g="女性" onclick="setGender('女性')" aria-pressed="false">女性</button>
  <div class="qb-sep"></div>
  <label class="qb-chip" id="qb-sal-chip">
    <span>給与</span>
    <input class="sal-sync" id="qb-sal-in" type="number" inputmode="numeric"
      value="0" min="0" max="50" oninput="setSal(this.value)" aria-label="希望給与">
    <span>万〜</span>
  </label>
  <div class="qb-sep"></div>
  <div class="qb-sort">
    ↕
    <select id="sort" aria-label="並び順" onchange="setSort(this.value)">
      <option value="pri">優先順位</option>
      <option value="near">近い順</option>
      <option value="sal_h">給与↑</option>
      <option value="sal_l">給与↓</option>
      <option value="bonus">祝い金</option>
    </select>
  </div>
  <button class="qb-clear-pill" id="qbclear" onclick="resetAll()" hidden>✕ クリア</button>
</div>

<!-- ボトムナビ -->
<div class="bottom-nav">
  <div class="bn-inner">
    <button class="bn-tab active" id="bn-list" onclick="showView('list')">
      <span class="bn-icon">📋</span><span>求人一覧</span>
    </button>
    <button class="bn-tab" id="bn-outsource" onclick="showView('outsource')">
      <span class="bn-icon">🏢</span><span>アウトソ</span>
    </button>
    <button class="bn-tab" id="bn-filter" onclick="openDrawer()">
      <span class="rel">
        <span class="bn-icon">🔧</span>
        <span class="bn-badge" id="filter-badge" hidden>0</span>
      </span>
      <span>絞り込み</span>
    </button>
    <button class="bn-tab" id="bn-area" onclick="showView('area')">
      <span class="bn-icon">📍</span><span>エリア</span>
    </button>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="絞り込み条件">
  <div class="drawer-handle"></div>
  <div class="drawer-head">
    <span class="drawer-title">🔧 絞り込み</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<div class="layout">
  <aside class="side" id="sidePanel"></aside>
  <main class="main">

    <!-- PC タブ -->
    <div class="main-tabs" id="mainTabs">
      <button class="main-tab-btn active" id="pc-tab-list" onclick="switchMainTab('list')">
        📋 求人一覧
        <span class="main-tab-badge" id="pc-badge-list">-</span>
      </button>
      <button class="main-tab-btn outs-btn" id="pc-tab-outsource" onclick="switchMainTab('outsource')">
        🏢 アウトソーシング事業部
        <span class="main-tab-badge" id="pc-badge-outs">-</span>
      </button>
    </div>

    <!-- アウトソタブ用バナー -->
    <div class="outs-banner" id="outsBanner">
      <span class="outs-banner-icon">🏢</span>
      <div class="outs-banner-text">
        <div class="outs-banner-title">アウトソーシング事業部 可能求人</div>
        <div class="outs-banner-sub">トリプルエース株式会社 ／ 予算フラグ 1 の求人のみ表示</div>
      </div>
    </div>

    <!-- エリア -->
    <div id="area-section">
      <div class="area-card">
        <div class="regions" id="regs"></div>
        <div class="prefs-wrap" id="prefs"></div>
        <div class="area-hint" id="areahint"></div>
      </div>
    </div>

    <div class="active-bar" id="active"></div>

    <div class="count-bar">
      <span class="cnt-text"><b id="bc">-</b> / <span id="bt">-</span>件</span>
      <span class="cnt-sp"></span>
      <span id="hdUpdated" style="font-size:11.5px;color:var(--sub);font-weight:700;">読込中…</span>
    </div>

    <!-- 通常一覧 -->
    <div class="cards" id="cards">
      <div class="skel-card"><div class="skel skel-line w80"></div><div class="skel skel-line w60"></div><div class="skel skel-line w40"></div></div>
      <div class="skel-card"><div class="skel skel-line w80"></div><div class="skel skel-line w60"></div><div class="skel skel-line w40"></div></div>
      <div class="skel-card"><div class="skel skel-line w80"></div><div class="skel skel-line w60"></div><div class="skel skel-line w40"></div></div>
    </div>

    <!-- アウトソ一覧 -->
    <div class="cards" id="cards-outsource" style="display:none;"></div>

    <div class="more-text" id="more"></div>
    <button id="loadMoreBtn" class="load-more" onclick="loadMore()" hidden>さらに読み込む ▼</button>

/* ===== タブ切り替え ===== */
function switchMainTab(tab){
  _currentView=tab;
  const isOuts=tab==="outsource";
  $("pc-tab-list").classList.toggle("active",!isOuts);
  $("pc-tab-outsource").classList.toggle("active",isOuts);
  $("cards").style.display=isOuts?"none":"";
  $("cards-outsource").style.display=isOuts?"":"none";
  $("outsBanner").classList.toggle("show",isOuts);
  document.body.classList.toggle("outs-mode",isOuts);
  updateCounts();
  if(isOuts) renderOuts(); else render();
}

/* ===== 送客可否チェック ===== */
async function checkTel(){
  const tel=($("hdTelInput").value||"").trim().replace(/[－\-\s]/g,"");
  if(!tel){alert("電話番号を入力してください");return;}
  if(_telChecking) return;
  _telChecking=true;
  const btn=$("hdTelBtn");btn.disabled=true;btn.textContent="検索中…";
  try{
    const res=await fetch(CHECK_API_URL,{method:"POST",headers:{"Content-Type":"application/json","ngrok-skip-browser-warning":"1"},body:JSON.stringify({tel})});
    const data=await res.json();
    if(!data.success) throw new Error(data.error||"エラー");
    NG_COMPANIES=new Set(data.ngCompanies||[]);
    showTelBanner(data);renderAll();
    const wrap=$("hdTelWrap");wrap.classList.remove("ng-active","ok-active");
    if(NG_COMPANIES.size>0) wrap.classList.add("ng-active"); else wrap.classList.add("ok-active");
    $("hdTelClr").hidden=false;
  }catch(e){alert("取得エラー："+e.message);}
  finally{_telChecking=false;btn.disabled=false;btn.textContent="チェック";}
}
function showTelBanner(data){
  const ng=(data.applications||[]).filter(a=>a.period==="1month"||a.period==="3months");
  const isNG=ng.length>0;
  let badge=$("hdTelBadge");
  if(!badge){badge=document.createElement("span");badge.id="hdTelBadge";badge.style.cssText="font-size:12px;font-weight:800;white-space:nowrap;";$("hdTelWrap").insertBefore(badge,$("hdTelClr"));}
  badge.textContent=isNG?`NG ${ng.length}社`:data.total===0?"履歴なし":"送客可";
  badge.style.color=isNG?"#dc2626":"#16803a";
  let toast=$("telToast");
  if(!toast){toast=document.createElement("div");toast.id="telToast";toast.style.cssText="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:800;z-index:300;opacity:0;transition:opacity .3s;white-space:nowrap;";document.body.appendChild(toast);}
  toast.textContent=isNG?`NG ${ng.length}社を除外 → ${data.total-ng.length}件表示`:data.total===0?"応募履歴なし → 全件表示":"送客可 → 全件表示";
  toast.style.opacity="1";clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>{toast.style.opacity="0";},3000);
}
function clearTelCheck(){
  NG_COMPANIES=new Set();$("hdTelInput").value="";$("hdTelClr").hidden=true;
  $("hdTelWrap").classList.remove("ng-active","ok-active");
  const badge=$("hdTelBadge");if(badge) badge.textContent="";
  renderAll();
}

function lbStart(){const b=$("loadbar");b.style.width="0";b.style.opacity="1";b.style.transition="width 2s ease";requestAnimationFrame(()=>{b.style.width="80%";});}
function lbDone(){const b=$("loadbar");b.style.transition="width .2s ease,opacity .5s ease .2s";b.style.width="100%";setTimeout(()=>{b.style.opacity="0";},300);}

function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w.addEventListener('statechange',()=>{if(w.state==='activated') location.reload();});});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('message',async e=>{
    if(e.data&&e.data.type==='DATA_UPDATED'){
      try{const res=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});const data=await res.json();if(data&&Array.isArray(data.jobs)&&data.jobs.length>0&&(!LAST_UPDATED_AT||(data.updatedAt||'')>=LAST_UPDATED_AT)){ALL_JOBS=data.jobs;LAST_UPDATED_AT=data.updatedAt||null;renderAll();showUpdatedDate(true);}}catch(err){}
    }
  });
}

/* ===== 自動更新（手動ボタン不要）=====
   ・AUTO_POLL_MS おきに data.json を裏で再フェッチ → SW が中身の変化を検知して
     DATA_UPDATED を通知 → 上の registerSW() のリスナーが自動で再描画する。
   ・タブに戻ってきた瞬間（visibilitychange）にも即チェックし、体感の遅延を減らす。
   ・GASのライブAPIも LIVE_CHECK_MS おきにバックグラウンドで確認し、
     GitHub側の同期が万一止まっていても取りこぼさないようにする（安全網）。 */
const AUTO_POLL_MS  = 60 * 1000;      // data.json（GitHub）の保険チェック間隔
const VER_POLL_MS   = 30 * 1000;      // GASの軽量バージョン確認（鮮度の本命）
const STALE_WARN_MS = 60 * 1000;      // これ以上GASを確認できなければ赤帯で警告
let LAST_VER_OK = 0;                  // GASを最後に確認できた時刻(ms)
let LAST_VER_ERR = "";                // 直近のエラー内容
const PAGE_OPENED_AT = Date.now();
let _verBusy = false;

function pingDataJson(){
  /* ★重要: クエリ文字列を付けない（SW側が同一URLをキャッシュキーとして
     新旧比較しているため、毎回違うURLだと差分検知が一度も発火しない） */
  fetch(DATA_JSON_URL,{cache:"no-cache"}).catch(()=>{});
}
function startAutoRefresh(){
  initFreshnessUI();
  setInterval(pingDataJson,AUTO_POLL_MS);
  setInterval(checkGasUpdate,VER_POLL_MS);
  setInterval(renderFreshness,5000);
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"){checkGasUpdate();pingDataJson();}
  });
  window.addEventListener("focus",checkGasUpdate);
  window.addEventListener("online",checkGasUpdate);
}

/* ===== 鮮度表示（最終確認◯秒前／赤帯） ===== */
function initFreshnessUI(){
  if($("jcStaleBar")) return;
  const st=document.createElement("style");
  st.textContent="#jcStaleBar{display:none;position:sticky;top:0;z-index:9999;background:#B11F35;color:#fff;font-size:12.5px;font-weight:700;padding:8px 12px;text-align:center;line-height:1.5}"+
    "#hdChecked{font-size:11px;font-weight:700;margin-left:6px;color:var(--sub)}#hdChecked.ng{color:#B11F35}";
  document.head.appendChild(st);
  const bar=document.createElement("div");bar.id="jcStaleBar";
  document.body.insertBefore(bar,document.body.firstChild);
  const hd=$("hdUpdated");
  if(hd&&!$("hdChecked")){const sp=document.createElement("span");sp.id="hdChecked";hd.insertAdjacentElement("afterend",sp);}
  renderFreshness();
}
function fmtAgo(ms){
  const sec=Math.max(0,Math.floor(ms/1000));
  if(sec<60) return sec+"秒前";
  const m=Math.floor(sec/60);
  return m<60?m+"分前":Math.floor(m/60)+"時間前";
}
function renderFreshness(){
  const chk=$("hdChecked"),bar=$("jcStaleBar");if(!chk||!bar) return;
  const base=LAST_VER_OK||PAGE_OPENED_AT;
  const gap=Date.now()-base;
  if(LAST_VER_OK&&gap<=STALE_WARN_MS){
    chk.className="";chk.textContent="最終確認 "+fmtAgo(Date.now()-LAST_VER_OK);bar.style.display="none";return;
  }
  if(!LAST_VER_OK&&gap<=STALE_WARN_MS){chk.className="";chk.textContent="確認中…";bar.style.display="none";return;}
  chk.className="ng";
  chk.textContent=LAST_VER_OK?("最終確認 "+fmtAgo(Date.now()-LAST_VER_OK)):"未確認";
  let when="";
  if(LAST_UPDATED_AT){const d=new Date(LAST_UPDATED_AT);if(!isNaN(d.getTime())){const j=new Date(d.getTime()+9*3600*1000);when="（表示中のデータ："+(j.getUTCMonth()+1)+"/"+j.getUTCDate()+" "+String(j.getUTCHours()).padStart(2,"0")+":"+String(j.getUTCMinutes()).padStart(2,"0")+" 更新分）";}}
  bar.textContent="⚠ 最新データを確認できていません"+when+(LAST_VER_ERR?" ["+LAST_VER_ERR+"]":"")+" ／ 右上の更新ボタンで再確認";
  bar.style.display="block";
}

async function loadInitialData(){
  lbStart();
  try{
    const res=await fetch(DATA_JSON_URL,{cache:"no-cache"});
    if(!res.ok) throw new Error();
    const data=await res.json();
    if(data&&Array.isArray(data.jobs)){ALL_JOBS=data.jobs;LAST_UPDATED_AT=data.updatedAt||null;renderAll();showUpdatedDate();lbDone();checkGasUpdate();}
  }catch(e){await loadFromGAS();lbDone();}
  startAutoRefresh();
}
async function checkGasUpdate(force){
  if(_verBusy) return; _verBusy=true;
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),15000);
    let v;
    try{
      const res=await fetch(GAS_API_URL+"?mode=ver&t="+Date.now(),{cache:"no-store",signal:ctl.signal});
      if(!res.ok) throw new Error("HTTP "+res.status);
      v=await res.json();
    }finally{clearTimeout(to);}
    if(!v||!v.updatedAt) throw new Error("verなし");   // 旧GAS(?mode=ver未対応)は全件が返るのでここで弾く
    LAST_VER_OK=Date.now();LAST_VER_ERR="";
    if(force||!LAST_UPDATED_AT||v.updatedAt>LAST_UPDATED_AT){
      const r2=await fetch(GAS_API_URL+"?mode=full&t="+Date.now(),{cache:"no-store"});
      if(!r2.ok) throw new Error("full HTTP "+r2.status);
      const data=await r2.json();
      if(data&&Array.isArray(data.jobs)&&data.jobs.length>0){ALL_JOBS=data.jobs;LAST_UPDATED_AT=data.updatedAt||v.updatedAt;renderAll();showUpdatedDate(true);}
    }
  }catch(e){
    LAST_VER_ERR=(e&&e.name==="AbortError")?"タイムアウト":String((e&&e.message)||e).slice(0,40);
    if(window.console) console.warn("[checkGasUpdate]",e);
  }finally{_verBusy=false;renderFreshness();}
}
async function loadFromGAS(){
  try{const res=await fetch(GAS_API_URL+"?t="+Date.now(),{cache:"no-store"});const data=await res.json();if(data&&Array.isArray(data.jobs)){ALL_JOBS=data.jobs;LAST_UPDATED_AT=data.updatedAt||null;}}catch(e){ALL_JOBS=[];}
}

/* ===== フィルタ ===== */
function baseFilter(){
  let r=ALL_JOBS;
  if(NG_COMPANIES.size>0) r=r.filter(j=>!NG_COMPANIES.has(j.co));
  if(state.kw){const pairs=getPairs();if(pairs.length) r=r.filter(j=>kwMatch(j,pairs));}
  if(state.pris.size)  r=r.filter(j=>state.pris.has(j.pr));
  if(state.emps.size)  r=r.filter(j=>state.emps.has(j.emp));
  if(state.cos.size)   r=r.filter(j=>state.cos.has(j.co));
  if(state.age!==null) r=r.filter(j=>j.ag>=state.age);
  if(state.gender)     r=r.filter(j=>j.gn==="不問"||j.gn===state.gender);
  if(state.salMin>0)   r=r.filter(j=>salVal(j)>=state.salMin);
  state.quicks.forEach(q=>{
    if(q==="dorm")       r=r.filter(j=>j.dorm==="1");
    else if(q==="free")  r=r.filter(j=>j.free===1);
    else if(q==="sub")   r=r.filter(j=>j.sub===1);
    else if(q==="bonus") r=r.filter(j=>j.bx>0);
    else if(q==="day")   r=r.filter(j=>(j.sf||"").indexOf("日勤専属")>=0);
    else if(q==="night") r=r.filter(j=>(j.sf||"").indexOf("夜勤専属")>=0);
    else if(q==="2shift") r=r.filter(j=>(j.sf||"").indexOf("2交代")>=0);
  });
  return r;
}
function filterJobs(){let r=baseFilter();if(state.prefs.size) r=r.filter(j=>state.prefs.has(j.pf));return r;}
function filterOutsJobs(){let r=baseFilter();if(state.prefs.size) r=r.filter(j=>state.prefs.has(j.pf));return r.filter(j=>isOutsJob(j));}

function sortJobs(r){
  /* ★コピーしてから並べ替える。絞り込みなしの時 r は ALL_JOBS そのものなので、
     そのまま sort すると元データの並びが壊れ、同順位の並びが前回のソート結果に引きずられる */
  r=r.slice();
  const m=state.sort;
  if(m==="pri") r.sort((a,b)=>(+a.pr||9)-(+b.pr||9));
  else if(m==="sal_h") r.sort((a,b)=>salVal(b)-salVal(a));
  else if(m==="sal_l") r.sort((a,b)=>salVal(a)-salVal(b));
  else if(m==="bonus") r.sort((a,b)=>(b.bx||0)-(a.bx||0));
  else if(m==="near"&&NEAR){const dm=new Map();r.forEach(j=>{const n=nearOf(j);dm.set(j,n?n.km:1e9);});r.sort((a,b)=>dm.get(a)-dm.get(b)||(+a.pr||9)-(+b.pr||9));}
  return r;
}

/* ===== HTML生成 ===== */
function pillsHtml(j){
  const ageNG=state.age!==null&&j.ag<state.age;
  let p="";
  if(j.pf) p+='<span class="pill loc">'+rubyP(j.pf)+(j.ct?" "+esc(j.ct):"")+'</span>';
  if(j.ag) p+='<span class="pill age'+(ageNG?' ng':'')+'">〜'+j.ag+'歳'+(ageNG?'（対象外）':'')+'</span>';
  if(j.gn) p+='<span class="pill gen">'+esc(j.gn)+'</span>';
  if(j.free===1) p+='<span class="pill free">寮費無料</span>';
  else if(j.sub===1) p+='<span class="pill sub">寮費補助あり</span>';
  else if(j.dorm==="1") p+='<span class="pill dorm">寮完備</span>';
  if(j.bx>0) p+='<span class="pill bx">祝い金'+j.bx+'万</span>';
  if(j.sf) p+='<span class="pill sf">'+esc(j.sf)+'</span>';
  if(j.emp) p+='<span class="pill emp">'+esc(j.emp)+'</span>';
  return p;
}
function salBlock(j){
  if(j.wt==="時給"&&j.hr>0) return '<div class="sal-block"><span class="sal-tag h">時給例</span><div class="sal-main"><span class="sal-n">'+j.hr.toLocaleString()+'</span><span class="sal-un">円</span></div></div>';
  if(j.wt==="月給"&&j.sl>0) return '<div class="sal-block"><span class="sal-tag m">月収例</span><div class="sal-main"><span class="sal-n">'+j.sl.toFixed(1).replace(/\.0$/,"")+'</span><span class="sal-un">万円</span></div></div>';
  return "";
}
function salBannerHtml(j){
  if(j.wt==="時給"&&j.hr>0) return '<div class="sal-banner sb-h"><span class="sb-label">時給例</span><span class="sb-num"><b>'+j.hr.toLocaleString()+'</b>円</span></div>';
  if(j.wt==="月給"&&j.sl>0) return '<div class="sal-banner sb-m"><span class="sb-label">月収例</span><span class="sb-num"><b>'+j.sl.toFixed(1).replace(/\.0$/,"")+'</b>万円</span></div>';
  return "";
}
function quotaBannerHtml(j){
  const hasBudget=j.budget!==null&&j.budget!==undefined;
  const hasRemain=j.remain!==null&&j.remain!==undefined;
  if(!hasBudget&&!hasRemain) return "";
  const isGroup=!!j.utGroup;
  const groupTag=isGroup?'<span class="qb-group-tag">グループ共有：'+esc(j.utGroup)+'</span>':"";
  if(!hasRemain){
    return '<div class="quota-banner qb-none'+(isGroup?" qb-group":"")+'">'+(isGroup?'<div class="qb-group-row">'+groupTag+'</div>':"")+'<div class="qb-main-row"><span class="qb-label">送客枠</span><span class="qb-num">残 <b>未入力</b></span>'+(hasBudget?'<span class="qb-total">予算'+j.budget+'</span>':"")+'</div></div>';
  }
  const remain=Number(j.remain);
  let level,label;
  if(remain<=0){level="qb-out";label=isGroup?"グループ枠切れ":"枠切れ";}
  else if(remain<=3){level="qb-low";label=isGroup?"グループ残りわずか":"残りわずか";}
  else if(remain<=10){level="qb-mid";label=isGroup?"グループ共有枠":"送客枠";}
  else{level="qb-full";label=isGroup?"グループ共有枠":"余裕あり";}
  const usedText=(isGroup&&j.utUsed!==undefined&&j.utUsed!==null)?'（使用'+j.utUsed+'）':"";
  return '<div class="quota-banner '+level+(isGroup?" qb-group":"")+'">'+(isGroup?'<div class="qb-group-row">'+groupTag+'</div>':"")+'<div class="qb-main-row"><span class="qb-label">'+label+'</span><span class="qb-num">残 <b>'+remain+'</b></span>'+(hasBudget?'<span class="qb-total">／予算'+j.budget+usedText+'</span>':"")+'</div></div>';
}

  const badgeLabel=isOuts?'🏢 アウトソ':'優先'+esc(j.pr||"－")+'位';

    /* ★ 通常一覧タブでアウトソ対象の場合のみバナーを表示 */

      +'<div class="c-l">'
        +'<div class="c-h"><span class="'+badgeCls+'">'+badgeLabel+'</span></div>'

        +(j.ti?'<div class="c-ti">'+escMark(j.ti)+'</div>':"")
        +'<div class="pills">'+pillsHtml(j)+'</div>'
        +(meta?'<div class="c-meta">'+meta+'</div>':"")
        +(j.jn?'<button class="c-jn" data-jn="'+escAttr(j.jn)+'" onclick="copyJn(this)" aria-label="仕事No. '+escAttr(j.jn)+' をコピー"><span class="jn-l">仕事No.</span><span class="jn-v">'+markText(j.jn,true)+'</span><span class="jn-c">コピー</span></button>':"")
      +'</div>'
      +'<div class="c-r">'+salBlock(j)
        +'<button class="c-id" onclick="copyId(this,\''+esc(j.id)+'\')" aria-label="案件ID '+esc(j.id)+' をコピー">#'+esc(j.id)+' コピー</button>'
      +'</div>'
    +'</div>'
    +'<div class="c-foot">'
      +'<button class="c-btn" onclick="toggleDet(this)" aria-expanded="false">詳細</button>'
      +(j.maker?'<span class="c-maker">勤務先：'+esc(j.maker)+'</span>':"")
      +(j.ur?'<a class="c-btn go" href="'+esc(j.ur)+'" target="_blank" rel="noopener">求人ページ ↗</a>':"")
    +'</div>'
    +'<dl class="det">'
      +(j.st?'<dt>最寄り駅・交通</dt><dd>'+esc(j.st)+'</dd>':"")
      +(j.ca?'<dt>仕事内容</dt><dd>'+esc(j.ca)+'</dd>':"")
      +'<dt>案件ID / 仕事No.</dt><dd>'+esc(j.id)+'　/　'+esc(j.jn||"－")+'</dd>'
    +'</dl>'
  +'</div>';

/* ===== レンダリング ===== */
function render(){
  const list=filtered.slice(0,displayCount);
  if(!list.length){$("cards").innerHTML='<div class="empty"><b>該当する求人がありません</b>'+(state.kw?'検索ワードを減らすか、仕事No.・案件IDは一部だけでも検索できます<br>（スペース区切りは「すべてを含む」で検索します）':'条件をゆるめてください')+'</div>';$("more").textContent="";$("loadMoreBtn").hidden=true;return;}
  /* 通常一覧では showOutsBanner=true → アウトソ対象カードにバナーを出す */
  $("cards").innerHTML=list.map(j=>cardHtml(j,true)).join("");
  const hasMore=filtered.length>displayCount;
  $("more").textContent=hasMore?"上位"+list.length+"件を表示中（全"+filtered.length.toLocaleString()+"件）":(filtered.length>PAGE_SIZE?"全"+filtered.length.toLocaleString()+"件表示":"");
  $("loadMoreBtn").hidden=!hasMore;
}
function renderOuts(){
  const list=filteredOuts.slice(0,displayCountOuts);
  const el=$("cards-outsource");
  if(!list.length){el.innerHTML='<div class="empty"><b>アウトソーシング事業部 対象求人がありません</b>L列がトリプルエース株式会社、かつB列が1の求人が対象です</div>';$("more").textContent="";$("loadMoreBtn").hidden=true;return;}
  /* アウトソタブでは showOutsBanner=false（バナー不要・バッジで明示済み） */
  el.innerHTML=list.map(j=>cardHtml(j,false)).join("");
  const hasMore=filteredOuts.length>displayCountOuts;
  $("more").textContent=hasMore?"上位"+list.length+"件を表示中（全"+filteredOuts.length.toLocaleString()+"件）":(filteredOuts.length>PAGE_SIZE?"全"+filteredOuts.length.toLocaleString()+"件表示":"");
  $("loadMoreBtn").hidden=!hasMore;
}
function loadMore(){
  if(_currentView==="outsource"){displayCountOuts+=PAGE_SIZE;renderOuts();}
  else{displayCount+=PAGE_SIZE;render();}
}

/* ===== カウント ===== */
function updateCounts(){
  const isOuts=_currentView==="outsource";
  const n=isOuts?filteredOuts.length:filtered.length;
  const t=ALL_JOBS.length;

/* ===== 住所から近い順（第1段階：直線距離＋車の目安分） ===== */
/*NEARCORE_START*/
const MUNI=(function(){try{return JSON.parse(document.getElementById("muniData").textContent);}catch(e){return {};}})();
const nGeo=s=>String(s==null?"":s).normalize("NFKC").replace(/[ヶヵ]/g,"ケ").replace(/[\s　]/g,"");
const CITY_LIST={},CITY_IDX={};
(function(){
  Object.keys(MUNI).forEach(pf=>{
    const names=Object.keys(MUNI[pf]),arr=[];
    names.forEach(city=>{
      const v=MUNI[pf][city],key=nGeo(city);
      const par=/市$/.test(city)&&names.some(c=>c!==city&&c.indexOf(city)===0);
      const e={pf:pf,city:city,key:key,kn:key.replace(/^.+?郡/,""),lat:v[0],lng:v[1],par:par};
      arr.push(e);CITY_IDX[nGeo(pf)+"|"+key]=e;
    });
    CITY_LIST[pf]=arr;
  });
})();
let NEAR=null;
const _geoC=new Map();
function geoOf(pf,ct){
  const k=pf+"|"+ct;if(_geoC.has(k)) return _geoC.get(k);
  const np=nGeo(pf),nc=nGeo(ct);let r=null;
  if(nc){
    r=CITY_IDX[np+"|"+nc]||null;
    if(!r){const m=nc.match(/^(.+?市)(.+区)$/);if(m) r=CITY_IDX[np+"|"+m[1]]||null;}
    if(!r){r=(CITY_LIST[pf]||[]).find(e=>e.kn===nc||e.key.indexOf(nc)===0)||null;}
  }
  _geoC.set(k,r);return r;
}
function hav(a,b,c,d){const t=Math.PI/180,x=Math.sin((c-a)*t/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin((d-b)*t/2)**2;return 12742*Math.asin(Math.sqrt(x));}
function carMin(km){
  const road=km*1.3,sp=road<=8?24:road<=25?32:road<=60?42:road<=150?55:65;
  let m=Math.round(road/sp*60+3);if(m>20) m=Math.round(m/5)*5;return m;
}
function fmtMin(m){if(m<60) return "約"+m+"分";const h=Math.floor(m/60),r=m%60;return "約"+h+"時間"+(r?r+"分":"");}
function fmtKm(km){return km<10?km.toFixed(1)+"km":Math.round(km)+"km";}
function nearOf(j){
  if(!NEAR) return null;
  const g=geoOf(j.pf,j.ct);if(!g) return null;
  const same=g.pf===NEAR.pf&&(g.key===NEAR.key||(NEAR.par&&g.key.indexOf(NEAR.key)===0));
  const km=same?0:hav(NEAR.lat,NEAR.lng,g.lat,g.lng);
  return {km:km,min:same?null:carMin(km),same:same};
}
/*NEARCORE_END*/

function nearBannerHtml(j){
  if(!NEAR) return "";
  const lab='<span class="nb-l">📍 '+esc(NEAR.city)+'から</span>';
  const n=nearOf(j);
  if(!n) return '<div class="near-banner nb-0">'+lab+'<span class="nb-v">距離不明</span></div>';
  const tier=(n.same||n.min<=30)?1:n.min<=60?2:n.min<=120?3:4;
  const v=n.same?'同じ市区町村内':n.km>300?'遠方<small>直線'+fmtKm(n.km)+'</small>':'車 '+fmtMin(n.min)+'<small>直線'+fmtKm(n.km)+'</small>';
  return '<div class="near-banner nb-'+tier+'">'+lab+'<span class="nb-v">'+v+'</span></div>';
}

const _ns={pf:"",q:"",sel:null,list:[]};
function nearChipUpdate(){
  $("nearWrap").classList.toggle("on",!!NEAR);
  $("nearTxt").textContent=NEAR?NEAR.city:"住所から近い順";
  $("nearBtn").title=NEAR?(NEAR.pf+NEAR.city):"";
  $("nearClr").hidden=!NEAR;
}
function nearToast(msg){
  let t=$("nearToast");
  if(!t){t=document.createElement("div");t.id="nearToast";document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity="1";clearTimeout(window._nearToastT);window._nearToastT=setTimeout(()=>{t.style.opacity="0";},2200);
}
function openNear(){
  _ns.pf=NEAR?NEAR.pf:"";_ns.q="";_ns.sel=NEAR?CITY_IDX[nGeo(NEAR.pf)+"|"+NEAR.key]||null:null;
  $("nsPf").value=_ns.pf;$("nsQ").value="";
  nsRender();
  $("nsOverlay").classList.add("open");$("ns").classList.add("open");
  document.body.style.overflow="hidden";
  if(window.matchMedia&&window.matchMedia("(min-width:769px)").matches) setTimeout(()=>{if(!_ns.pf) $("nsQ").focus();},220);
}
function closeNear(){
  $("nsOverlay").classList.remove("open");$("ns").classList.remove("open");
  document.body.style.overflow="";
}
function onNsPf(v){_ns.pf=v;_ns.sel=null;nsRender();}
function onNsQ(v){_ns.q=v;_ns.sel=null;nsRender();}
function nsRender(){
  const q=nGeo(_ns.q);let list=[];
  if(_ns.pf||q){
    const prefs=_ns.pf?[_ns.pf]:Object.keys(CITY_LIST);
    prefs.forEach(pf=>(CITY_LIST[pf]||[]).forEach(e=>{if(!q||e.key.indexOf(q)>=0||e.kn.indexOf(q)>=0) list.push(e);}));
    if(q){
      const head=e=>(e.kn.indexOf(q)===0||e.key.indexOf(q)===0)?0:1;
      list.sort((a,b)=>head(a)-head(b));list=list.slice(0,60);
    }
  }
  _ns.list=list;
  if(!_ns.sel&&q){
    const exact=list.filter(e=>e.key===q||e.kn===q);
    if(exact.length===1) _ns.sel=exact[0];else if(list.length===1) _ns.sel=list[0];
  }
  const sel=_ns.sel,box=$("nsCands"),sc=box.scrollTop;
  box.innerHTML=list.length?list.map((e,i)=>'<button class="ns-c'+(sel&&sel.pf===e.pf&&sel.city===e.city?' on':'')+'" onclick="nsPick('+i+')">'+esc(e.city)+(e.par?'<i>市全体</i>':'')+(_ns.pf?'':'<small>'+esc(e.pf)+'</small>')+'</button>').join(""):'<div class="ns-empty">'+((_ns.pf||q)?'該当する市区町村がありません':'都道府県を選ぶか、市区町村名を入力してください')+'</div>';
  box.scrollTop=sc;
  $("nsSel").textContent=sel?'選択中：'+sel.pf+' '+sel.city:'';
  $("nsGo").disabled=!sel;
  $("nsReset").hidden=!NEAR;
}
function nsPick(i){const e=_ns.list[i];if(e) applyNear(e);}
function nsEnter(){if(_ns.sel) applyNear(_ns.sel);}
function applyNear(e){
  NEAR={pf:e.pf,city:e.city,key:e.key,lat:e.lat,lng:e.lng,par:e.par};
  state.sort="near";$("sort").value="near";
  nearChipUpdate();closeNear();apply();
  window.scrollTo({top:0,behavior:"smooth"});
  nearToast("📍 "+e.city+"から近い順に並べ替えました");
}
function clearNear(){
  NEAR=null;
  if(state.sort==="near"){state.sort="pri";$("sort").value="pri";}
  nearChipUpdate();closeNear();apply();
}
function clearNearSilent(){NEAR=null;nearChipUpdate();}
(function(){
  $("nsPf").innerHTML='<option value="">全国（都道府県を選ばない）</option>'+Object.keys(REGIONS).map(r=>REGIONS[r].map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join("")).join("");
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("ns").classList.contains("open")) closeNear();});
})();

registerSW();
loadInitialData();
</script>
