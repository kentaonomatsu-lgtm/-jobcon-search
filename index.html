<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>JC Search</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f5f5f7;--w:#fff;--ink:#1d1d1f;--ink2:#3d3d3f;--mid:#6e6e73;--faint:#aeaeb2;--ghost:#d2d2d7;--snow:#f5f5f7;
  --p1c:#00875a;--p1b:#e3f5ef;--p1t:#004d33;
  --p2c:#0052cc;--p2b:#deeaff;--p2t:#003380;
  --p3c:#b75c00;--p3b:#fff0e0;
  --p4c:#888;  --p4b:#f0f0f0;
  --gr:#00875a;--gr2:#e3f5ef;--gr3:#004d33;
  --bl:#0052cc;--bl2:#deeaff;
  --or:#e67e22;--orb:#fef5ec;
  --rd:#c0392b;--rdb:#fdecea;
  --sh:0 1px 3px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
  --sh2:0 8px 30px rgba(0,0,0,.12);
  --r:14px;--rx:9px;--rs:6px;
  --font:'Sora','Noto Sans JP',sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;overflow:hidden;}
.app{display:flex;flex-direction:column;height:100vh;}

/* ━━ HEADER ━━ */
.hdr{background:var(--w);border-bottom:1px solid var(--ghost);height:52px;display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;}
.brand{font-family:'Sora',sans-serif;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.03em;flex-shrink:0;}
.brand em{color:var(--gr);font-style:normal;}
.brand-n{font-size:10px;font-weight:600;color:var(--gr);background:var(--gr2);border-radius:99px;padding:2px 7px;margin-left:6px;display:none;}
.sw{flex:1;position:relative;max-width:380px;}
.sw input{width:100%;background:var(--snow);border:1.5px solid var(--ghost);border-radius:99px;padding:7px 14px 7px 34px;font-size:13px;font-family:var(--font);color:var(--ink);outline:none;transition:all .18s;}
.sw input:focus{border-color:var(--bl);background:var(--w);box-shadow:0 0 0 3px rgba(0,82,204,.1);}
.sw input::placeholder{color:var(--faint);}
.sw-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:var(--faint);pointer-events:none;}
.hdr-r{display:flex;align-items:center;gap:5px;margin-left:auto;}
.hb{height:32px;padding:0 11px;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font);border:1.5px solid var(--ghost);display:flex;align-items:center;gap:4px;color:var(--mid);background:var(--w);transition:all .15s;white-space:nowrap;}
.hb svg{width:13px;height:13px;fill:currentColor;}
.hb:hover{border-color:var(--faint);color:var(--ink);}
.hb.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.hb-r{color:var(--rd);border-color:rgba(192,57,43,.25);display:none;}
.hb-r.show{display:flex;}
.fb{background:rgba(255,255,255,.25);border-radius:99px;font-size:9px;padding:1px 5px;}

/* ━━ PROFILE STRIP（求職者条件入力）━━ */
.pstrip{background:linear-gradient(135deg,#004d33 0%,#00875a 100%);padding:10px 14px;display:none;flex-shrink:0;}
.pstrip.on{display:block;}
.ps-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.ps-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.65);letter-spacing:.1em;text-transform:uppercase;}
.ps-x{background:rgba(255,255,255,.15);border:none;color:rgba(255,255,255,.7);border-radius:99px;padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;font-family:var(--font);}
.ps-row{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;}
.ps-f{display:flex;flex-direction:column;gap:3px;}
.ps-f label{font-size:9px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase;}
.ps-f input,.ps-f select{height:30px;padding:0 9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:var(--rs);font-size:12px;font-family:var(--font);color:#fff;outline:none;min-width:90px;}
.ps-f select option{color:var(--ink);background:var(--w);}
.ps-f input::placeholder{color:rgba(255,255,255,.35);}
.ps-go{height:30px;padding:0 14px;background:#fff;color:var(--gr3);border:none;border-radius:var(--rs);font-size:11px;font-weight:800;cursor:pointer;font-family:var(--font);align-self:flex-end;white-space:nowrap;}
.ps-save{height:30px;padding:0 11px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:var(--rs);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font);align-self:flex-end;}
.ps-saved{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px;}
.ps-tag{font-size:10px;font-weight:600;background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:3px 9px;cursor:pointer;display:flex;align-items:center;gap:3px;transition:all .12s;}
.ps-tag:hover{background:rgba(255,255,255,.25);}
.ps-tag.act{background:#fff;color:var(--gr3);}
.ps-tag-x{opacity:.55;font-size:10px;}

/* ━━ TOP3バナー ━━ */
.top3-bar{background:linear-gradient(90deg,#fff8e1,#fffbec);border-bottom:2px solid #f59e0b;padding:8px 14px;display:none;flex-shrink:0;}
.top3-bar.on{display:block;}
.t3-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.t3-lbl{font-size:10px;font-weight:800;color:#92400e;letter-spacing:.05em;display:flex;align-items:center;gap:5px;}
.t3-lbl svg{width:13px;height:13px;fill:#f59e0b;}
.t3-clr{font-size:11px;font-weight:800;color:#fff;background:#dc2626;border:none;border-radius:99px;padding:6px 14px;cursor:pointer;font-family:var(--font);transition:all .15s;letter-spacing:.02em;box-shadow:0 1px 4px rgba(220,38,38,.3);}
.t3-clr:hover{background:#b91c1c;transform:translateY(-1px);box-shadow:0 2px 8px rgba(220,38,38,.4);}
.t3-cards{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.t3-cards::-webkit-scrollbar{display:none;}
.t3-card{flex-shrink:0;background:#fff;border:1.5px solid #fde68a;border-radius:var(--rx);padding:8px 12px;min-width:200px;cursor:pointer;transition:all .15s;position:relative;}
.t3-card:hover{border-color:#f59e0b;box-shadow:0 2px 10px rgba(245,158,11,.2);}
.t3-rank{position:absolute;top:-1px;left:-1px;background:#f59e0b;color:#fff;font-size:9px;font-weight:800;border-radius:var(--rx) 0 var(--rs) 0;padding:2px 7px;}
.t3-co{font-size:12px;font-weight:700;color:var(--ink);margin:10px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t3-sal{font-family:'Sora',sans-serif;font-size:16px;font-weight:800;color:var(--gr);line-height:1;}
.t3-salu{font-size:9px;color:var(--faint);}
.t3-loc{font-size:10px;color:var(--mid);margin-top:3px;}
.t3-score{position:absolute;top:6px;right:8px;font-size:10px;font-weight:800;background:var(--gr2);color:var(--gr3);border-radius:99px;padding:2px 7px;}
.t3-cw{margin-top:5px;width:100%;height:24px;background:var(--gr2);color:var(--gr3);border:none;border-radius:var(--rs);font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:3px;}

/* ━━ QUICK BAR ━━ */
.qbar{background:var(--w);border-bottom:1px solid var(--ghost);padding:7px 14px;display:flex;gap:4px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
.qbar::-webkit-scrollbar{display:none;}
.qc{flex-shrink:0;font-size:11px;font-weight:700;height:26px;padding:0 11px;border-radius:99px;border:1.5px solid var(--ghost);color:var(--mid);cursor:pointer;background:var(--w);font-family:var(--font);transition:all .12s;white-space:nowrap;}
.qc:hover{border-color:var(--faint);color:var(--ink);}
.qc.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.qd{width:1px;height:14px;background:var(--ghost);flex-shrink:0;margin:0 2px;align-self:center;}

/* ━━ ACTIVE FILTERS ━━ */
.abar{background:#f0fff8;border-bottom:1px solid rgba(0,135,90,.12);padding:5px 14px;display:none;align-items:center;gap:5px;flex-wrap:wrap;}
.abar.on{display:flex;}
.ablbl{font-size:9px;font-weight:700;color:var(--gr);letter-spacing:.1em;text-transform:uppercase;flex-shrink:0;}
.atags{display:flex;flex-wrap:wrap;gap:3px;flex:1;}
.atag{font-size:10px;font-weight:600;background:var(--gr2);color:var(--gr3);border:1px solid rgba(0,135,90,.2);border-radius:99px;padding:2px 8px;display:flex;align-items:center;gap:2px;}
.atag-x{cursor:pointer;opacity:.6;}
.atag-x:hover{opacity:1;}
.aclr{font-size:10px;font-weight:700;color:var(--rd);background:var(--rdb);border:none;border-radius:99px;padding:3px 8px;cursor:pointer;font-family:var(--font);}

/* ━━ SEL BAR ━━ */
.selbar{display:none;align-items:center;gap:7px;background:var(--bl);padding:7px 14px;flex-shrink:0;}
.selbar.on{display:flex;}
.seltxt{font-size:12px;font-weight:700;color:#fff;flex:1;}
.seltxt em{color:#c7d2fe;font-style:normal;}
.sb{height:28px;padding:0 11px;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);white-space:nowrap;}
.sb-cmp{background:#fff;color:var(--bl);}
.sb-cw{background:rgba(255,255,255,.2);color:#fff;}
.sb-clr{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);}

/* ━━ LAYOUT ━━ */
.main{display:flex;flex:1;overflow:hidden;}

/* ━━ SIDEBAR ━━ */
.sidebar{width:232px;background:var(--w);border-right:1px solid var(--ghost);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .22s;}
.sb-hdr{height:38px;padding:0 14px;border-bottom:1px solid var(--ghost);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.sb-lbl{font-size:9px;font-weight:700;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;}
.sb-rst{font-size:10px;font-weight:700;color:var(--rd);background:var(--rdb);border:none;border-radius:99px;padding:2px 7px;cursor:pointer;font-family:var(--font);display:none;}
.sb-body{flex:1;overflow-y:auto;padding:10px 12px 20px;}
.sb-body::-webkit-scrollbar{width:3px;}
.sb-body::-webkit-scrollbar-thumb{background:var(--ghost);border-radius:99px;}
.fg{margin-bottom:14px;}
.fgl{font-size:9px;font-weight:700;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:4px;}
.fgc{background:var(--ink);color:#fff;border-radius:99px;font-size:8px;font-weight:700;padding:1px 4px;display:none;}
.chips{display:flex;flex-wrap:wrap;gap:3px;}
.chip{font-size:10px;font-weight:500;padding:4px 9px;border-radius:99px;border:1.5px solid var(--ghost);color:var(--mid);cursor:pointer;background:var(--w);font-family:var(--font);transition:all .12s;}
.chip:hover{border-color:var(--faint);color:var(--ink);}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.rr{display:flex;align-items:center;gap:4px;}
.rr input{flex:1;background:var(--snow);border:1.5px solid var(--ghost);border-radius:var(--rs);padding:5px 8px;font-size:12px;font-family:var(--font);color:var(--ink);outline:none;min-width:0;}
.rr input:focus{border-color:var(--bl);}
.rs{color:var(--faint);font-size:11px;}
.ai{width:100%;background:var(--snow);border:1.5px solid var(--ghost);border-radius:var(--rs);padding:5px 8px;font-size:12px;font-family:var(--font);color:var(--ink);outline:none;}
.ai:focus{border-color:var(--bl);}
.mh{font-size:9px;color:var(--faint);margin-bottom:4px;}
.svgw{background:#f0f4ff;border:1.5px solid var(--ghost);border-radius:var(--rs);overflow:hidden;margin-bottom:4px;}
.svgw svg{width:100%;display:block;}
.ar{fill:#eff6ff;stroke:#c7d2fe;stroke-width:1.5;cursor:pointer;transition:fill .12s;}
.ar:hover{fill:#dbeafe;}
.ar.on{fill:var(--ink);stroke:var(--ink);}
.arl{font-size:8.5px;fill:var(--mid);pointer-events:none;font-family:var(--font);font-weight:600;}
.pchips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
.pchip{font-size:9px;font-weight:600;padding:3px 7px;border-radius:99px;border:1.5px solid var(--ghost);color:var(--mid);cursor:pointer;background:var(--w);font-family:var(--font);transition:all .12s;}
.pchip:hover{border-color:var(--faint);color:var(--ink);}
.pchip.on{background:var(--ink);border-color:var(--ink);color:#fff;}

/* ━━ CONTENT ━━ */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.toolbar{height:36px;background:var(--w);border-bottom:1px solid var(--ghost);padding:0 14px;display:flex;align-items:center;gap:7px;flex-shrink:0;}
.tb-lbl{font-size:10px;font-weight:600;color:var(--faint);}
.tb-sel{background:var(--snow);border:1.5px solid var(--ghost);border-radius:99px;padding:3px 11px;font-size:10px;font-weight:600;color:var(--ink);font-family:var(--font);outline:none;cursor:pointer;}
.rcnt{font-size:10px;color:var(--faint);}
.rcnt strong{color:var(--ink);font-weight:700;}
.tb-acts{display:flex;gap:4px;margin-left:auto;}
.btn-sk{height:26px;padding:0 11px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;border-radius:99px;font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:3px;transition:opacity .15s;}
.btn-sk:hover{opacity:.85;}
.btn-sk.on{box-shadow:0 0 0 2px rgba(245,158,11,.4);}
.btn-sk svg{width:10px;height:10px;fill:#fff;}
.sk-n{background:rgba(255,255,255,.3);border-radius:99px;font-size:9px;padding:1px 5px;}
.tb-btn{height:26px;padding:0 10px;border-radius:99px;font-size:10px;font-weight:600;cursor:pointer;font-family:var(--font);border:1.5px solid var(--ghost);display:flex;align-items:center;gap:3px;color:var(--mid);background:var(--w);transition:all .12s;}
.tb-btn svg{width:11px;height:11px;fill:currentColor;}
.tb-btn:hover{border-color:var(--faint);color:var(--ink);}

/* ━━ LIST ━━ */
#vlist{flex:1;overflow-y:auto;padding:10px 12px 40px;display:flex;flex-direction:column;}
#vlist::-webkit-scrollbar{width:4px;}
#vlist::-webkit-scrollbar-thumb{background:var(--ghost);border-radius:99px;}
.empty{text-align:center;padding:4rem 2rem;}
.empty-ico{font-size:40px;opacity:.1;margin-bottom:10px;}
.empty-txt{font-size:13px;font-weight:500;color:var(--faint);}

/* ━━ CARD ━━ */
.card{background:var(--w);border:1.5px solid var(--ghost);border-radius:var(--r);margin-bottom:6px;overflow:hidden;transition:border-color .14s,box-shadow .14s;cursor:pointer;position:relative;}
.card:hover{border-color:var(--faint);box-shadow:var(--sh);}
.card.open{border-color:var(--ink2);}
.card.sel{border-color:var(--bl);box-shadow:0 0 0 2px rgba(0,82,204,.12);}
/* 優先順位ライン */
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.card.p1::before{background:var(--p1c);}
.card.p2::before{background:var(--p2c);}
.card.p3::before{background:var(--p3c);}
.card.p4::before{background:var(--ghost);}
.card.match-s{box-shadow:0 0 0 1.5px rgba(0,135,90,.35);}
.card.match-a{box-shadow:0 0 0 1.5px rgba(0,82,204,.35);}

.ctop{padding:10px 12px 10px 16px;display:flex;align-items:flex-start;gap:8px;}
.chk{width:18px;height:18px;border:1.5px solid var(--ghost);border-radius:4px;flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center;transition:all .12s;cursor:pointer;}
.chk svg{width:10px;height:10px;display:none;}
.card.sel .chk{background:var(--bl);border-color:var(--bl);}
.card.sel .chk svg{display:block;}
.cbody{flex:1;min-width:0;}

/* 優先順位バッジ＋社名行 */
.c-r1{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.pribadge{font-size:9px;font-weight:800;border-radius:4px;padding:2px 6px;flex-shrink:0;letter-spacing:.03em;}
.pb1{background:var(--p1b);color:var(--p1t);}
.pb2{background:var(--p2b);color:var(--p2t);}
.pb3{background:var(--p3b);color:var(--p3c);}
.pb4{background:var(--p4b);color:var(--p4c);}
.cco{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 給与行 */
.c-r2{display:flex;align-items:baseline;gap:4px;margin-bottom:3px;}
.saln{font-family:'Sora',sans-serif;font-size:19px;font-weight:800;color:var(--gr);line-height:1;letter-spacing:-.03em;}
.salu{font-size:10px;color:var(--faint);}
.sall{font-size:10px;color:var(--faint);}
.bpill{font-size:9px;font-weight:700;background:var(--orb);color:var(--or);border-radius:99px;padding:2px 6px;margin-left:3px;}

.ctit{font-size:10px;color:var(--mid);margin-bottom:3px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.cloc{font-size:11px;font-weight:500;color:var(--mid);margin-bottom:4px;display:flex;align-items:center;gap:3px;}
.cloc-ico{width:10px;height:10px;fill:var(--faint);flex-shrink:0;}
.tags{display:flex;flex-wrap:wrap;gap:2px;}
.tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;}
.tg{background:#e8f5e9;color:#2e7d32;}
.tb{background:#e8eaf6;color:#283593;}
.to{background:#fff8e1;color:#e65100;}
.tp{background:#fce4ec;color:#880e4f;}
.tt{background:#e0f2f1;color:#004d40;}
.td{background:var(--snow);color:var(--mid);}
.tag-ng{background:var(--rdb);color:var(--rd);}
.tag-sk{background:#fff8e1;color:#e65100;font-weight:800;}

/* マッチスコア */
.mscore{display:none;flex-direction:column;align-items:flex-end;flex-shrink:0;gap:2px;margin-left:4px;}
.mscore.on{display:flex;}
.ms-g{font-size:10px;font-weight:800;border-radius:4px;padding:2px 6px;}
.ms-s{background:#e8f5e9;color:#1b5e20;}
.ms-a{background:#e8eaf6;color:#1a237e;}
.ms-b{background:#fff8e1;color:#e65100;}
.ms-x{background:var(--rdb);color:var(--rd);}
.ms-bar{width:42px;height:3px;background:var(--ghost);border-radius:99px;overflow:hidden;}
.ms-fill{height:100%;border-radius:99px;}
.ms-pct{font-size:9px;color:var(--faint);}

/* カードボタン */
.cbtns{display:flex;flex-direction:column;gap:3px;flex-shrink:0;}
.cbn{height:26px;padding:0 9px;border-radius:var(--rs);font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font);border:1.5px solid transparent;white-space:nowrap;transition:all .12s;display:flex;align-items:center;gap:3px;}
.cbn svg{width:10px;height:10px;fill:currentColor;}
.cbn:hover{opacity:.85;}
.cbn-u{background:var(--bl2);color:var(--bl);border-color:rgba(0,82,204,.2);}
.cbn-cw{background:#e8f5e9;color:var(--gr3);border-color:rgba(0,135,90,.2);}

/* ━━ EXPAND ━━ */
.cexp{display:none;border-top:1px solid var(--ghost);padding:10px 12px 12px 16px;background:var(--snow);}
.card.open .cexp{display:block;}
.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:9px;}
.eg .egl{font-size:8px;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;}
.eg .egv{font-size:11px;font-weight:500;color:var(--ink2);}
.catch{font-size:10px;color:var(--mid);line-height:1.7;background:var(--w);border:1.5px solid var(--ghost);border-radius:var(--rs);padding:7px 10px;margin-bottom:9px;max-height:56px;overflow:hidden;}
.ebtns{display:flex;gap:5px;flex-wrap:wrap;}
.ebn{height:32px;padding:0 14px;border-radius:var(--rx);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font);border:1.5px solid transparent;display:flex;align-items:center;gap:5px;transition:all .14s;}
.ebn:hover{opacity:.85;}
.ebn-sel{background:var(--ink);color:#fff;}
.ebn-talk{background:var(--orb);color:var(--or);border-color:rgba(230,126,34,.25);}
.ebn-del{background:var(--rdb);color:var(--rd);border-color:rgba(192,57,43,.2);}
.talk-box{background:var(--orb);border:1.5px solid rgba(230,126,34,.2);border-radius:var(--rs);padding:9px 11px;margin-top:7px;display:none;}
.talk-box.on{display:block;}
.talk-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.talk-lbl{font-size:9px;font-weight:700;color:var(--or);letter-spacing:.06em;text-transform:uppercase;}
.talk-cp{font-size:10px;font-weight:700;background:rgba(230,126,34,.15);color:var(--or);border:none;border-radius:99px;padding:2px 8px;cursor:pointer;font-family:var(--font);}
.talk-body{font-size:11px;color:var(--ink2);line-height:1.9;white-space:pre-wrap;}

/* ━━ 正社員候補ビュー ━━ */
#vseiki{flex:1;display:none;flex-direction:column;overflow:hidden;}
#vseiki.on{display:flex;}
.sk-hdr{background:#fffbeb;border-bottom:2px solid rgba(245,158,11,.2);padding:9px 14px;flex-shrink:0;display:flex;align-items:center;gap:9px;}
.sk-hdr-txt{flex:1;font-size:11px;color:#7d5f00;line-height:1.5;}
.sk-hdr-txt strong{display:block;font-size:12px;font-weight:700;color:#5a3e00;margin-bottom:1px;}
.sk-back{height:26px;padding:0 11px;background:var(--w);color:var(--mid);border:1.5px solid var(--ghost);border-radius:99px;font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:3px;}
.sk-back svg{width:10px;height:10px;fill:currentColor;}
.sk-list{flex:1;overflow-y:auto;padding:10px 12px 40px;}
.sk-note{background:var(--w);border-left:3px solid var(--or);border-radius:0 var(--rs) var(--rs) 0;padding:7px 11px;margin-bottom:9px;font-size:10px;color:var(--mid);line-height:1.6;}
.sk-note strong{color:var(--ink2);display:block;margin-bottom:2px;font-size:11px;}
.card.sk-card::before{background:linear-gradient(180deg,#f59e0b,#d97706);}

/* ━━ NEAR VIEW ━━ */
#vnear{display:none;flex:1;flex-direction:column;overflow:hidden;}
#vnear.on{display:flex;}
.ntop{background:var(--w);border-bottom:1px solid var(--ghost);padding:11px 14px;flex-shrink:0;}
.ntitle{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:5px;}
.ntitle svg{width:13px;height:13px;fill:var(--gr);flex-shrink:0;}
.ninputs{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;}
.nfield{display:flex;flex-direction:column;gap:3px;}
.nfield label{font-size:9px;font-weight:700;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;}
.nfield select{height:32px;padding:0 10px;background:var(--snow);border:1.5px solid var(--ghost);border-radius:var(--rs);font-size:12px;font-family:var(--font);color:var(--ink);outline:none;cursor:pointer;min-width:130px;}
.ngo{height:32px;padding:0 18px;background:var(--gr);color:#fff;border:none;border-radius:var(--rs);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);}
.nclr{height:32px;padding:0 11px;background:var(--snow);color:var(--mid);border:1.5px solid var(--ghost);border-radius:var(--rs);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);display:none;}
.nfrow{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap;}
.nfrow label{font-size:9px;font-weight:700;color:var(--faint);}
.nc{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;border:1.5px solid var(--ghost);color:var(--mid);cursor:pointer;background:var(--w);font-family:var(--font);transition:all .12s;}
.nc:hover{border-color:var(--faint);color:var(--ink);}
.nc.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.nlimw{margin-left:auto;display:flex;align-items:center;gap:5px;}
.nlimw label{font-size:9px;font-weight:700;color:var(--faint);}
.nlimw select{height:28px;padding:0 8px;background:var(--snow);border:1.5px solid var(--ghost);border-radius:99px;font-size:10px;font-family:var(--font);outline:none;color:var(--ink);cursor:pointer;}
.nstat{margin-top:6px;font-size:11px;color:var(--faint);}
.nstat strong{color:var(--ink2);}
.nlist{flex:1;overflow-y:auto;padding:10px 12px 40px;}
.nlist::-webkit-scrollbar{width:4px;}
.nlist::-webkit-scrollbar-thumb{background:var(--ghost);border-radius:99px;}
.nc-card{background:var(--w);border:1.5px solid var(--ghost);border-radius:var(--r);margin-bottom:6px;padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s;}
.nc-card:hover{border-color:var(--faint);box-shadow:var(--sh);}
.nc-rank{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;color:var(--ghost);text-align:center;width:28px;flex-shrink:0;line-height:1;}
.nc-rank.top{color:var(--gr);}
.nc-pri{width:28px;height:28px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;}
.nc-body{flex:1;min-width:0;}
.nc-co{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nc-loc{font-size:10px;color:var(--mid);margin-bottom:5px;display:flex;align-items:center;gap:4px;}
.pt-c{font-size:9px;font-weight:700;background:var(--gr2);color:var(--gr3);border-radius:99px;padding:1px 5px;}
.pt-p{font-size:9px;font-weight:700;background:var(--snow);color:var(--faint);border-radius:99px;padding:1px 5px;}
.nc-r{text-align:right;flex-shrink:0;min-width:76px;}
.nc-km{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;line-height:1;letter-spacing:-.03em;}
.nc-kmu{font-size:9px;color:var(--faint);}
.nc-kml{font-size:9px;color:var(--faint);margin-top:1px;}
.nc-sal{font-family:'Sora',sans-serif;font-size:12px;font-weight:700;color:var(--gr);margin-top:4px;}

/* ━━ MODAL ━━ */
.cov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.cov.on{display:flex;}
.cmodal{background:var(--w);border-radius:var(--r);width:min(640px,92vw);max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--sh2);}
.cmhdr{padding:14px 18px;display:flex;align-items:center;border-bottom:1px solid var(--ghost);}
.cmhdr h2{font-size:14px;font-weight:700;flex:1;color:var(--ink);}
.cmcls{background:var(--snow);border:none;border-radius:99px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);color:var(--mid);}
.cmacts{padding:8px 18px;background:var(--snow);border-bottom:1px solid var(--ghost);display:flex;gap:6px;}
.cmacts button{flex:1;height:34px;border-radius:var(--rx);font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);}
.cmt{background:var(--gr2);color:var(--gr3);}
.cmc{background:var(--ink);color:#fff;}
.cmbody{overflow-y:auto;padding:14px 18px;flex:1;}
.cmcard{border:1.5px solid var(--ghost);border-radius:var(--rs);padding:11px;margin-bottom:7px;background:var(--snow);}
.cmno{font-size:9px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.cmco{font-size:13px;font-weight:700;margin-bottom:9px;color:var(--ink);}
.cmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.ci .cl{font-size:9px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.ci .cv{font-size:11px;font-weight:500;color:var(--ink2);}
.ci .cv.hl{font-family:'Sora',sans-serif;font-size:14px;font-weight:800;color:var(--gr);}

/* ━━ DELETE ━━ */
.dov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:600;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.dov.on{display:flex;}
.dbox{background:var(--w);border-radius:var(--r);padding:20px;width:min(300px,88vw);box-shadow:var(--sh2);}
.dbox h3{font-size:14px;font-weight:700;margin-bottom:5px;color:var(--ink);}
.dbox p{font-size:11px;color:var(--mid);line-height:1.6;margin-bottom:14px;}
.dco{font-weight:700;color:var(--ink2);}
.dbtns{display:flex;gap:6px;}
.dbtns button{flex:1;height:38px;border-radius:var(--rx);font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);}
.dcancel{background:var(--snow);color:var(--mid);}
.dok{background:var(--rd);color:#fff;}

/* ━━ TOAST ━━ */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:99px;font-size:11px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999;white-space:nowrap;box-shadow:var(--sh2);}
.toast.on{opacity:1;}


/* テーブルビュー */
.view-toggle{display:flex;gap:3px;background:var(--snow);border:1.5px solid var(--ghost);border-radius:var(--rs);padding:2px;}
.vt-btn{height:22px;padding:0 8px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);color:var(--mid);background:transparent;transition:all .12s;display:flex;align-items:center;gap:3px;}
.vt-btn svg{width:11px;height:11px;fill:currentColor;}
.vt-btn.on{background:var(--w);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.tbl-wrap{flex:1;overflow:auto;padding:0;}
.tbl-wrap::-webkit-scrollbar{width:4px;height:4px;}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--ghost);border-radius:99px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead{position:sticky;top:0;z-index:10;background:var(--snow);border-bottom:2px solid var(--ghost);}
th{padding:7px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none;transition:color .12s;}
th:hover{color:var(--ink);}
th .sort-ico{margin-left:3px;opacity:.3;}
th.active .sort-ico{opacity:1;}
tbody tr{border-bottom:1px solid var(--ghost);transition:background .1s;cursor:pointer;}
tbody tr:hover{background:#f8f8fc;}
tbody tr.sel-row{background:var(--bl2);}
td{padding:7px 10px;vertical-align:middle;white-space:nowrap;}
td.td-co{font-weight:700;color:var(--ink);max-width:160px;overflow:hidden;text-overflow:ellipsis;}
td.td-sal{font-family:'Sora',sans-serif;font-weight:800;color:var(--gr);font-size:13px;}
td.td-loc{color:var(--mid);max-width:120px;overflow:hidden;text-overflow:ellipsis;}
td.td-tags{max-width:180px;}
td.td-tags .tag{margin-right:2px;margin-bottom:2px;display:inline-block;}
td.td-act{white-space:nowrap;}
td.td-act button{height:22px;padding:0 7px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);margin-right:3px;}
.tbl-open{background:var(--bl2);color:var(--bl);}
.tbl-cw{background:var(--gr2);color:var(--gr3);}
.tbl-chk{width:16px;height:16px;border:1.5px solid var(--ghost);border-radius:3px;cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;transition:all .12s;}
.tbl-chk svg{width:9px;height:9px;display:none;}
.sel-row .tbl-chk{background:var(--bl);border-color:var(--bl);}
.sel-row .tbl-chk svg{display:block;}
td.pri-cell .pribadge{display:inline-block;}


/* 寮バッジ */
.dorm-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;border-radius:6px;padding:3px 9px;letter-spacing:.02em;}
.dorm-on{background:#fff7ed;color:#c2410c;border:1.5px solid #fed7aa;}
.dorm-off{background:var(--snow);color:var(--faint);border:1.5px solid var(--ghost);}
.dorm-fee{font-size:10px;color:#c2410c;font-weight:600;background:#fff7ed;border-radius:4px;padding:2px 7px;margin-left:3px;}
/* カード内寮ブロック */
.c-dorm{display:flex;align-items:center;gap:4px;margin-bottom:4px;flex-wrap:wrap;}
/* テーブルの寮列 */
.td-dorm-on{color:#c2410c;font-weight:800;}
.td-dorm-off{color:var(--faint);}
/* クイックフィルター 寮完備ON時に強調 */
.qc[data-g="dorm"].on{background:#c2410c;border-color:#c2410c;color:#fff;}


/* 年齢・勤務地を目立たせる */
.c-meta-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
.c-loc-strong{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink);background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:6px;padding:3px 9px;}
.c-loc-strong svg{width:13px;height:13px;fill:#2563eb;flex-shrink:0;}
.c-loc-strong .pf{color:#1e40af;font-weight:800;}
.c-loc-strong .ct{color:var(--mid);font-weight:600;}
.c-age-strong{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:#7c2d12;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:6px;padding:3px 9px;}
.c-age-strong.no-limit{color:var(--mid);background:var(--snow);border-color:var(--ghost);}
.c-age-strong.warn{color:var(--rd);background:var(--rdb);border-color:#fca5a5;}
.c-age-num{font-family:'Sora',sans-serif;font-size:14px;font-weight:800;}


/* 月給・時給ブロック */
.sal-block{display:inline-flex;align-items:stretch;background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:1.5px solid #86efac;border-radius:8px;overflow:hidden;margin-bottom:6px;}
.sal-cell{padding:5px 12px;display:flex;flex-direction:column;align-items:flex-start;}
.sal-cell + .sal-cell{border-left:1.5px solid #bbf7d0;}
.sal-primary{background:#dcfce7;}
.sal-primary .sal-num{color:#15803d;}
.sal-est .sal-num{color:#6b7280;font-weight:700;}
.sal-est .sal-label{color:#9ca3af;}
.sal-label{font-size:9px;font-weight:700;color:#15803d;letter-spacing:.04em;line-height:1;margin-bottom:3px;}
.sal-num{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;line-height:1;letter-spacing:-.02em;}
.sal-unit{font-size:10px;font-weight:600;color:var(--mid);margin-left:1px;}
.sal-est-mark{font-size:9px;color:#9ca3af;margin-right:1px;}
.bpill-strong{display:inline-flex;align-items:center;font-size:11px;font-weight:800;background:#fff7ed;color:#c2410c;border:1.5px solid #fed7aa;border-radius:6px;padding:4px 10px;margin-left:6px;align-self:center;margin-bottom:6px;}
.sal-row{display:flex;align-items:center;flex-wrap:wrap;gap:0;}




/* ━━ シンプル化リデザイン ━━ */
:root{
  --gap-s:6px;--gap-m:10px;--gap-l:14px;
  --rad:10px;--rad-s:6px;
}
body{font-size:14px;line-height:1.6;}
/* プロフィールバー：シンプル化 */
.opbar{background:#003d29 !important;padding:14px 24px !important;}
.opbar-title{font-size:11px !important;color:rgba(255,255,255,.55) !important;margin-bottom:10px !important;letter-spacing:.08em;}
.opbar-row{gap:10px !important;}
.opf-lbl{font-size:11px !important;color:rgba(255,255,255,.7) !important;font-weight:700;}
.opf input,.opf select{height:36px !important;font-size:14px !important;font-weight:700;background:#fff !important;color:var(--ink) !important;border:none !important;padding:0 12px !important;border-radius:8px !important;}
.opf input::placeholder{color:#94a3b8 !important;}
.op-tag{height:36px !important;padding:0 14px !important;font-size:13px !important;border-radius:8px !important;}
.op-go{height:36px !important;padding:0 18px !important;font-size:13px !important;border-radius:8px !important;}
.op-clear{height:36px !important;padding:0 14px !important;font-size:12px !important;border-radius:8px !important;}
.op-status{font-size:13px !important;}
.op-status .num{font-size:17px !important;}

/* カード密度を整える */
.card{padding:14px 18px !important;margin-bottom:8px !important;border-radius:var(--rad) !important;border:1.5px solid var(--ghost);box-shadow:none !important;transition:border-color .15s,box-shadow .15s;}
.card:hover{border-color:#94a3b8;box-shadow:0 2px 8px rgba(0,0,0,.04) !important;}
.card-op{position:relative;}

/* マッチサイドバッジを巨大化 */
.match-side{position:absolute;left:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:var(--rad) 0 0 var(--rad);padding:0 12px;min-width:56px;border-right:none !important;}
.match-side.s{background:#16a34a;}
.match-side.a{background:#2563eb;}
.match-side.b{background:#f59e0b;}
.match-side.x{background:#94a3b8;}
.match-grade{font-family:'Sora',sans-serif;font-size:24px !important;font-weight:800;color:#fff !important;line-height:1;letter-spacing:-.04em;}
.match-pct{font-size:11px !important;font-weight:800;color:rgba(255,255,255,.95) !important;line-height:1;}
.card-op.has-match-side{padding-left:72px !important;}

/* 案件IDバッジ：右上の控えめだが押せる */
.op-id-badge{position:absolute;top:10px;right:14px;font-size:11px;font-weight:700;color:#64748b;background:transparent;border:1px solid var(--ghost);border-radius:6px;padding:3px 9px;font-family:'Sora',monospace;cursor:pointer;transition:all .12s;}
.op-id-badge:hover{background:var(--snow);border-color:#94a3b8;color:var(--ink);}
.op-id-badge.copied{background:#10b981 !important;color:#fff !important;border-color:#10b981 !important;}

/* 1行目: 順位 + 社名 + 給与（最重要） */
.row-main{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding-right:90px;flex-wrap:wrap;}
.pri-mark{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;color:#475569;letter-spacing:-.02em;flex-shrink:0;min-width:32px;}
.pri-mark.p1{color:#dc2626;}
.pri-mark.p2{color:#2563eb;}
.pri-mark.p3{color:#16a34a;}
.pri-mark.p4{color:#94a3b8;}
.co-name{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.01em;flex:1;min-width:200px;}
.sal-display{display:inline-flex;align-items:baseline;gap:4px;background:#f0fdf4;border:1.5px solid #16a34a;border-radius:8px;padding:5px 12px;font-family:'Sora',sans-serif;}
.sal-mon{font-size:20px;font-weight:800;color:#15803d;letter-spacing:-.02em;line-height:1;}
.sal-mon-u{font-size:11px;font-weight:700;color:#15803d;}
.sal-sep{margin:0 4px;color:#86efac;}
.sal-hr{font-size:13px;font-weight:700;color:#16a34a;letter-spacing:-.01em;}
.sal-hr-u{font-size:10px;font-weight:600;color:#16a34a;}

/* 2行目: 条件タグ（マッチング判定用） */
.row-cond{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.cond-pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:5px 11px;border-radius:7px;line-height:1.2;}
.cond-loc{background:#eff6ff;color:#1e40af;border:1.5px solid #bfdbfe;}
.cond-loc-ct{font-size:11px;font-weight:600;color:#3b82f6;margin-left:3px;}
.cond-age{background:#fef3c7;color:#92400e;border:1.5px solid #fcd34d;}
.cond-age.warn{background:#fee2e2;color:#991b1b;border-color:#fca5a5;}
.cond-age.no-limit{background:#f1f5f9;color:#64748b;border-color:#cbd5e1;font-weight:600;}
.cond-gender-m{background:#dbeafe;color:#1e3a8a;border:1.5px solid #93c5fd;}
.cond-gender-f{background:#fce7f3;color:#9d174d;border:1.5px solid #f9a8d4;}
.cond-shift{background:#f1f5f9;color:#475569;border:1.5px solid #cbd5e1;}
.cond-dorm{background:#ecfdf5;color:#065f46;border:1.5px solid #6ee7b7;}
.cond-dorm.free{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#78350f;border-color:#f59e0b;font-weight:800;}
.cond-bonus{background:linear-gradient(135deg,#fff7ed,#fed7aa);color:#9a3412;border:1.5px solid #fb923c;font-weight:800;}
.cond-bonus.big{background:linear-gradient(135deg,#fef3c7,#fbbf24);color:#78350f;border-color:#d97706;}

/* 3行目: 業種・職種 控えめに（hover時のみ濃く） */
.row-meta{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;font-size:11px;color:#94a3b8;}
.row-meta span{font-weight:600;}

/* チェックボックスを大きく */
.chk{width:20px !important;height:20px !important;border-radius:5px !important;flex-shrink:0;}
.chk svg{width:13px !important;height:13px !important;}

/* 開くボタンをアイコン化 */
.cbtns{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.cbn{height:36px !important;border-radius:8px !important;font-size:12px !important;font-weight:700 !important;padding:0 14px !important;}

/* カード展開部をシンプルに */
.cexp{padding:14px 18px 16px !important;background:#fafbfc !important;border-top:1px solid var(--ghost);}
.egrid{grid-template-columns:repeat(4,1fr) !important;gap:10px !important;margin-bottom:12px !important;}
.eg{padding:8px 10px !important;border-radius:6px !important;background:#fff !important;border:1px solid var(--ghost);}
.egl{font-size:10px !important;font-weight:700 !important;color:#64748b !important;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.egv{font-size:13px !important;font-weight:700 !important;color:var(--ink) !important;}

/* キャッチ表示 */
.catch{font-size:12px !important;color:#475569 !important;line-height:1.7 !important;background:#f1f5f9 !important;padding:8px 12px !important;border-radius:6px !important;margin-bottom:10px !important;border-left:3px solid #94a3b8;}

/* 展開部のボタン群 */
.ebtns{gap:6px !important;}
.ebn{height:34px !important;font-size:12px !important;padding:0 14px !important;border-radius:7px !important;}

/* マッチ完璧な求人を緑枠で強調 */
.card-op.match-perfect{border-color:#16a34a !important;border-width:2px !important;}
.card-op.match-good{border-color:#2563eb !important;}
.card-op.match-bad{opacity:.55;}

/* クイックフィルターバーを上部に固定的に */
.qbar{padding:8px 20px !important;background:#fff !important;border-bottom:1px solid var(--ghost);position:sticky;top:0;z-index:10;}
.qc{height:32px !important;padding:0 14px !important;font-size:12px !important;border-radius:7px !important;font-weight:700 !important;}

/* ツールバー（並び替え・件数・ビュー切替） */
.tb{padding:10px 20px !important;background:#fff !important;border-bottom:1px solid var(--ghost);}
.tb select{height:32px !important;font-size:13px !important;}

/* TOP3バナー */
.top3-bar{padding:14px 20px !important;background:linear-gradient(135deg,#fef3c7,#fde68a) !important;border:none !important;border-bottom:2px solid #f59e0b !important;}
.t3-lbl{font-size:13px !important;font-weight:800 !important;color:#78350f !important;}
.t3-clr{font-size:12px !important;padding:8px 16px !important;}
.t3-card{padding:14px !important;border-radius:10px !important;}
.t3-rank{font-size:24px !important;}
.t3-score{font-size:20px !important;font-weight:800 !important;}
.t3-co{font-size:14px !important;font-weight:700 !important;}
.t3-sal{font-size:18px !important;font-weight:800 !important;}
.t3-loc{font-size:12px !important;}

/* ━━ オペレーター常駐プロフィールバー ━━ */
.opbar{background:linear-gradient(135deg,#004d33 0%,#00875a 100%);padding:10px 16px;flex-shrink:0;border-bottom:2px solid #00a86b;}
.opbar-title{font-size:9px;font-weight:800;color:rgba(255,255,255,.65);letter-spacing:.12em;margin-bottom:6px;display:flex;align-items:center;gap:5px;text-transform:uppercase;}
.opbar-title svg{width:11px;height:11px;fill:rgba(255,255,255,.7);}
.opbar-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.opf{display:flex;align-items:center;gap:5px;}
.opf-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.6);}
.opf input,.opf select{height:30px;padding:0 9px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:6px;font-size:12px;font-family:var(--font);color:#fff;outline:none;font-weight:600;}
.opf input::placeholder{color:rgba(255,255,255,.4);}
.opf select option{color:var(--ink);background:#fff;}
.opf input:focus,.opf select:focus{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.5);}
.op-tags{display:flex;gap:4px;}
.op-tag{font-size:11px;font-weight:700;height:30px;padding:0 11px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-family:var(--font);transition:all .12s;}
.op-tag:hover{background:rgba(255,255,255,.2);}
.op-tag.on{background:#fff;color:var(--gr3);border-color:#fff;}
.op-go{height:30px;padding:0 14px;background:#fbbf24;color:#451a03;border:none;border-radius:99px;font-size:11px;font-weight:800;cursor:pointer;font-family:var(--font);box-shadow:0 1px 4px rgba(0,0,0,.2);}
.op-go:hover{background:#f59e0b;}
.op-clear{height:30px;padding:0 11px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.2);border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font);}
.op-status{margin-left:auto;font-size:11px;color:rgba(255,255,255,.85);font-weight:700;display:flex;align-items:center;gap:5px;}
.op-status .num{font-family:'Sora',sans-serif;font-size:14px;color:#fbbf24;font-weight:800;}

/* マッチカード強調 */
.card-op.match-perfect{box-shadow:0 0 0 2px #16a34a, 0 4px 16px rgba(22,163,74,.2);}
.card-op.match-good{box-shadow:0 0 0 2px #2563eb, 0 4px 14px rgba(37,99,235,.15);}
.card-op.match-bad{opacity:.6;}

/* マッチスコア左バッジ */
.match-side{position:absolute;left:-1px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1.5px solid var(--ghost);border-right:none;border-radius:8px 0 0 8px;padding:6px 7px;z-index:2;min-width:44px;}
.match-side.s{background:#dcfce7;border-color:#16a34a;}
.match-side.a{background:#dbeafe;border-color:#2563eb;}
.match-side.b{background:#fef3c7;border-color:#d97706;}
.match-side.x{background:#fee2e2;border-color:#dc2626;}
.match-grade{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;line-height:1;letter-spacing:-.04em;}
.match-side.s .match-grade{color:#15803d;}
.match-side.a .match-grade{color:#1d4ed8;}
.match-side.b .match-grade{color:#b45309;}
.match-side.x .match-grade{color:#b91c1c;}
.match-pct{font-size:9px;font-weight:700;color:var(--mid);line-height:1;}
.card-op.has-match-side{padding-left:50px;}
.card-op.has-match-side .ctop{padding-left:60px !important;}

/* ━━ 架電オペ向けカード ━━ */
.card-op{position:relative;}
.op-id-badge{position:absolute;top:8px;right:10px;font-size:10px;font-weight:700;color:var(--mid);background:var(--snow);border:1px solid var(--ghost);border-radius:99px;padding:2px 8px;letter-spacing:.02em;font-family:'Sora',monospace;}
.op-id-badge.copied{background:var(--gr);color:#fff;border-color:var(--gr);}
.op-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
/* 給与1行表示（コンパクト） */
.sal-line{display:inline-flex;align-items:center;gap:6px;background:#dcfce7;border:1.5px solid #86efac;border-radius:6px;padding:4px 10px;}
.sal-main{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;color:#15803d;line-height:1;letter-spacing:-.02em;}
.sal-main-u{font-size:10px;font-weight:700;color:#15803d;margin-left:1px;}
.sal-divider{width:1px;height:12px;background:#86efac;}
.sal-sub-c{font-size:11px;font-weight:700;color:#16a34a;}
.sal-sub-c::before{content:"≈";color:#86efac;margin-right:2px;font-weight:600;}
/* 場所と年齢を1行にまとめる */
.loc-age-row{display:inline-flex;align-items:center;gap:6px;}
.loc-pill{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:#1e40af;background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:6px;padding:3px 9px;}
.loc-pill svg{width:12px;height:12px;fill:#2563eb;flex-shrink:0;}
.loc-pill .ct-sm{font-size:11px;font-weight:600;color:#3b82f6;}
.age-pill{font-family:'Sora',sans-serif;font-size:11px;font-weight:800;color:#7c2d12;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:6px;padding:3px 8px;letter-spacing:.02em;}
.age-pill.warn{color:var(--rd);background:var(--rdb);border-color:#fca5a5;}
.age-pill.no-limit{color:var(--mid);background:var(--snow);border-color:var(--ghost);}
/* インライン情報チップ */
.info-chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:3px 7px;border-radius:4px;}
.ic-gender-m{background:#dbeafe;color:#1e40af;}
.ic-gender-f{background:#fce7f3;color:#9f1239;}
.ic-shift{background:#fef3c7;color:#92400e;}
.ic-bonus{background:linear-gradient(135deg,#fff7ed,#fed7aa);color:#9a3412;font-weight:800;border:1.5px solid #fb923c;padding:3px 10px !important;}
.ic-bonus-big{background:linear-gradient(135deg,#fef3c7,#fbbf24)!important;color:#78350f!important;border-color:#d97706!important;animation:bonusPulse 2s ease-in-out infinite;}
@keyframes bonusPulse{0%,100%{box-shadow:0 0 0 0 rgba(217,119,6,.4);}50%{box-shadow:0 0 0 4px rgba(217,119,6,0);}}
.ic-dorm{background:#fef3c7;color:#92400e;font-weight:700;}
.ic-job{background:var(--snow);color:var(--mid);}
/* ハイライト：寮費無料 */
.dorm-free{background:#fff7ed;color:#c2410c;font-weight:800;border:1.5px solid #fed7aa;}
/* 業種職種を控えめに */
.tag-meta{font-size:9px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;font-weight:600;margin-right:6px;}

@media(max-width:768px){.sidebar{display:none;}.egrid{grid-template-columns:repeat(2,1fr);}.saln{font-size:17px;}}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/*  天才UIデザイナー版 視認性大改修 v1                    */
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

/* ① 緑の求職者プロフィールバー完全削除 */
.opbar, .opbar-row {
  /* 視覚的には消すが、内部のinputは生かしてマッチング機能を維持 */
  height:0 !important;
  overflow:hidden !important;
  padding:0 !important;
  margin:0 !important;
  border:none !important;
  opacity:0 !important;
  pointer-events:none !important;
}

/* ② 背景トーンを少し落として「カード感」を引き立てる */
body { background:#f8fafc !important; }

/* ③ カード設計：余白・影・hover でホバー時に浮き上がる */
.card-op {
  background:#ffffff !important;
  border:1px solid #e2e8f0 !important;
  border-radius:14px !important;
  margin-bottom:12px !important;
  padding:18px 22px !important;
  box-shadow:0 1px 2px rgba(15,23,42,.04) !important;
  transition:transform .15s cubic-bezier(.4,0,.2,1), box-shadow .15s, border-color .15s !important;
  position:relative !important;
}
.card-op:hover {
  border-color:#94a3b8 !important;
  box-shadow:0 6px 16px rgba(15,23,42,.08), 0 0 0 1px rgba(148,163,184,.1) !important;
  transform:translateY(-1px);
}

/* ④ マッチ度バッジ（左サイド）：もっと大胆に、グラデーション */
.match-side {
  position:absolute !important;
  left:0 !important; top:0 !important; bottom:0 !important;
  width:62px !important;
  border-radius:14px 0 0 14px !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
  gap:3px !important;
  border:none !important;
}
.match-side.s { background:linear-gradient(160deg,#16a34a 0%,#15803d 100%) !important; }
.match-side.a { background:linear-gradient(160deg,#2563eb 0%,#1d4ed8 100%) !important; }
.match-side.b { background:linear-gradient(160deg,#f59e0b 0%,#d97706 100%) !important; }
.match-side.x { background:linear-gradient(160deg,#94a3b8 0%,#64748b 100%) !important; }
.match-grade {
  font-size:30px !important;
  font-weight:900 !important;
  color:#fff !important;
  letter-spacing:-.05em !important;
  line-height:1 !important;
  text-shadow:0 1px 2px rgba(0,0,0,.15);
}
.match-pct {
  font-size:11px !important;
  font-weight:700 !important;
  color:rgba(255,255,255,.95) !important;
  line-height:1 !important;
  letter-spacing:.02em;
}
.card-op.has-match-side { padding-left:82px !important; }

/* マッチ良好カードは枠を強調、不適合は薄く */
.card-op.match-perfect {
  border:2px solid #16a34a !important;
  box-shadow:0 0 0 4px rgba(22,163,74,.08) !important;
}
.card-op.match-good { border:2px solid #2563eb !important; }
.card-op.match-bad { opacity:.5 !important; filter:saturate(.5) !important; }

/* ⑤ 1行目（最重要）：順位 + 社名 + 給与 */
.row-main {
  display:flex !important;
  align-items:center !important;
  gap:14px !important;
  margin-bottom:11px !important;
  padding-right:120px !important;
}
.pri-mark {
  font-size:13px !important;
  font-weight:800 !important;
  flex-shrink:0 !important;
  min-width:46px !important;
  padding:5px 10px !important;
  border-radius:7px !important;
  text-align:center !important;
  letter-spacing:-.01em !important;
  line-height:1.1 !important;
}
.pri-mark.p1 { background:#fee2e2 !important; color:#b91c1c !important; }
.pri-mark.p2 { background:#dbeafe !important; color:#1d4ed8 !important; }
.pri-mark.p3 { background:#dcfce7 !important; color:#15803d !important; }
.pri-mark.p4 { background:#f1f5f9 !important; color:#64748b !important; }

/* 社名：第2の主役 */
.co-name {
  font-size:17px !important;
  font-weight:700 !important;
  color:#0f172a !important;
  letter-spacing:-.015em !important;
  flex:1 !important;
  min-width:180px !important;
  line-height:1.3 !important;
}

/* ⑥ 給与：第1の主役。デカく、緑色でハイライト */
.sal-display {
  display:inline-flex !important;
  align-items:baseline !important;
  gap:6px !important;
  background:linear-gradient(135deg,#dcfce7 0%,#bbf7d0 100%) !important;
  border:none !important;
  border-radius:10px !important;
  padding:7px 14px !important;
  flex-shrink:0 !important;
  box-shadow:0 1px 2px rgba(22,163,74,.1) !important;
}
.sal-mon {
  font-size:23px !important;
  font-weight:800 !important;
  color:#14532d !important;
  letter-spacing:-.02em !important;
  line-height:1 !important;
}
.sal-mon-u {
  font-size:11px !important;
  font-weight:700 !important;
  color:#14532d !important;
  margin-left:1px !important;
}
.sal-sep { color:#86efac !important; margin:0 4px !important; font-weight:300 !important; }
.sal-hr {
  font-size:13px !important;
  font-weight:700 !important;
  color:#15803d !important;
}
.sal-hr-u {
  font-size:10px !important;
  font-weight:600 !important;
  color:#16a34a !important;
}

/* ⑦ 2行目（条件タグ）：色の意味を統一 */
.row-cond {
  display:flex !important;
  align-items:center !important;
  gap:6px !important;
  flex-wrap:wrap !important;
  margin-bottom:4px !important;
}
.cond-pill {
  display:inline-flex !important;
  align-items:center !important;
  gap:5px !important;
  font-size:12.5px !important;
  font-weight:700 !important;
  padding:5px 11px !important;
  border-radius:7px !important;
  line-height:1.2 !important;
  border:1px solid transparent !important;
}
/* 場所＝青系 */
.cond-pill.cond-loc {
  background:#eff6ff !important; color:#1e40af !important; border-color:#bfdbfe !important;
}
.cond-loc-ct { font-size:11px !important; color:#3b82f6 !important; margin-left:4px !important; font-weight:600 !important; }
/* 年齢＝黄、警告は赤 */
.cond-pill.cond-age {
  background:#fefce8 !important; color:#854d0e !important; border-color:#fde047 !important;
}
.cond-pill.cond-age.warn {
  background:#fee2e2 !important; color:#991b1b !important; border-color:#fca5a5 !important;
  animation:agePulse 1.6s ease-in-out infinite;
}
@keyframes agePulse {
  0%,100% { box-shadow:0 0 0 0 rgba(220,38,38,.35); }
  50% { box-shadow:0 0 0 5px rgba(220,38,38,0); }
}
.cond-pill.cond-age.no-limit {
  background:#f1f5f9 !important; color:#64748b !important; border-color:#cbd5e1 !important; font-weight:600 !important;
}
/* 性別 */
.cond-pill.cond-gender-m {
  background:#eff6ff !important; color:#1e3a8a !important; border-color:#93c5fd !important;
}
.cond-pill.cond-gender-f {
  background:#fce7f3 !important; color:#9d174d !important; border-color:#f9a8d4 !important;
}
/* 勤務体制＝グレー */
.cond-pill.cond-shift {
  background:#f8fafc !important; color:#475569 !important; border-color:#cbd5e1 !important;
}
/* 寮＝緑（無料は強調） */
.cond-pill.cond-dorm {
  background:#ecfdf5 !important; color:#065f46 !important; border-color:#6ee7b7 !important;
}
.cond-pill.cond-dorm.free {
  background:linear-gradient(135deg,#fef3c7 0%,#fde68a 100%) !important;
  color:#713f12 !important; border-color:#ca8a04 !important; font-weight:800 !important;
}
/* 祝い金＝オレンジ */
.cond-pill.cond-bonus {
  background:linear-gradient(135deg,#fff7ed 0%,#fed7aa 100%) !important;
  color:#7c2d12 !important; border-color:#fb923c !important; font-weight:800 !important;
}
.cond-pill.cond-bonus.big {
  background:linear-gradient(135deg,#fef3c7 0%,#fbbf24 100%) !important;
  color:#78350f !important; border-color:#d97706 !important;
}

/* ⑧ 業種・職種は控えめに（補助情報） */
.row-meta {
  display:flex !important;
  gap:10px !important;
  margin-top:6px !important;
  font-size:11px !important;
  color:#94a3b8 !important;
  font-weight:500 !important;
  flex-wrap:wrap !important;
}
.row-meta span { position:relative; }
.row-meta span:not(:last-child)::after {
  content:"・"; margin-left:8px; color:#cbd5e1;
}

/* ⑨ 案件IDバッジ：右上で目立つように */
.op-id-badge {
  position:absolute !important;
  top:14px !important;
  right:14px !important;
  font-size:12px !important;
  font-weight:700 !important;
  font-family:'SF Mono',Menlo,monospace !important;
  color:#475569 !important;
  background:#f1f5f9 !important;
  border:1px solid #e2e8f0 !important;
  border-radius:7px !important;
  padding:5px 11px !important;
  cursor:pointer !important;
  transition:all .15s !important;
  letter-spacing:.02em !important;
  z-index:2;
}
.op-id-badge:hover {
  background:#0f172a !important;
  color:#fff !important;
  border-color:#0f172a !important;
}
.op-id-badge.copied {
  background:#16a34a !important; color:#fff !important; border-color:#16a34a !important;
}

/* ⑩ 詳細ボタン：青で目立つ */
.cbn {
  height:34px !important;
  padding:0 16px !important;
  font-size:12px !important;
  font-weight:700 !important;
  border-radius:8px !important;
  border:1px solid #e2e8f0 !important;
  background:#fff !important;
  color:#475569 !important;
  cursor:pointer !important;
  transition:all .15s !important;
}
.cbn:hover {
  background:#f8fafc !important; border-color:#94a3b8 !important; color:#0f172a !important;
}
.cbn-u {
  background:#2563eb !important;
  color:#fff !important;
  border-color:#2563eb !important;
}
.cbn-u:hover {
  background:#1d4ed8 !important; border-color:#1d4ed8 !important; color:#fff !important;
}

/* ⑪ クイックフィルター（qbar）をコンパクト + ダークアクセント */
.qbar {
  padding:10px 20px !important;
  background:#fff !important;
  border-bottom:1px solid #e2e8f0 !important;

/* ⑯ カード展開部（cexp） */

}

/* 絞込ボタン */

  background:rgba(255,255,255,.18) !important;
}

/* SVGアイコンを白に */
.hdr svg { color:#fff !important; fill:currentColor !important; }

</style>
</head>

// ━━ TOP3 ━━
function calcMatchScore(j){
  var age=parseInt(document.getElementById('p-age').value)||0;
  var gender=window.profGender||'';
  var pref=document.getElementById('p-pref').value;
  var shift=document.getElementById('p-shift').value;
  var dorm=window.profDorm?'1':'';
  var minSal=parseFloat((document.getElementById('p-minsal')||{}).value)||0;
  if(!(age||gender||pref||shift||dorm))return null;
  var score=0,max=0,ngs=[];
  if(age>0){max+=30;if(age>Number(j.年齢上限))ngs.push('年齢NG');else score+=30;}
  if(gender){max+=25;if(j.性別==='不問'||!j.性別||j.性別===gender)score+=25;else ngs.push('性別NG');}
  if(pref){max+=20;if(j.都道府県===pref)score+=20;}
  if(shift){max+=15;if((j.勤務体制||'').split(',').indexOf(shift)>=0)score+=15;}
  if(dorm==='1'){max+=10;if(j.寮完備==='1')score+=10;else ngs.push('寮なし');}
  if(minSal>0){max+=10;var jSalManYen=j.給与>=1000?(j.給与*8*22/10000):j.給与;if(jSalManYen>=minSal)score+=10;else ngs.push('給与不足');}
  if(!max)return null;
  var pct=Math.round(score/max*100);
  return{pct:pct,grade:pct>=90?'S':pct>=70?'A':pct>=50?'B':'X',ngs:ngs};
}

  // 検索条件を一旦リセットしてプロフィール条件で再構築
  af.gender=gender?[gender]:[];
  af.pref=pref?[pref]:[];
  af.shift=shift?[shift]:[];
  af.dorm=dorm==='1'?['1']:[];
  af.bonus=bonus==='1'?['1']:[];
  
  // チップ反映
  document.querySelectorAll('.chip,.qc').forEach(function(c){
    var g=c.dataset.g,v=c.dataset.v;
    if(!g)return;
    if(g==='gender')c.classList.toggle('on',v===gender);
    else if(g==='shift')c.classList.toggle('on',v===shift);
    else if(g==='dorm')c.classList.toggle('on',dorm==='1');
    else if(g==='bonus')c.classList.toggle('on',bonus==='1');
  });
  
  if(pref)renderPChips();
  
  updBadge();applyFilter();
  
  // ステータス表示
  var st=document.getElementById('op-status');
  if(st){
    var hasProfile=age||gender||pref||shift||minSal||dorm||bonus;
    if(hasProfile){
      var matched=filtered.length;
      st.innerHTML='<span class="num">'+matched+'</span>件マッチ';
    }else{
      st.innerHTML='';
    }
  }
}

function buildChips(){
  var mk=function(id,vals,g){document.getElementById(id).innerHTML=vals.map(function(v){return'<button class="chip" data-g="'+g+'" data-v="'+v+'" onclick="togC(this)">'+v+'</button>';}).join('');};
  mk('cp-gyoshu',[...new Set(allJobs.map(function(j){return j.業種;}).filter(Boolean))].sort(),'gyoshu');
  mk('cp-shokushu',[...new Set(allJobs.map(function(j){return j.職種;}).filter(Boolean))].sort(),'shokushu');
  var bn=document.getElementById('brand-n');bn.textContent=allJobs.length.toLocaleString()+'件';bn.style.display='inline';
  document.getElementById('sk-n').textContent=allJobs.filter(function(j){return j.emp==='紹介予定派遣';}).length;
  window._cbp={};
  Object.keys(CITY_COORDS).forEach(function(k){var p=k.split('_')[0];var c=k.split('_').slice(1).join('_');if(!window._cbp[p])window._cbp[p]=[];window._cbp[p].push(c);});
  Object.keys(window._cbp).forEach(function(p){window._cbp[p].sort();});
  renderSavedProfs();
}
function togArea(n){var b=document.getElementById('ar-'+n);if(areas.has(n)){areas.delete(n);b.classList.remove('on');AREA_MAP[n].forEach(function(p){var i=af.pref.indexOf(p);if(i>=0)af.pref.splice(i,1);});}else{areas.add(n);b.classList.add('on');}renderPChips();updBadge();applyFilter();}

function togPref(p){var i=af.pref.indexOf(p);if(i>=0)af.pref.splice(i,1);else af.pref.push(p);renderPChips();updBadge();applyFilter();}

function updBadge(){
  var cnt=Object.values(af).reduce(function(s,a){return s+a.length;},0)+(areas.size?1:0);
  var fb=document.getElementById('fbn');fb.textContent=cnt;fb.style.display=cnt?'inline':'none';
  document.getElementById('hb-f').classList.toggle('on',sbOn);
  var hr=document.getElementById('hb-r');if(hr)hr.classList.toggle('show',cnt>0);
  document.getElementById('sbrst').style.display=cnt>0?'inline-block':'none';
  document.getElementById('abar').classList.toggle('on',cnt>0);
  var tags=[];
  if(areas.size>0||af.pref.length>0){if(af.pref.length>0)af.pref.forEach(function(p){tags.push({l:'📍 '+p,g:'pref',v:p});});else areas.forEach(function(a){tags.push({l:'📍 '+a,g:'area',v:a});});}
  af.gender.forEach(function(v){tags.push({l:'👤 '+v,g:'gender',v:v});});
  af.shift.forEach(function(v){tags.push({l:'🕐 '+v,g:'shift',v:v});});
  if(af.dorm.length)tags.push({l:'🏠 寮完備',g:'dorm',v:'1'});
  if(af.freedorm.length)tags.push({l:'💰 寮費無料',g:'freedorm',v:'1'});
  if(af.bonus.length)tags.push({l:'🎁 祝い金',g:'bonus',v:'1'});
  af.pri.forEach(function(v){tags.push({l:'★ '+v+'位',g:'pri',v:v});});
  af.gyoshu.forEach(function(v){tags.push({l:v,g:'gyoshu',v:v});});
  af.shokushu.forEach(function(v){tags.push({l:v,g:'shokushu',v:v});});
  document.getElementById('atags').innerHTML=tags.map(function(t){return'<span class="atag">'+t.l+'<span class="atag-x" onclick="rmTag(\''+t.g+'\',\''+esc(t.v)+'\')">×</span></span>';}).join('');

function rmTag(g,v){
  if(g==='area'){areas.delete(v);var b=document.getElementById('ar-'+v);if(b)b.classList.remove('on');if(AREA_MAP[v])AREA_MAP[v].forEach(function(p){var i=af.pref.indexOf(p);if(i>=0)af.pref.splice(i,1);});renderPChips();}
  else if(g==='pref'){var i=af.pref.indexOf(v);if(i>=0)af.pref.splice(i,1);renderPChips();}
  else{var i=af[g].indexOf(v);if(i>=0)af[g].splice(i,1);document.querySelectorAll('.chip[data-g="'+g+'"][data-v="'+v+'"],.qc[data-g="'+g+'"][data-v="'+v+'"]').forEach(function(c){c.classList.remove('on');});}
  updBadge();applyFilter();
}
function applyFilter(){
  var kw=document.getElementById('kw').value.trim().toLowerCase(),smin=parseFloat(document.getElementById('smin').value)||0,smax=parseFloat(document.getElementById('smax').value)||99999,age=parseInt(document.getElementById('age').value)||0;
  filtered=allJobs.filter(function(j){
    if(areas.size>0){if(af.pref.length>0){if(af.pref.indexOf(j.都道府県)<0)return false;}else{var ok=false;areas.forEach(function(a){if(AREA_MAP[a].indexOf(j.都道府県)>=0)ok=true;});if(!ok)return false;}}
    else if(af.pref.length>0&&af.pref.indexOf(j.都道府県)<0)return false;
    if(af.gyoshu.length&&af.gyoshu.indexOf(j.業種)<0)return false;
    if(af.shokushu.length&&af.shokushu.indexOf(j.職種)<0)return false;
    if(af.gender.length&&af.gender.indexOf(j.性別)<0)return false;
    if(af.pri.length&&af.pri.indexOf(j.優先順位)<0)return false;
    if(af.dorm.indexOf('1')>=0&&j.寮完備!=='1')return false;
    if(af.freedorm.indexOf('1')>=0){
      if(j.寮完備!=='1')return false;
      var dfTxt=(j.寮費||'').toString();
      var isFree=dfTxt.indexOf('無料')>=0||dfTxt.indexOf('0円')>=0||dfTxt.indexOf('ゼロ')>=0||dfTxt==='1';
      if(!isFree)return false;
    }
    if(af.bonus.indexOf('1')>=0&&j.祝い金<=0)return false;
    if(af.shift.length){var js=(j.勤務体制||'').split(',');if(!af.shift.some(function(s){return js.indexOf(s)>=0;}))return false;}
    if(j.給与<smin||j.給与>smax)return false;
    if(age>0&&age>Number(j.年齢上限))return false;
    if(kw){var h=[j.社名,j.都道府県,j.市区町村,j.業種,j.職種,j.タイトル,j.キャッチ,j.案件名,j.案件ID].join(' ').toLowerCase();if(h.indexOf(kw)<0)return false;}
    return true;
  });
  document.getElementById('rcnt').innerHTML=allJobs.length?'<strong>'+filtered.length+'</strong> / '+allJobs.length:'';
  renderJobs();
}
function genTalk(j){var sal=fmtSal(j.給与);return '「'+j.都道府県+' '+j.市区町村+'のお仕事はいかがでしょうか？」\n\n【'+j.社名+'】\n'+(j.タイトル||'')+'\n\n📍 '+j.都道府県+' '+j.市区町村+(j.最寄り駅?' ／ '+j.最寄り駅:'')+'\n💰 '+sal.n+sal.u+'（'+sal.l+'）'+(j.祝い金>0?'　🎁 祝い金'+j.祝い金+'万円':'')+'\n'+(j.寮完備==='1'?'🏠 寮完備\n':'')+(j.勤務体制?'🕐 '+j.勤務体制+'\n':'')+'\nご興味はありますか？';}
function renderJobs(){
  var s=document.getElementById('sort').value;
  var jms=filtered.map(function(j){return{j:j,ms:calcMatchScore(j)};});
  jms.sort(function(a,b){
    if(s==='match'){var sa=a.ms?a.ms.pct:0,sb=b.ms?b.ms.pct:0;if(sb!==sa)return sb-sa;return(parseInt(a.j.優先順位)||9)-(parseInt(b.j.優先順位)||9);}
    if(s==='pri'){
      // プロフィール入力中なら自動でマッチ度優先
      var hasProf=document.getElementById('p-age').value||window.profGender||document.getElementById('p-pref').value||document.getElementById('p-shift').value||document.getElementById('p-minsal').value||window.profDorm||window.profBonus;
      if(hasProf){
        var sa=a.ms?a.ms.pct:0,sb=b.ms?b.ms.pct:0;
        if(sb!==sa)return sb-sa;
      }
      return(parseInt(a.j.優先順位)||9)-(parseInt(b.j.優先順位)||9);
    }
    if(s==='sd')return b.j.給与-a.j.給与;if(s==='sa')return a.j.給与-b.j.給与;
    if(s==='bonus')return b.j.祝い金-a.j.祝い金;return 0;
  });
  sorted=jms.map(function(x){return x.j;});
  sel=new Set();updSel();
  var el=document.getElementById('jobs');
  if(!sorted.length){el.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><div class="empty-txt">条件に合う求人がありません</div></div>';return;}
  var pl={1:'★ 1位',2:'★ 2位',3:'★ 3位',4:'4位'};
  var pc=['p1','p2','p3','p4'];
  var mc={S:['#1b5e20','#e8f5e9'],A:['#1a237e','#e8eaf6'],B:['#e65100','#fff8e1'],X:['#c0392b','#fdecea']};
  var h='';
  for(var i=0;i<Math.min(sorted.length,300);i++){
    var j=sorted[i];var ms=jms[i]?jms[i].ms:null;
    var cc='card'+(j.選択?' sel':'');
    var pri=parseInt(j.優先順位)||4;
    var sal=fmtSal(j.給与);
    
    // マッチサイドバッジ
    var msSideHTML='';
    var ccExtra='';
    if(ms){
      var grade=ms.grade.toLowerCase();
      msSideHTML='<div class="match-side '+grade+'"><div class="match-grade">'+ms.grade+'</div><div class="match-pct">'+ms.pct+'%</div></div>';
      ccExtra=' has-match-side';
      if(ms.grade==='S')ccExtra+=' match-perfect';
      else if(ms.grade==='A')ccExtra+=' match-good';
      else if(ms.grade==='X')ccExtra+=' match-bad';
    }
    
    // 年齢ピル
    var ageHTML='';
    if(j.年齢上限<99){
      var ageWarn=(ms&&ms.ngs.indexOf('年齢NG')>=0)?' warn':'';
      ageHTML='<span class="cond-pill cond-age'+ageWarn+'">~'+j.年齢上限+'歳</span>';
    }else{
      ageHTML='<span class="cond-pill cond-age no-limit">年齢不問</span>';
    }
    
    // 性別
    var genderHTML='';
    if(j.性別==='男性')genderHTML='<span class="cond-pill cond-gender-m">♂男性</span>';
    else if(j.性別==='女性')genderHTML='<span class="cond-pill cond-gender-f">♀女性</span>';
    
    // 勤務体制
    var shiftHTML='';
    var shifts=(j.勤務体制||'').split(',').filter(function(s){return s;});
    shifts.forEach(function(s){shiftHTML+='<span class="cond-pill cond-shift">'+s+'</span>';});
    
    // 寮
    var dormHTML='';
    if(j.寮完備==='1'){
      var df=j.寮費||'';
      var isFree=df.indexOf('無料')>=0||df==='1';
      var dfText=(df&&df!=='1')?(df.length>14?df.slice(0,14)+'…':df):'寮完備';

      bonusHTML='<span class="'+bxClass+'" title="'+(j.祝い金詳細||'入社祝金')+'">🎁 '+j.祝い金+'万円</span>';
    }
    
    // 業種・職種（控えめ）
    var metaHTML='';
    if(j.業種||j.職種){
      metaHTML='<div class="row-meta">';

      if(j.職種)metaHTML+='<span>'+j.職種+'</span>';

    if(pri===1)priText='★ 1位';
    else if(pri===2)priText='★ 2位';
    else if(pri===3)priText='★ 3位';
    else priText='4位';
    
    h+='<div class="'+cc+' card-op'+ccExtra+'" id="jc'+i+'">'
      +msSideHTML
      +'<div class="ctop" onclick="togCard('+i+')">'
        +'<div class="chk" onclick="event.stopPropagation();togSel('+i+')"><svg viewBox="0 0 12 10" fill="none"><path d="M1 5L4.5 8.5L11 1" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
        +'<div class="cbody">'
          +'<span class="op-id-badge" onclick="event.stopPropagation();copyId(this,\''+j.案件ID+'\')" title="クリックで案件IDコピー">#'+(j.案件ID||'-')+'</span>'
          +'<div class="row-main">'
            +'<span class="pri-mark p'+pri+'">'+priText+'</span>'
            +'<span class="co-name">'+j.社名+'</span>'
            +'<span class="sal-display">'
              +'<span class="sal-mon">'+sal.monthly+'<span class="sal-mon-u">万</span></span>'
              +'<span class="sal-sep">|</span>'
              +'<span class="sal-hr">'+sal.hourly+'<span class="sal-hr-u">円</span></span>'
            +'</span>'
          +'</div>'
          +'<div class="row-cond">'
            +'<span class="cond-pill cond-loc">📍 '+j.都道府県+ctHTML+'</span>'
            +ageHTML
            +genderHTML
            +shiftHTML
            +dormHTML
            +bonusHTML
          +'</div>'
          +metaHTML
        +'</div>'
        +'<div class="cbtns">'
          +urlBtn
        +'</div>'
      +'</div>'
      +'<div class="cexp">'
        +'<div class="egrid">'
          +'<div class="eg"><div class="egl">案件ID</div><div class="egv">'+(j.案件ID||'-')+'</div></div>'
          +'<div class="eg"><div class="egl">仕事No.</div><div class="egv" style="font-size:11px;word-break:break-all">'+(j.仕事No||'-')+'</div></div>'
          +'<div class="eg"><div class="egl">最寄り駅</div><div class="egv" style="font-size:11px;">'+(j.最寄り駅||'-')+'</div></div>'
          +'<div class="eg"><div class="egl">寮費</div><div class="egv" style="font-size:11px;">'+dfDetail+'</div></div>'
          +bxBlock
        +'</div>'
        +titleH
        +catchH
        +'<div class="ebtns">'
          +'<button class="ebn ebn-sel" onclick="togSel('+i+')" id="selb'+i+'">＋ 比較に追加</button>'
          +'<button class="ebn ebn-del" onclick="askDel('+i+',\''+esc(j.社名)+'\',\''+j.案件ID+'\')">削除</button>'
        +'</div>'
      +'</div>'
    +'</div>';
  }
  el.innerHTML=h;
}

var viewMode='card',tblSortKey='pri',tblSortAsc=true;

function setView(v){
  viewMode=v;
  // showViewを通じて表示を更新（競合防止）
  var inMain=(curView==='list'||curView==='seiki'||curView==='near');
  if(inMain||curView==='list'){
    document.getElementById('vlist').style.display=(v==='card'&&curView!=='seiki'&&curView!=='near')?'flex':'none';
    var vt=document.getElementById('vtable');if(vt)vt.style.display=(v==='table'&&curView!=='seiki'&&curView!=='near')?'block':'none';
  }
  document.getElementById('vt-card').classList.toggle('on',v==='card');
  document.getElementById('vt-table').classList.toggle('on',v==='table');
  if(v==='table')renderTable();
}

function tblSort(key){
  if(tblSortKey===key)tblSortAsc=!tblSortAsc;
  else{tblSortKey=key;tblSortAsc=key==='co';}
  renderTable();
}

function renderTable(){
  var rows=[].concat(sorted);
  rows.sort(function(a,b){
    var av,bv;
    if(tblSortKey==='pri'){av=parseInt(a.優先順位)||9;bv=parseInt(b.優先順位)||9;}
    else if(tblSortKey==='sal'){av=a.給与;bv=b.給与;}
    else if(tblSortKey==='ag'){av=a.年齢上限;bv=b.年齢上限;}
    else if(tblSortKey==='bx'){av=a.祝い金;bv=b.祝い金;}
    else if(tblSortKey==='co'){av=a.社名;bv=b.社名;return tblSortAsc?(av<bv?-1:av>bv?1:0):(av<bv?1:av>bv?-1:0);}
    else{av=0;bv=0;}
    return tblSortAsc?av-bv:bv-av;
  });
  var pl={1:'★1位',2:'★2位',3:'★3位',4:'4位'};
  var pc={1:'pb1',2:'pb2',3:'pb3',4:'pb4'};
  var h='';
  rows.forEach(function(j){
    var i=sorted.indexOf(j);
    var sal=fmtSal(j.給与);
    var isSel=sel.has(i);
    var ms=null;try{ms=calcMatchScore(j);}catch(e){}
    var tg='';
    if(j.寮完備==='1')tg+='<span class="tag to">&#x1F3E0;寮</span>';
    if(j.祝い金>0)tg+='<span class="tag tp">祝'+j.祝い金+'万</span>';
    if(j.勤務体制)(j.勤務体制.split(',').filter(Boolean)).forEach(function(s){tg+='<span class="tag tt">'+s+'</span>';});
    if(ms&&ms.ngs.length)ms.ngs.forEach(function(ng){tg+='<span class="tag tag-ng">⚠'+ng+'</span>';});
    var pri=parseInt(j.優先順位)||4;
    h+='<tr class="'+(isSel?'sel-row':'')+'" id="tr'+i+'">'
      +'<td><div class="tbl-chk" onclick="togSel('+i+');renderTable()"><svg viewBox="0 0 12 10" fill="none"><path d="M1 5L4.5 8.5L11 1" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></td>'
      +'<td class="pri-cell"><span class="pribadge '+pc[pri]+'">'+pl[pri]+'</span>'+(ms?'<span class="ms-g ms-'+ms.grade.toLowerCase()+'" style="margin-left:4px;display:inline-block;">'+ms.grade+'</span>':'')+'</td>'
      +'<td class="td-co" title="'+j.社名+'">'+j.社名+'</td>'
      +'<td class="td-sal">'+sal.n+'<span style="font-size:10px;font-weight:400;color:var(--faint);">'+sal.u+'</span></td>'
      +'<td class="td-loc">'+j.都道府県+' '+j.市区町村+'</td>'
      +'<td style="text-align:center;">'+(j.年齢上限<99?j.年齢上限+'歳':'—')+'</td>'
      +'<td style="text-align:center;">'+(j.性別||'—')+'</td>'
      +'<td style="color:var(--mid);font-size:11px;">'+(j.勤務体制||'—')+'</td>'
      +'<td class="'+(j.寮完備==="1"?'td-dorm-on':'td-dorm-off')+'">'+(j.寮完備==="1"?'🏠 '+(j.寮費||'無料'):'—')+'</td>'
      +'<td style="text-align:center;font-weight:700;color:var(--or);">'+(j.祝い金>0?j.祝い金+'万':'—')+'</td>'
      +'<td class="td-tags">'+tg+'</td>'
      +'<td class="td-act">'
        +(j.url?'<button class="tbl-open" onclick="window.open(\''+j.url+'\',\'_blank\')">開く</button>':'')
        +''
      +'</td>'
    +'</tr>';
  });
  document.getElementById('tbl-body').innerHTML=h;
}

function haversine(la1,lo1,la2,lo2){var R=6371,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

  var pf=document.getElementById('npref').value,ct=document.getElementById('ncity').value;

  var limit=parseInt(document.getElementById('nlim').value)||20,label=ct?(pf+' '+ct):pf;
  var cands=filtered.filter(function(j){if(naf.ng.length&&naf.ng.indexOf(j.性別)<0)return false;if(naf.nd.indexOf('1')>=0&&j.寮完備!=='1')return false;if(naf.nb.indexOf('1')>=0&&j.祝い金<=0)return false;return true;});

    h+='<div class="nc-card" onclick="goJob(\''+j.案件ID+'\')">'
      +'<div class="nc-rank '+(idx<3?'top':'')+'">'+('0'+(idx+1)).slice(-2)+'</div>'
      +'<div class="nc-pri" style="'+pcls2[pri-1]+'">'+pl2[pri]+'</div>'
      +'<div class="nc-body"><div class="nc-co">'+j.社名+'</div><div class="nc-loc">'+j.都道府県+' '+j.市区町村+' <span class="'+(item.precise?'pt-c':'pt-p')+'">'+(item.precise?'市区町村':'都道府県')+'</span></div><div class="tags">'+tg+'</div></div>'

  });
  el.innerHTML=h;
}

    var paEl = document.getElementById('p-age');
    if(ageEl && paEl && paEl.value !== ageEl.value){
      paEl.value = ageEl.value;
      paEl.dispatchEvent(new Event('input', {bubbles:true}));
    }
    var sminEl = document.getElementById('smin');
    var pminEl = document.getElementById('p-minsal');
    if(sminEl && pminEl && pminEl.value !== sminEl.value){
      pminEl.value = sminEl.value;
      pminEl.dispatchEvent(new Event('input', {bubbles:true}));
    }
  }
  function bind(){
    ['age','smin','smax'].forEach(function(id){
      var el = document.getElementById(id);
      if(el && !el._syncBound){
        el._syncBound = true;
        el.addEventListener('input', syncToOpbar);
        el.addEventListener('change', syncToOpbar);
      }
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', bind);
  } else {
    bind();
  }
  setTimeout(bind, 500);
  setTimeout(bind, 1500);
})();
</script>

</body>
