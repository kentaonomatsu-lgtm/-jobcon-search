<head>
<meta charset="UTF-8">

<title>JCコールナビ｜ログイン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;background:#f2f7f2;color:#231815;font-size:15px;line-height:1.55;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:#fff;border-radius:16px;border-top:5px solid #168a27;box-shadow:0 4px 14px rgba(0,0,0,.10);padding:28px 22px 22px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.ic{width:44px;height:44px;border-radius:11px;background:linear-gradient(160deg,#168a27 0 60%,#44e34a 60% 100%);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center}
.logo b{display:block;font-size:20px;font-weight:900;font-style:italic;line-height:1.15}
.logo b span{color:#168a27}
.logo small{display:block;font-size:11px;font-weight:700;color:#6b7280}
label.f{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
input[type=password],input[type=text]{width:100%;height:48px;padding:0 14px;border:1.5px solid #d1d5db;border-radius:10px;font-size:16px;background:#f9fafb}
input:focus{outline:none;border-color:#168a27;background:#fff;box-shadow:0 0 0 3px rgba(22,138,39,.15)}
.keep{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:13px;color:#374151}
.keep input{width:18px;height:18px;accent-color:#168a27}
button.go{width:100%;height:48px;margin-top:14px;border-radius:10px;background:#168a27;color:#fff;font-size:16px;font-weight:800;border:none;cursor:pointer}
button.go:disabled{opacity:.6;cursor:default}
.err{min-height:22px;margin-top:10px;font-size:13px;font-weight:700;color:#dc2626}
.note{margin-top:8px;font-size:12px;color:#6b7280}
.busy{text-align:center;color:#6b7280;padding:24px 0}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="ic">JC</div><div><b>JC<span>コールナビ</span></b><small>ジョブコン求人 架電サポート</small></div></div>
  <div class="busy" id="busy" hidden>読み込み中…</div>
  <form id="fm" autocomplete="on" hidden>
    <label class="f" for="pw">パスワード</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="keep"><input id="keep" type="checkbox" checked>この端末でログイン状態を保持（30日）</label>
    <button class="go" id="go" type="submit">ログイン</button>
    <div class="err" id="err" role="alert"></div>
    <div class="note">パスワードは管理者にご確認ください。</div>
  </form>

<script>
(function(){
  'use strict';
  var KEEP_DAYS=30;
  var $=function(i){return document.getElementById(i)};
  var V=JSON.parse($('jc-vault').textContent), fails=0;
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function norm(s){return String(s).normalize('NFKC').trim()}
  function ui(mode,msg){
    $('busy').hidden=mode!=='busy'; $('fm').hidden=mode!=='form';
    $('err').textContent=msg||'';
    if(mode==='form'){ $('go').disabled=false; try{$('pw').focus()}catch(e){} }
  }
  function decrypt(pass){
    var s=window.crypto&&crypto.subtle;
    if(!s) return Promise.reject(new Error('NOCRYPTO'));
    var enc=new TextEncoder();
    return s.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']).then(function(km){
      return s.deriveKey({name:'PBKDF2',salt:b64(V.s),iterations:V.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){
      return s.decrypt({name:'AES-GCM',iv:b64(V.iv)},key,b64(V.ct));
    }).then(function(buf){return new TextDecoder().decode(buf)});
  }
  function save(pass,keep){
    try{sessionStorage.setItem('jc_pass',pass)}catch(e){}
    try{
      if(keep) localStorage.setItem('jc_pass_v1',JSON.stringify({p:pass,exp:Date.now()+KEEP_DAYS*86400000}));
      else localStorage.removeItem('jc_pass_v1');
    }catch(e){}
  }
  function forget(){try{sessionStorage.removeItem('jc_pass');localStorage.removeItem('jc_pass_v1')}catch(e){}}
  function stored(){
    try{
      var p=sessionStorage.getItem('jc_pass'); if(p) return p;
      var r=JSON.parse(localStorage.getItem('jc_pass_v1')||'null');
      if(r&&r.p&&r.exp>Date.now()) return r.p;
    }catch(e){}
    return '';
  }
  /* 参照元をスプレッドシートのみにする補正(2026/11/3):
     ページ内に埋め込まれた古いフォローコール用スナップショットから「シートに無い求人」を
     一覧へ足し込む処理だけを無効化する。UI・他の機能は一切変更しない。
     該当処理が見つからない場合は何もせず従来どおり表示する。 */
  var JC_FOREIGN_OFF=true; /* 外国籍OK対象を一旦すべて無し(0件)にする。復活させる時は false にする */
  function jcSheetOnly(html){
    if(JC_FOREIGN_OFF){
      try{
        var rf=/const\s+FOREIGN_SITES\s*=\s*\[[\s\S]*?\n\]\s*;/;
        if(rf.test(html)) html=html.replace(rf,function(){return 'const FOREIGN_SITES=[];'});
        else console.warn('jcSheetOnly: FOREIGN_SITES が見つかりません');
      }catch(x){}
    }
    try{
      var re=/else\s*\{\s*const\s+n\s*=\s*Object\.assign\(\s*\{\s*\}\s*,\s*e\s*\)\s*;\s*n\._fcx\s*=\s*1\s*;\s*jobs\.push\(\s*n\s*\)\s*;\s*byId\.set\(\s*k\s*,\s*n\s*\)\s*;\s*\}/;
      if(!re.test(html)){ try{console.warn('jcSheetOnly: 対象処理が見つかりません')}catch(x){} return html; }
      return html.replace(re,function(){return 'else{/* sheet-only: シートに無い求人は追加しない */}'});
    }catch(e){ return html; }
  }
  /* 求人一覧カードのタイトルを、R列(ti)から H列「求める資格[テキスト]」(qu) に切り替える補正(2026/11/3)。
     data.json に qu が無い求人・H列が空の求人は、従来どおり ti → sk の順で表示する。
     対象処理が見つからない場合は何もしない。検索・コピー文・詳細は変更しない。 */
  function jcTitleQual(html){
    try{
      var rt=/(c-ti\\?"\s*>'\s*\+\s*)escMark\(\s*j\.ti\s*\|\|\s*j\.sk\s*\|\|\s*""\s*\)/;
      if(!rt.test(html)){ try{console.warn('jcTitleQual: 対象処理が見つかりません')}catch(x){} return html; }
      return html.replace(rt,function(m,pre){
        return pre+'escMark(String(j.qu||"").replace(/<B>/gi," ").replace(/\\s+/g," ").trim()||j.ti||j.sk||"")';
      });
    }catch(e){ return html; }
  }
  /* 表記の非表示補正(2026/11/4):
     ①絞り込みの「★登録・開始前の求人(10/31～登録可能／要フォローコール)」行
     ②各カードの「11/1～の求人／フォローコール必要／期間」帯(.fc-bar)
     を画面から隠すだけ。データ・検索・件数集計の処理は変更しない。
     元に戻す時は JC_HIDE_FC を false にする。 */
  var JC_HIDE_FC=true;
  function jcHideFc(html){
    if(!JC_HIDE_FC) return html;
    try{
      var css='<style id="jc-hide-fc">.fc-bar{display:none!important}.row:has(.reg-chip){display:none!important}</style>';
      if(/<\/head>/i.test(html)) return html.replace(/<\/head>/i,function(){return css+'</head>'});
      return css+html;
    }catch(e){ return html; }
  }
  function jcHideFcRow(){
    if(!JC_HIDE_FC) return;
    try{ var c=document.querySelector('.reg-chip'); var r=c&&c.closest('.row'); if(r) r.style.display='none'; }catch(e){}
  }
  /* ヒアリング項目の先頭に年齢上限を付ける(2026/11/4): アプリ内 jcPatch の「j.hear=e.hear;」を差し替えるだけ。元に戻す時は JC_HEAR_AGE を false にする。 */
  var JC_HEAR_AGE=true;
  function jcHearAge(html){ if(!JC_HEAR_AGE) return html; try{ var re=/j\.hear\s*=\s*e\.hear\s*;/g; if(!re.test(html)){ try{console.warn('jcHearAge: 対象処理が見つかりません')}catch(x){} return html; } return html.replace(re,function(){return 'j.hear=(j.ag?"\u5e74\u9f62\uff1a\uff5e"+j.ag+"\u6b73":"")+(e.hear?((j.ag?"\u30fb":"")+e.hear):"");'}); }catch(e){ return html; } }
  function show(html){html=jcHideFc(jcHearAge(jcTitleQual(jcSheetOnly(html))));document.open();document.write(html);document.close();jcHideFcRow();addBoothBtn();addYoyaku();addTokai();addFocus()}
  /* 予約アポ連携(./yoyaku.js)を、ログイン後に読み込む */
  function addYoyaku(){try{var s=document.createElement('script');s.src='./yoyaku.js?v=5';document.head.appendChild(s)}catch(e){}}
  /* スタッフ東海トークスクリプト(./tokai-script.js)を、ログイン後に読み込む(2026/11/5)。サイドバー「ツール」欄とヘッダーにボタンを追加するだけ。 */
  function addTokai(){try{var s=document.createElement('script');s.src='./tokai-script.js?v=1';document.head.appendChild(s)}catch(e){}}
  /* 要注力案件のポップアップ(./focus-popup.js)を、ログイン後に読み込む(2026/11/6)。対象案件は focus-popup.js の FOCUS_JOBS を編集する。 */
  function addFocus(){try{var s=document.createElement('script');s.src='./focus-popup.js?v=1';document.head.appendChild(s)}catch(e){}}
  /* ブース割当ツール(./booth/)への入口を、ログイン後のヘッダーに追加 */
  function addBoothBtn(){var n=0,tm=setInterval(function(){var lo=document.getElementById('hdLogout');if(lo&&!document.getElementById('boothBtn')){lo.insertAdjacentHTML('beforebegin','<button class="hd-btn bl" id="boothBtn" type="button" onclick="window.open(\'./booth/\',\'_blank\',\'noopener\')" aria-label="ブース割当" title="リスナビのブース割当・プレディクティブ割当を開く">🎧 ブース割当</button>');clearInterval(tm)}else if(++n>100){clearInterval(tm)}},100)}
  function fatal(e){
    ui('form', (e&&e.message==='NOCRYPTO')
      ? 'この環境では開けません。https:// のアドレスから、最新のブラウザで開いてください。'
      : 'ページを開けませんでした。再読み込みしてください。');
  }

  var auto=stored();
  if(auto){
    ui('busy');
    decrypt(auto).then(show,function(e){
      if(e&&e.message==='NOCRYPTO') return fatal(e);
      forget(); ui('form','パスワードが変更されています。もう一度入力してください。');
    });
  } else ui('form');

  $('fm').addEventListener('submit',function(ev){
    ev.preventDefault();
    var pass=norm($('pw').value), keep=$('keep').checked;
    if(!pass) return;
    $('go').disabled=true; $('err').textContent='確認しています…';
    decrypt(pass).then(function(html){ save(pass,keep); show(html); },function(e){
      if(e&&e.message==='NOCRYPTO') return fatal(e);
      fails++; $('pw').value='';
      var wait=Math.min(4000,500*Math.pow(2,fails-1));   // 連続で間違えるほど少し待たせる
      $('err').textContent='パスワードが違います。';
      setTimeout(function(){$('go').disabled=false;try{$('pw').focus()}catch(x){}},wait);
    });
  });
})();
</script>
</body>
</html>
