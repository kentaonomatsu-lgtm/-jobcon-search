<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JCSearch｜ジョブコン求人サーチ</title>
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#111827; --sub:#4b5563; --line:#d1d5db;
  --pri:#1d4ed8; --pri-bg:#eff6ff;
  --grn:#047857; --grn-bg:#ecfdf5;
  --or:#c2410c;  --or-bg:#fff7ed;
  --ylw:#92400e; --ylw-bg:#fffbeb;
  --red:#b91c1c; --red-bg:#fef2f2;
  --gry-bg:#f3f4f6;
  --hd:#111827;
  --r:12px; --sh:0 1px 2px rgba(17,24,39,.06),0 1px 3px rgba(17,24,39,.1);
  --fs:15px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{font-family:"Yu Gothic","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.6;-webkit-text-size-adjust:100%;}
button,input,select{font-family:inherit;font-size:inherit;}
button{cursor:pointer;}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px;border-radius:4px;}

/* ===== ヘッダー ===== */
header{position:sticky;top:0;z-index:50;background:var(--hd);padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.logo{color:#fff;font-weight:800;font-size:18px;letter-spacing:.5px;white-space:nowrap;}
.logo span{color:#93c5fd;}
.vtabs{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;gap:3px;}
.vtab{min-height:40px;padding:0 18px;border:0;background:transparent;color:#d1d5db;font-weight:800;font-size:14px;border-radius:8px;}
.vtab.on{background:#fff;color:var(--ink);}
.search-wrap{flex:1;position:relative;max-width:560px;}
.search{width:100%;min-height:44px;padding:0 40px 0 14px;border:0;border-radius:10px;font-size:15px;background:#fff;}
.search-x{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:#6b7280;font-size:20px;line-height:1;min-width:36px;min-height:36px;}
.hd-cnt{color:#fff;font-size:14px;font-weight:700;white-space:nowrap;}
.hd-cnt b{color:#6ee7b7;font-size:19px;}
.hd-reset{background:#dc2626;color:#fff;border:0;min-height:44px;padding:0 16px;border-radius:10px;font-weight:800;font-size:14px;white-space:nowrap;}
.hd-reset[hidden]{display:none;}

/* ===== レイアウト ===== */
.wrap{display:flex;align-items:flex-start;gap:14px;padding:14px;max-width:1500px;margin:0 auto;}
.side{width:280px;flex:none;position:sticky;top:70px;max-height:calc(100vh - 84px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:4px;}
.main{flex:1;min-width:0;}

/* ===== ステップ付きサイドパネル ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);}
.step{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;font-weight:800;margin-right:7px;flex:none;}
.panel-t{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;}
.panel-t .lnk{margin-left:auto;font-size:12px;color:var(--pri);cursor:pointer;font-weight:700;background:none;border:0;text-decoration:underline;}

.panel.dorm{background:var(--or-bg);border:2px solid #fb923c;}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tile{background:#fff;border:2px solid var(--line);border-radius:10px;min-height:60px;padding:8px 6px;text-align:center;transition:.12s;}
.tile.on{background:var(--or);border-color:var(--or);}
.tile.on .t-l,.tile.on .t-c{color:#fff;}
.tile.on .t-l::before{content:"✓ ";}
.t-l{font-size:13px;font-weight:800;color:#9a3412;}
.t-c{font-size:18px;font-weight:800;color:var(--or);}

.age-row{display:flex;gap:7px;align-items:center;}
.age-btn{width:44px;height:44px;border:2px solid var(--line);background:var(--gry-bg);border-radius:10px;font-size:22px;font-weight:800;color:var(--sub);flex:none;}
.age-in{flex:1;min-width:0;height:44px;text-align:center;font-size:19px;font-weight:800;border:2px solid var(--line);border-radius:10px;padding:0 4px;}
.age-in.set{background:var(--ylw-bg);border-color:#f59e0b;color:var(--ylw);}
.hint{font-size:12px;color:var(--sub);margin-top:7px;line-height:1.5;}

.tabs{display:flex;gap:6px;}
.tab{flex:1;min-height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:800;color:var(--sub);text-align:center;}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.tab.on::before{content:"✓ ";}

.sal-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.sal-in{width:76px;height:44px;text-align:center;font-size:19px;font-weight:800;border:2px solid var(--line);border-radius:10px;}
.sal-in.set{background:var(--grn-bg);border-color:#10b981;color:var(--grn);}
.sal-u{font-size:13px;color:var(--sub);font-weight:800;}
input[type=range]{width:100%;-webkit-appearance:none;height:8px;background:var(--line);border-radius:4px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--grn);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);}

.checks{display:flex;flex-direction:column;gap:6px;}
.chk{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:14px;font-weight:800;color:#374151;}
.chk.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.chk.on .chk-lab::before{content:"✓ ";}
.chk-c{font-size:12px;font-weight:800;color:var(--sub);background:var(--gry-bg);padding:2px 8px;border-radius:20px;}
.chk.on .chk-c{background:rgba(255,255,255,.25);color:#fff;}

/* ===== エリア ===== */
.area{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--sh);margin-bottom:12px;}
.regions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
.reg{min-height:42px;padding:0 15px;border:2px solid var(--line);background:#fff;border-radius:21px;font-size:13.5px;font-weight:800;color:#374151;}
.reg.act{background:var(--pri);border-color:var(--pri);color:#fff;}
.reg.has{border-color:var(--pri);color:var(--pri);background:var(--pri-bg);}
.reg b{font-size:12px;opacity:.75;margin-left:4px;}
.prefs{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:2px dashed var(--line);}
.prefs:empty{display:none;}
.pref{min-height:42px;padding:0 13px;border:2px solid var(--line);background:var(--gry-bg);border-radius:9px;font-size:13.5px;font-weight:800;color:#374151;}
.pref.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.pref.on::before{content:"✓ ";}
.pref b{font-size:11px;opacity:.7;margin-left:3px;}
.area-hint{font-size:13px;color:var(--sub);}

/* ===== アクティブフィルタ ===== */
.active{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:11px;}
.active:empty{display:none;}
.af-lab{font-size:12px;font-weight:800;color:var(--sub);}
.af{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--pri);color:var(--pri);min-height:38px;padding:0 5px 0 12px;border-radius:20px;font-size:13.5px;font-weight:800;box-shadow:var(--sh);}
.af button{background:none;border:0;color:var(--pri);font-weight:800;font-size:17px;min-width:30px;min-height:30px;line-height:1;}
.af button:hover{color:var(--red);}

/* ===== ツールバー ===== */
.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 13px;box-shadow:var(--sh);margin-bottom:12px;}
.bar-cnt{font-size:14px;font-weight:700;color:var(--sub);}
.bar-cnt b{font-size:21px;color:var(--ink);font-weight:800;}
.bar-sp{flex:1;}
.btn{min-height:44px;padding:0 15px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:13.5px;font-weight:800;color:#374151;}
.btn.on{background:var(--ylw-bg);border-color:#f59e0b;color:var(--ylw);}
.btn.on::before{content:"✓ ";}
select.btn{padding:0 10px;}

/* ===== カード ===== */
.cards{display:flex;flex-direction:column;gap:10px;}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid #cbd5e1;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
.card.s{border-left-color:#059669;}
.card.a{border-left-color:#2563eb;}
.card.b{border-left-color:#ea580c;}
.card.x{opacity:.55;}

.c-top{display:flex;gap:14px;padding:13px 15px;align-items:flex-start;}
.c-l{flex:1;min-width:0;}
.c-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px;}

.c-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px;}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:6px;}
.badge.s{background:#059669;color:#fff;}
.badge.a{background:#2563eb;color:#fff;}
.badge.b{background:#ea580c;color:#fff;}
.badge.x{background:#e5e7eb;color:#4b5563;}
.badge.pri{background:var(--gry-bg);color:var(--sub);border:1px solid var(--line);}
.c-co{font-size:17px;font-weight:800;line-height:1.35;}
.c-ti{font-size:13.5px;color:#4b5563;margin-top:4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}

.sal{background:var(--grn-bg);border:2px solid #6ee7b7;border-radius:11px;padding:7px 13px;text-align:right;min-width:150px;}
.sal-tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;margin-bottom:2px;}
.sal-tag.h{background:#0e7490;color:#fff;}
.sal-tag.m{background:#047857;color:#fff;}
.sal-main{display:flex;align-items:baseline;justify-content:flex-end;gap:2px;color:var(--grn);}
.sal-n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
.sal-un{font-size:13px;font-weight:800;}
.sal-sub{font-size:12px;color:#065f46;font-weight:800;margin-top:2px;white-space:nowrap;}

.c-id{font-size:13px;font-weight:800;color:var(--sub);background:var(--gry-bg);border:2px solid var(--line);min-height:40px;padding:0 12px;border-radius:8px;white-space:nowrap;}
.c-id.ok{background:#059669;border-color:#059669;color:#fff;}

.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.pill{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:6px;white-space:nowrap;}
.pill.loc{background:var(--pri-bg);color:var(--pri);}
.pill.age{background:var(--ylw-bg);color:var(--ylw);}
.pill.age.ng{background:var(--red-bg);color:var(--red);border:2px solid #fca5a5;}
.pill.gen{background:var(--pri-bg);color:var(--pri);}
.pill.dorm{background:var(--grn-bg);color:var(--grn);}
.pill.free{background:var(--or);color:#fff;}
.pill.bx{background:var(--or-bg);color:var(--or);border:1px solid #fdba74;}
.pill.sf,.pill.emp{background:var(--gry-bg);color:#374151;}

.c-meta{font-size:12px;color:#6b7280;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.c-foot{display:flex;gap:8px;padding:0 15px 13px;}
.c-btn{min-height:42px;padding:0 15px;border:2px solid var(--line);background:#fff;border-radius:9px;font-size:13.5px;font-weight:800;color:#374151;display:inline-flex;align-items:center;text-decoration:none;}
.c-btn.go{background:var(--pri);border-color:var(--pri);color:#fff;}

.det{display:none;padding:13px 15px;background:var(--gry-bg);border-top:1px solid var(--line);font-size:13.5px;line-height:1.7;}
.det.open{display:block;}
.det dt{font-size:11.5px;font-weight:800;color:var(--sub);margin-top:8px;}
.det dt:first-child{margin-top:0;}
.det dd{color:#374151;}

.empty{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:46px 20px;text-align:center;color:var(--sub);}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px;}
.more{text-align:center;padding:14px;color:var(--sub);font-size:13px;font-weight:700;}

/* ===== マップビュー ===== */
#view-map{display:none;}
.map-wrap{display:flex;gap:14px;align-items:flex-start;padding:14px;max-width:1500px;margin:0 auto;}
.map-panel{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;}
.map-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.map-back{min-height:42px;padding:0 14px;border:2px solid var(--pri);background:var(--pri-bg);color:var(--pri);border-radius:10px;font-weight:800;font-size:13.5px;}
.map-back[hidden]{display:none;}
.map-title{font-size:16px;font-weight:800;}
.map-note{font-size:12.5px;color:var(--sub);margin-bottom:6px;}
.legend{display:flex;gap:12px;align-items:center;margin:4px 0 6px;flex-wrap:wrap;}
.lg{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--sub);}
.lg i{width:14px;height:14px;border-radius:50%;display:inline-block;}
#jpmap{width:100%;height:auto;display:block;background:#eaf1f8;border-radius:10px;}
.pf-shape{fill:#dbe4ee;stroke:#fff;transition:fill .15s;}
.pf-shape.has{fill:#c7d6e8;cursor:pointer;}
.pf-shape.has:hover{fill:#a8c3e0;}
.pf-shape.zoomed{fill:#eef4ea;stroke:#94a3b8;}
.pf-shape.dim{fill:#e8edf3;}
.pin{cursor:pointer;}
.pin circle.body{stroke:#fff;paint-order:stroke;}
.pin text{fill:#fff;font-weight:800;text-anchor:middle;pointer-events:none;}
.pin.sel circle.body{stroke:#111827;}
.pin-stem{stroke:#64748b;}
.city-lab{font-weight:800;fill:#1f2937;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;}

.map-side{width:360px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;position:sticky;top:70px;max-height:calc(100vh - 84px);overflow-y:auto;}
.ms-title{font-size:16px;font-weight:800;margin-bottom:3px;}
.ms-sub{font-size:13px;color:var(--sub);margin-bottom:10px;}
.ms-cities{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.ms-city{min-height:38px;padding:0 11px;border:2px solid var(--line);background:var(--gry-bg);border-radius:8px;font-size:12.5px;font-weight:800;color:#374151;}
.ms-city.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.ms-city b{font-size:11px;opacity:.7;margin-left:3px;}
.ms-list{display:flex;flex-direction:column;gap:8px;}
.ms-card{border:1px solid var(--line);border-left:5px solid #cbd5e1;border-radius:9px;padding:9px 11px;}
.ms-card.s{border-left-color:#059669;}.ms-card.a{border-left-color:#2563eb;}.ms-card.b{border-left-color:#ea580c;}.ms-card.x{opacity:.55;}
.ms-co{font-size:13.5px;font-weight:800;line-height:1.3;}
.ms-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;}
.ms-sal{font-size:14px;font-weight:800;color:var(--grn);}
.ms-sal small{font-size:10.5px;color:#065f46;font-weight:700;}
.ms-id{font-size:11.5px;font-weight:800;color:var(--sub);background:var(--gry-bg);border:1px solid var(--line);min-height:32px;padding:0 9px;border-radius:6px;}
.ms-id.ok{background:#059669;border-color:#059669;color:#fff;}
.ms-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.ms-pills .pill{font-size:10.5px;padding:2px 7px;}
.ms-empty{color:var(--sub);font-size:13.5px;padding:20px 6px;text-align:center;}
.ms-more{text-align:center;font-size:12px;color:var(--sub);font-weight:700;padding:8px 0 2px;}
.ms-golist{width:100%;margin-top:10px;min-height:44px;background:var(--pri);color:#fff;border:0;border-radius:10px;font-weight:800;font-size:14px;}
.ms-card.hl{outline:3px solid #f59e0b;outline-offset:1px;}
.ms-num{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:50%;background:#111827;color:#fff;font-size:11px;font-weight:800;margin-right:6px;}
.map-canvas{position:relative;}
.map-zoombtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:5;}
.zbtn{width:44px;height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:20px;font-weight:800;color:#374151;box-shadow:var(--sh);}
#jpmap{cursor:grab;touch-action:none;}
#jpmap.panning{cursor:grabbing;}
.job-mark{cursor:pointer;}
.job-mark circle{stroke:#fff;}
.job-mark.hl circle{stroke:#f59e0b;}
.job-mark text{fill:#fff;font-weight:800;text-anchor:middle;pointer-events:none;}
.job-leg{stroke:#94a3b8;}
.city-center{fill:#111827;stroke:#fff;}
.neighbor-pin{fill:#94a3b8;opacity:.55;}
.cluster circle.halo{fill:rgba(37,99,235,.14);}
.pin text.sub{font-size:60%;opacity:.85;}
.map-hintbar{font-size:11.5px;color:var(--sub);margin-top:6px;}
ruby{ruby-position:over;}
ruby rt{font-size:58%;opacity:.85;font-weight:700;letter-spacing:0;}
.city-kana{font-weight:800;fill:#6b7280;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;}
.pref-lab{font-weight:800;fill:#1f2937;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;}
.pref-kana{font-weight:800;fill:#6b7280;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;}

/* ===== モバイル ===== */
.side-toggle{display:none;}
@media(max-width:900px){
  header{flex-wrap:wrap;padding:9px 12px;gap:8px;}
  .logo{font-size:16px;}
  .search-wrap{order:4;flex-basis:100%;max-width:none;}
  .wrap{flex-direction:column;align-items:stretch;padding:10px;gap:10px;}
  .main{width:100%;}
  .side{width:100%;position:static;max-height:none;}
  .side.hide{display:none;}
  .side-toggle{display:block;width:100%;min-height:48px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);font-weight:800;font-size:14.5px;box-shadow:var(--sh);}
  .c-top{flex-direction:column;gap:10px;}
  .c-r{flex-direction:row;align-items:center;width:100%;justify-content:space-between;}
  .sal{min-width:0;flex:1;text-align:left;}
  .sal-main{justify-content:flex-start;}
  .map-wrap{flex-direction:column;align-items:stretch;padding:10px;gap:10px;}
  .map-side{width:100%;position:static;max-height:none;}
}
</style>
</head>
<body>

<header>
  <div class="logo">JC<span>Search</span></div>
  <nav class="vtabs" aria-label="表示切替">
    <button class="vtab on" id="vt-list" onclick="setView('list')">一覧</button>
    <button class="vtab" id="vt-map" onclick="setView('map')">マップ</button>
  </nav>
  <div class="search-wrap">
    <input class="search" id="kw" type="search" placeholder="社名・地域・職種・案件IDで検索" aria-label="キーワード検索" oninput="setKw(this.value)">
    <button class="search-x" id="kwx" aria-label="検索をクリア" onclick="setKw('');document.getElementById('kw').value='';" hidden>&times;</button>
  </div>
  <div class="hd-cnt" aria-live="polite"><b id="hc">0</b> / <span id="ht">0</span>件</div>
  <button class="hd-reset" id="hr" onclick="resetAll()" hidden>すべてクリア</button>
</header>

<!-- ============ 一覧ビュー ============ -->
<div id="view-list">
<div class="wrap">

  <button class="side-toggle" onclick="toggleSide()" aria-controls="side">絞り込み条件を開く／閉じる</button>

  <aside class="side" id="side" aria-label="絞り込み条件">

    <div class="panel dorm">
      <div class="panel-t"><span class="step">1</span>寮・社宅で絞る</div>
      <div class="tiles">
        <button class="tile" id="t-dorm" onclick="toggleQuick('dorm')" aria-pressed="false">
          <div class="t-l">寮完備</div><div class="t-c" id="c-dorm">-</div>
        </button>
        <button class="tile" id="t-free" onclick="toggleQuick('free')" aria-pressed="false">
          <div class="t-l">寮費無料</div><div class="t-c" id="c-free">-</div>
        </button>
      </div>
    </div>

    <div class="panel">

const HOURS = 173;
const LIMIT = 150;
const MAP_LIST_LIMIT = 30;

const state = {
  view:"list",
  kw:"", age:null, gender:"", salMin:0,
  prefs:new Set(), pris:new Set(), quicks:new Set(), emps:new Set(),
  sort:"pri", top3:false, region:"",
  mapPref:"", mapCity:"", vb:null
};
let filtered = [];

const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toHourly(sl){ return Math.round(sl*10000/HOURS); }

/* ====== マッチ度 ====== */
function calcMatch(j){
  let score=0, max=0, fatal=false;
  if(state.age!==null){ max+=40; if(j.ag>=state.age) score+=40; else fatal=true; }
  if(state.salMin>0){ max+=30; if(j.sl>=state.salMin) score+=30; else fatal=true; }
  if(state.gender){ max+=20; if(j.gn==="不問"||j.gn===state.gender) score+=20; else fatal=true; }
  if(j.bx>0) score+=5;
  if(j.dorm==="1") score+=5;
  if(j.free===1) score+=5;
  if(max===0) return null;
  const pct=Math.min(100,Math.round(score/max*100));
  if(fatal) return {grade:"x",pct,fatal:true};
  if(pct>=95) return {grade:"s",pct:100};
  if(pct>=70) return {grade:"a",pct};
  if(pct>=40) return {grade:"b",pct};
  return {grade:"x",pct,fatal:true};
}
function gradeLabel(m){
  if(!m) return "";
  if(m.grade==="x") return "条件外";
  if(m.grade==="s") return "ぴったり";
  if(m.grade==="a") return "おすすめ";
  return "候補";
}

/* ====== 絞り込み（prefsを除いた共通条件） ====== */
function baseFilter(){
  let r = ALL_JOBS;
  if(state.kw){
    const k=state.kw.toLowerCase();
    r=r.filter(j=>(j.co||"").toLowerCase().includes(k)||(j.pf||"").includes(k)||(j.ct||"").includes(k)
      ||(j.sk||"").includes(k)||(j.gy||"").includes(k)||(j.ti||"").includes(k)||(j.id||"").includes(k));
  }
  if(state.pris.size)  r=r.filter(j=>state.pris.has(j.pr));
  if(state.emps.size)  r=r.filter(j=>state.emps.has(j.emp));
  if(state.age!==null) r=r.filter(j=>j.ag>=state.age);
  if(state.gender)     r=r.filter(j=>j.gn==="不問"||j.gn===state.gender);
  if(state.salMin>0)   r=r.filter(j=>j.sl>=state.salMin);
  state.quicks.forEach(q=>{
    if(q==="dorm")        r=r.filter(j=>j.dorm==="1");
    else if(q==="free")   r=r.filter(j=>j.free===1);
    else if(q==="bonus")  r=r.filter(j=>j.bx>0);
    else if(q==="day")    r=r.filter(j=>(j.sf||"").indexOf("日勤専属")>=0);
    else if(q==="night")  r=r.filter(j=>(j.sf||"").indexOf("夜勤専属")>=0);
    else if(q==="2shift") r=r.filter(j=>(j.sf||"").indexOf("2交代")>=0);
  });
  return r;
}
function filterJobs(){
  let r = baseFilter();
  if(state.prefs.size) r=r.filter(j=>state.prefs.has(j.pf));
  return r;
}

function apply(){
  filtered = filterJobs();
  const mode = state.sort;
  const scored = state.age!==null || state.salMin>0 || state.gender;
  if(mode==="match" || (mode==="pri" && scored)){
    filtered = filtered.map(j=>({j,m:calcMatch(j)}))
      .sort((a,b)=>{
        if(!a.m&&!b.m) return (+a.j.pr||9)-(+b.j.pr||9);
        if(!a.m) return 1;
        if(!b.m) return -1;
        if(a.m.fatal!==b.m.fatal) return a.m.fatal?1:-1;
        if(b.m.pct!==a.m.pct) return b.m.pct-a.m.pct;
        return (+a.j.pr||9)-(+b.j.pr||9);
      }).map(o=>o.j);
  } else if(mode==="pri"){
    filtered.sort((a,b)=>(+a.pr||9)-(+b.pr||9));
  } else if(mode==="sal_h") filtered.sort((a,b)=>(b.sl||0)-(a.sl||0));
  else if(mode==="sal_l") filtered.sort((a,b)=>(a.sl||0)-(b.sl||0));
  else if(mode==="bonus") filtered.sort((a,b)=>(b.bx||0)-(a.bx||0));

  render();
  updateCounts();
  updateActive();
  updateReset();
  if(state.view==="map"){ renderMap(); renderMapSide(); }
}

/* ====== 一覧描画 ====== */
function salBlock(j,mini){
  if(j.wt==="h" && j.hr>0){
    if(mini) return '<span class="ms-sal">時給'+j.hr.toLocaleString()+'円 <small>（月収 約'+j.sl.toFixed(1).replace(/\.0$/,"")+'万）</small></span>';
    return '<div class="sal"><span class="sal-tag h">時給</span>'
      +'<div class="sal-main"><span class="sal-n">'+j.hr.toLocaleString()+'</span><span class="sal-un">円</span></div>'
      +'<div class="sal-sub">月収にすると 約'+j.sl.toFixed(1).replace(/\.0$/,"")+'万円</div></div>';
  }
  if(j.sl>0){
    if(mini) return '<span class="ms-sal">月給'+j.sl.toFixed(1).replace(/\.0$/,"")+'万円 <small>（時給 約'+toHourly(j.sl).toLocaleString()+'円）</small></span>';
    return '<div class="sal"><span class="sal-tag m">月給</span>'
      +'<div class="sal-main"><span class="sal-n">'+j.sl.toFixed(1).replace(/\.0$/,"")+'</span><span class="sal-un">万円</span></div>'
      +'<div class="sal-sub">時給にすると 約'+toHourly(j.sl).toLocaleString()+'円</div></div>';
  }
  return "";
}
function pillsHtml(j){
  const ageNG = state.age!==null && j.ag < state.age;
  let p="";
  if(j.pf) p+='<span class="pill loc">'+rubyP(j.pf)+(j.ct?" "+rubyC(j.pf,j.ct):"")+'</span>';
  if(j.ag) p+='<span class="pill age'+(ageNG?" ng":"")+'">〜'+j.ag+'歳'+(ageNG?"（対象外）":"")+'</span>';
  if(j.gn) p+='<span class="pill gen">'+esc(j.gn)+'</span>';
  if(j.free===1) p+='<span class="pill free">寮費無料</span>';
  else if(j.dorm==="1") p+='<span class="pill dorm">寮完備</span>';
  if(j.bx>0) p+='<span class="pill bx">祝い金'+j.bx+'万</span>';
  if(j.sf) p+='<span class="pill sf">'+esc(j.sf)+'</span>';
  if(j.emp) p+='<span class="pill emp">'+esc(j.emp)+'</span>';
  return p;
}

function render(){
  const list = state.top3 ? filtered.slice(0,3) : filtered.slice(0,LIMIT);
  if(!list.length){
    $("#cards").innerHTML = '<div class="empty"><b>該当する求人がありません</b>条件をゆるめてください</div>';
    $("#more").textContent="";
    return;
  }
  $("#cards").innerHTML = list.map(j=>{
    const m = calcMatch(j);
    const g = m ? m.grade : "";
    const badge = m ? '<span class="badge '+g+'">'+gradeLabel(m)+(g!=="x"?" "+m.pct+"%":"")+'</span>' : "";
    const meta=[j.gy,j.sk].filter(Boolean).map(esc).join("　/　");
    return '<div class="card '+g+'">'
      +'<div class="c-top">'
        +'<div class="c-l">'
          +'<div class="c-h">'+badge+'<span class="badge pri">優先'+esc(j.pr||"-")+'位</span></div>'
          +'<div class="c-co">'+esc(j.co)+'</div>'
          +(j.ti?'<div class="c-ti">'+esc(j.ti)+'</div>':"")
          +'<div class="pills">'+pillsHtml(j)+'</div>'
          +(meta?'<div class="c-meta">'+meta+'</div>':"")
        +'</div>'
        +'<div class="c-r">'+salBlock(j)
          +'<button class="c-id" onclick="copyId(this,\''+esc(j.id)+'\')" aria-label="案件ID '+esc(j.id)+' をコピー">#'+esc(j.id)+' コピー</button>'
        +'</div>'
      +'</div>'
      +'<div class="c-foot">'
        +'<button class="c-btn" onclick="toggleDet(this)" aria-expanded="false">詳細を見る</button>'
        +(j.ur?'<a class="c-btn go" href="'+esc(j.ur)+'" target="_blank" rel="noopener">求人ページを開く</a>':"")
      +'</div>'
      +'<dl class="det">'
        +(j.st?'<dt>最寄り駅・交通</dt><dd>'+esc(j.st)+'</dd>':"")
        +(j.ca?'<dt>仕事内容</dt><dd>'+esc(j.ca)+'</dd>':"")
        +'<dt>案件ID / 仕事No.</dt><dd>'+esc(j.id)+'　/　'+esc(j.jn||"-")+'</dd>'
      +'</dl>'
    +'</div>';
  }).join("");
  $("#more").textContent = (!state.top3 && filtered.length>LIMIT)
    ? "上位 "+list.length+" 件を表示中（全 "+filtered.length.toLocaleString()+" 件）— 条件を絞ると全件見られます" : "";
}

function updateCounts(){
  const n=filtered.length, t=ALL_JOBS.length;
  $("#hc").textContent=n.toLocaleString();
  $("#ht").textContent=t.toLocaleString();
  $("#bc").textContent=n.toLocaleString();
  $("#bt").textContent=t.toLocaleString();
  const cnt = f => ALL_JOBS.filter(f).length;
  $("#c-dorm").textContent  = cnt(j=>j.dorm==="1").toLocaleString();

/* ====== アクティブフィルタ ====== */
function updateActive(){
  const a=[];
  if(state.kw) a.push(["検索: "+state.kw,()=>{setKw("");$("#kw").value="";}]);
  if(state.age!==null) a.push([state.age+"歳",()=>setAge(null)]);

  state.emps.forEach(e=>a.push([e,()=>toggleEmp(e)]));

  const QL={dorm:"寮完備",free:"寮費無料",bonus:"祝い金あり",day:"日勤だけ",night:"夜勤だけ","2shift":"2交代"};

}

function updateReset(){

function copyId(btn,id){
  const done=()=>{ btn.classList.add("ok"); const o=btn.innerHTML; btn.textContent="コピーしました"; setTimeout(()=>{btn.classList.remove("ok");btn.innerHTML=o;},1100); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(id).then(done).catch(()=>fallbackCopy(id,done));
  } else fallbackCopy(id,done);
}
function fallbackCopy(id,done){
  const t=document.createElement("textarea"); t.value=id; document.body.appendChild(t); t.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  document.body.removeChild(t);
}

/* ====== マップ（都道府県→市区町村→求人 ＋ フリガナ ＋ 自由ズーム） ====== */
const KANA_PREF={"北海道":"ほっかいどう","青森県":"あおもりけん","岩手県":"いわてけん","宮城県":"みやぎけん","秋田県":"あきたけん","山形県":"やまがたけん","福島県":"ふくしまけん","茨城県":"いばらきけん","栃木県":"とちぎけん","群馬県":"ぐんまけん","埼玉県":"さいたまけん","千葉県":"ちばけん","東京都":"とうきょうと","神奈川県":"かながわけん","新潟県":"にいがたけん","富山県":"とやまけん","石川県":"いしかわけん","福井県":"ふくいけん","山梨県":"やまなしけん","長野県":"ながのけん","岐阜県":"ぎふけん","静岡県":"しずおかけん","愛知県":"あいちけん","三重県":"みえけん","滋賀県":"しがけん","京都府":"きょうとふ","大阪府":"おおさかふ","兵庫県":"ひょうごけん","奈良県":"ならけん","和歌山県":"わかやまけん","鳥取県":"とっとりけん","島根県":"しまねけん","岡山県":"おかやまけん","広島県":"ひろしまけん","山口県":"やまぐちけん","徳島県":"とくしまけん","香川県":"かがわけん","愛媛県":"えひめけん","高知県":"こうちけん","福岡県":"ふくおかけん","佐賀県":"さがけん","長崎県":"ながさきけん","熊本県":"くまもとけん","大分県":"おおいたけん","宮崎県":"みやざきけん","鹿児島県":"かごしまけん","沖縄県":"おきなわけん"};
function kanaPref(pf){ return KANA_PREF[pf]||""; }
function kanaCity(pf,ct){ return (GEO.kana||{})[pf+"|"+ct]||""; }
function rubyP(pf){ const k=kanaPref(pf); return k?'<ruby>'+esc(pf)+'<rt>'+esc(k)+'</rt></ruby>':esc(pf); }
function rubyC(pf,ct){ const k=kanaCity(pf,ct); return k?'<ruby>'+esc(ct)+'<rt>'+esc(k)+'</rt></ruby>':esc(ct); }

function pinColor(n){
  if(n>=300) return "#b91c1c";
  if(n>=100) return "#c2410c";
  if(n>=30)  return "#d97706";
  if(n>=10)  return "#2563eb";
  return "#64748b";
}
function pinPxR(n){ return n>=300?28 : n>=100?24 : n>=30?20 : n>=10?17 : 15; }
function salColor(sl){
  if(sl>=35) return "#047857";
  if(sl>=30) return "#059669";
  if(sl>=25) return "#2563eb";

  else items=[["300件〜","#b91c1c"],["100〜299","#c2410c"],["30〜99","#d97706"],["10〜29","#2563eb"],["1〜9","#64748b"]];
  $("#legend").innerHTML = items.map(([l,c])=>'<span class="lg"><i style="background:'+c+'"></i>'+l+'</span>').join("");

/* サイドとマーカーで共有する市区町村内の求人ソート */
function sortedCityJobs(pf,ct){
  let list = baseFilter().filter(j=>j.pf===pf && (j.ct||"（市区町村なし）")===ct);
  return list.map(j=>({j,m:calcMatch(j)})).sort((a,b)=>{
    if(!a.m&&!b.m) return (+a.j.pr||9)-(+b.j.pr||9);
    if(!a.m) return 1;
    if(!b.m) return -1;
    if(a.m.fatal!==b.m.fatal) return a.m.fatal?1:-1;
    if(b.m.pct!==a.m.pct) return b.m.pct-a.m.pct;
    return (+a.j.pr||9)-(+b.j.pr||9);
  }).map(o=>o.j);
}

/* viewBox: 階層ごとの基準表示＋クランプ付き自由ズーム */
function baseVBFor(){
  if(state.mapCity){
    const pos=GEO.city[state.mapPref+"|"+state.mapCity]||GEO.cent[state.mapPref];
    const jobs=Math.min(sortedCityJobs(state.mapPref,state.mapCity).length,MAP_LIST_LIMIT);
    const rings=Math.ceil(jobs/14)+1;
    const w=Math.max(48,(6.4+rings*5.2)*2+14);
    return {x:pos[0]-w/2, y:pos[1]-w*(GEO.H/GEO.W)/2, w:w, h:w*(GEO.H/GEO.W)};
  }
  if(state.mapPref){
    const bb=GEO.bbox[state.mapPref];
    const w=Math.max(130, Math.max(bb[2]-bb[0],bb[3]-bb[1])*1.6);
    const cx=(bb[0]+bb[2])/2, cy=(bb[1]+bb[3])/2;
    return {x:cx-w/2, y:cy-w*(GEO.H/GEO.W)/2, w:w, h:w*(GEO.H/GEO.W)};
  }
  return {x:0,y:0,w:GEO.W,h:GEO.H};
}
function vbClamp(){
  const b=baseVBFor();
  return {min:b.w*0.3, max:b.w*2.2};     // 各階層で0.3〜2.2倍まで＝縮尺の暴れを防ぐ
}
function getVB(){ if(!state.vb) state.vb={...baseVBFor()}; return state.vb; }
function applyVB(){
  const v=getVB();
  $("#jpmap").setAttribute("viewBox",[v.x,v.y,v.w,v.h].map(n=>n.toFixed(2)).join(" "));
}
function svgRectW(){
  const r=$("#jpmap").getBoundingClientRect();
  return r.width>50 ? r.width : 900;
}
function pxToUnit(px){ return px*getVB().w/svgRectW(); }
function swAttr(px){ return ' stroke-width="'+pxToUnit(px).toFixed(3)+'"'; }

function cityPointsFor(pf){
  const base=baseFilter();
  const m={};
  base.forEach(j=>{
    if(j.pf!==pf) return;
    const key=j.pf+"|"+(j.ct||"");
    if(!GEO.city[key]) return;
    if(!m[key]) m[key]={key,pf:j.pf,ct:j.ct,pos:GEO.city[key],n:0};
    m[key].n++;
  });
  return Object.values(m);
}
function prefCounts(){
  const byPf={};
  baseFilter().forEach(j=>{ if(j.pf) byPf[j.pf]=(byPf[j.pf]||0)+1; });
  return byPf;
}

function renderMap(){
  const svg=$("#jpmap");
  applyVB();
  const v=getVB();
  let out="";

  if(state.mapCity){
    /* ===== 市: 求人を個別マーカー展開 ===== */
    const pf=state.mapPref, ct=state.mapCity;
    const pos=GEO.city[pf+"|"+ct];
    const jobs=sortedCityJobs(pf,ct).slice(0,MAP_LIST_LIMIT);
    Object.entries(GEO.paths).forEach(([p2,d])=>{
      out+='<path class="pf-shape '+(p2===pf?"zoomed":"dim")+'" d="'+d+'"'+swAttr(1.2)+' aria-hidden="true"></path>';
    });
    cityPointsFor(pf).forEach(p=>{
      if(p.ct===ct) return;
      out+='<circle class="neighbor-pin" cx="'+p.pos[0]+'" cy="'+p.pos[1]+'" r="'+pxToUnit(5).toFixed(2)+'"></circle>';
    });
    const mr=2.0, base=6.4, step=5.2;
    const slots=[];
    let ring=0, left=jobs.length;
    while(left>0 && ring<8){
      const r=base+ring*step;
      const cap=Math.max(6,Math.floor(2*Math.PI*r/(mr*2.6)));
      const cnt=Math.min(cap,left);
      for(let i=0;i<cnt;i++){
        const th=(2*Math.PI*i)/cnt - Math.PI/2 + ring*0.4;
        slots.push([pos[0]+r*Math.cos(th), pos[1]+r*Math.sin(th)]);
      }
      left-=cnt; ring++;
    }
    const mrad=Math.min(pxToUnit(28), 2.0);
    const labF=pxToUnit(15), kanaF=pxToUnit(9.5);
    out+='<circle'+swAttr(1.5)+' class="city-center" cx="'+pos[0]+'" cy="'+pos[1]+'" r="'+pxToUnit(7).toFixed(2)+'"></circle>';
    const kc=kanaCity(pf,ct);
    if(kc) out+='<text'+swAttr(3)+' class="city-kana" x="'+pos[0]+'" y="'+(pos[1]-pxToUnit(22)-labF*1.05).toFixed(1)+'" font-size="'+kanaF.toFixed(2)+'">'+esc(kc)+'</text>';
    out+='<text'+swAttr(3)+' class="city-lab" x="'+pos[0]+'" y="'+(pos[1]-pxToUnit(22)).toFixed(1)+'" font-size="'+labF.toFixed(2)+'">'+esc(ct)+'</text>';
    jobs.forEach((j,i)=>{
      const [mx,my]=slots[i];
      out+='<line'+swAttr(0.8)+' class="job-leg" x1="'+pos[0]+'" y1="'+pos[1]+'" x2="'+mx.toFixed(1)+'" y2="'+my.toFixed(1)+'"></line>';
    });
    jobs.forEach((j,i)=>{
      const [mx,my]=slots[i];
      out+='<g class="job-mark" data-i="'+i+'" role="button" tabindex="0" aria-label="'+(i+1)+'番 '+esc(j.co)+'">'
        +'<circle cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="'+mrad.toFixed(2)+'" fill="'+salColor(j.sl)+'"'+swAttr(1.6)+'></circle>'
        +'<text x="'+mx.toFixed(1)+'" y="'+(my+mrad*0.35).toFixed(1)+'" font-size="'+(mrad*0.95).toFixed(2)+'">'+(i+1)+'</text></g>';
    });
    svg.innerHTML=out;
    const total=sortedCityJobs(pf,ct).length;
    $("#maptitle").innerHTML=rubyP(pf)+"　"+rubyC(pf,ct)+"　"+total.toLocaleString()+"件";
    $("#mapnote").textContent="番号を押すと一覧のその求人に飛びます。色は月収の目安（配置は市の中心からの展開図）。";
    $("#mapback").textContent="← "+pf+"に戻る";
    $("#mapback").hidden=false;
    svg.querySelectorAll('.job-mark').forEach(el=>{
      const i=+el.dataset.i;
      el.addEventListener('click',()=>{ if(!panMoved) jumpToJob(jobs[i].id, i); });
      el.addEventListener('keydown',e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();jumpToJob(jobs[i].id, i);} });
    });

  } else if(state.mapPref){
    /* ===== 都道府県: 市区町村ピン（フリガナ付き） ===== */
    const pf=state.mapPref;
    Object.entries(GEO.paths).forEach(([p2,d])=>{
      out+='<path class="pf-shape '+(p2===pf?"zoomed":"dim")+'" d="'+d+'"'+swAttr(1.2)+' aria-hidden="true"></path>';
    });
    const cities=cityPointsFor(pf).sort((a,b)=>b.n-a.n);
    const pinRz=(n)=>pxToUnit(pinPxR(n));
    const nodes=cities.map(c=>({...c, x:c.pos[0], y:c.pos[1], r:pinRz(c.n)}));
    for(let it=0; it<60; it++){
      let moved=false;
      for(let i=0;i<nodes.length;i++)for(let k2=i+1;k2<nodes.length;k2++){
        const a=nodes[i],bn=nodes[k2];
        let dx=bn.x-a.x, dy=bn.y-a.y;
        let d=Math.hypot(dx,dy);
        const min=a.r+bn.r+v.w*0.006;
        if(d<min){
          if(d<0.01){ dx=1;dy=0;d=1; }
          const push=(min-d)/2, ux=dx/d, uy=dy/d;
          a.x-=ux*push; a.y-=uy*push;
          bn.x+=ux*push; bn.y+=uy*push;
          moved=true;
        }
      }
      if(!moved) break;
    }
    nodes.forEach(c=>{
      if(Math.hypot(c.x-c.pos[0],c.y-c.pos[1])>c.r*0.6){
        out+='<line'+swAttr(1)+' stroke-dasharray="'+pxToUnit(2).toFixed(2)+' '+pxToUnit(2).toFixed(2)+'" class="pin-stem" x1="'+c.pos[0]+'" y1="'+c.pos[1]+'" x2="'+c.x.toFixed(1)+'" y2="'+c.y.toFixed(1)+'"></line>';
      }
      const fsz=pxToUnit(c.n>=100?13:12);
      out+='<g class="pin" data-ct="'+esc(c.ct)+'" role="button" tabindex="0" aria-label="'+esc(c.ct)+'（'+esc(kanaCity(pf,c.ct))+'）'+c.n+'件">'
        +'<circle class="body" cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="'+c.r.toFixed(2)+'" fill="'+pinColor(c.n)+'"'+swAttr(2)+'></circle>'
        +'<text x="'+c.x.toFixed(1)+'" y="'+(c.y+fsz*0.36).toFixed(1)+'" font-size="'+fsz.toFixed(2)+'">'+c.n+'</text></g>';
    });
    // ラベル（名前＋フリガナ・重なりスキップ）
    const labF=pxToUnit(12.5), kanaF=pxToUnit(8);
    const placed=[];
    nodes.slice(0,16).forEach(c=>{
      const name=c.ct, kn=kanaCity(pf,name);
      const w=Math.max(name.length*labF, (kn||"").length*kanaF)*1.05;
      const hgt=labF*1.3+(kn?kanaF*1.2:0);
      const lx=c.x, lyName=c.y+c.r+labF*1.1;
      const box=[lx-w/2, lyName-labF, lx+w/2, lyName+(kn?kanaF*1.3:0)+labF*0.25];
      const hit=placed.some(b2=>!(box[2]<b2[0]||box[0]>b2[2]||box[3]<b2[1]||box[1]>b2[3]));
      if(hit) return;
      placed.push(box);
      out+='<text'+swAttr(3)+' class="city-lab" x="'+lx.toFixed(1)+'" y="'+lyName.toFixed(1)+'" font-size="'+labF.toFixed(2)+'">'+esc(name)+'</text>';
      if(kn) out+='<text'+swAttr(3)+' class="city-kana" x="'+lx.toFixed(1)+'" y="'+(lyName+kanaF*1.25).toFixed(1)+'" font-size="'+kanaF.toFixed(2)+'">'+esc(kn)+'</text>';
    });
    svg.innerHTML=out;
    const total=prefCounts()[pf]||0;
    $("#maptitle").innerHTML=rubyP(pf)+"　"+total.toLocaleString()+"件";
    $("#mapnote").textContent="市区町村のピンを押すと、その市に拡大して求人が1件ずつ出ます。スクロール・ピンチで微調整できます。";
    $("#mapback").textContent="← 全国に戻る";
    $("#mapback").hidden=false;
    svg.querySelectorAll('.pin[data-ct]').forEach(el=>{
      const ct=el.dataset.ct;
      el.addEventListener('click',()=>{ if(!panMoved) selectMapCity(pf,ct); });
      el.addEventListener('keydown',e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();selectMapCity(pf,ct);} });
    });

  } else {
    /* ===== 全国: 都道府県ピン（フリガナ付き） ===== */
    const byPf=prefCounts();
    Object.entries(GEO.paths).forEach(([pf,d])=>{
      const n=byPf[pf]||0;
      out+='<path class="pf-shape'+(n?" has":"")+'" d="'+d+'"'+swAttr(1.2)+(n?' data-pf="'+pf+'" role="button" tabindex="0" aria-label="'+pf+'（'+kanaPref(pf)+'）'+n+'件"':' aria-hidden="true"')+'></path>';
    });
    const pinRz=(n)=>pxToUnit(pinPxR(n));
    const nodes=Object.entries(byPf).map(([pf,n])=>({pf,n,pos:GEO.cent[pf]})).filter(p=>p.pos)
      .sort((a,b)=>b.n-a.n)
      .map(p=>({...p, x:p.pos[0], y:p.pos[1], r:pinRz(p.n)}));
    for(let it=0; it<60; it++){
      let moved=false;
      for(let i=0;i<nodes.length;i++)for(let k2=i+1;k2<nodes.length;k2++){
        const a=nodes[i],bn=nodes[k2];
        let dx=bn.x-a.x, dy=bn.y-a.y;
        let d=Math.hypot(dx,dy);
        const min=a.r+bn.r+v.w*0.004;
        if(d<min){
          if(d<0.01){ dx=1;dy=0;d=1; }
          const push=(min-d)/2, ux=dx/d, uy=dy/d;
          a.x-=ux*push; a.y-=uy*push;
          bn.x+=ux*push; bn.y+=uy*push;
          moved=true;
        }
      }
      if(!moved) break;
    }
    nodes.forEach(p=>{
      const fsz=pxToUnit(p.n>=100?13:12);
      out+='<g class="pin" data-pf="'+p.pf+'" role="button" tabindex="0" aria-label="'+p.pf+'（'+kanaPref(p.pf)+'）'+p.n+'件">'
        +'<circle class="body" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+p.r.toFixed(2)+'" fill="'+pinColor(p.n)+'"'+swAttr(2)+'></circle>'
        +'<text x="'+p.x.toFixed(1)+'" y="'+(p.y+fsz*0.36).toFixed(1)+'" font-size="'+fsz.toFixed(2)+'">'+p.n+'</text></g>';
    });
    // 都道府県名＋フリガナ（重なりスキップ・上位から）
    const labF=pxToUnit(12), kanaF=pxToUnit(7.5);
    const placed=[];
    nodes.forEach(p=>{
      const name=p.pf, kn=kanaPref(name);
      const w=Math.max(name.length*labF,(kn||"").length*kanaF)*1.05;
      const lyName=p.y+p.r+labF*1.1;
      const box=[p.x-w/2, lyName-labF, p.x+w/2, lyName+kanaF*1.3+labF*0.2];
      const hit=placed.some(b2=>!(box[2]<b2[0]||box[0]>b2[2]||box[3]<b2[1]||box[1]>b2[3]));
      if(hit) return;
      placed.push(box);
      out+='<text'+swAttr(3.5)+' class="pref-lab" x="'+p.x.toFixed(1)+'" y="'+lyName.toFixed(1)+'" font-size="'+labF.toFixed(2)+'">'+esc(name)+'</text>';
      if(kn) out+='<text'+swAttr(3)+' class="pref-kana" x="'+p.x.toFixed(1)+'" y="'+(lyName+kanaF*1.3).toFixed(1)+'" font-size="'+kanaF.toFixed(2)+'">'+esc(kn)+'</text>';
    });
    svg.innerHTML=out;
    $("#maptitle").textContent="エリア別の求人マップ（全国）";
    $("#mapnote").textContent="都道府県のピンか地図を押すと、その県の市区町村が出ます。";
    $("#mapback").hidden=true;
    svg.querySelectorAll('[data-pf]').forEach(el=>{
      const pf=el.dataset.pf;
      el.addEventListener('click',()=>{ if(!panMoved) mapZoomIn(pf); });
      el.addEventListener('keydown',e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();mapZoomIn(pf);} });
    });
  }
  renderLegend();
}

function mapZoomIn(pf){
  state.mapPref=pf; state.mapCity="";
  state.vb=null;
  renderMap(); renderMapSide();
}
function selectMapCity(pf,ct){
  state.mapPref=pf; state.mapCity=ct;
  state.vb=null;
  renderMap(); renderMapSide();
}
function mapBack(){
  if(state.mapCity) state.mapCity="";
  else state.mapPref="";
  state.vb=null;
  renderMap(); renderMapSide();
}
function exitCity(){ state.mapCity=""; state.vb=null; renderMap(); renderMapSide(); }
function mapZoomBtn(f){
  const v=getVB(), c=vbClamp();
  const nw=Math.max(c.min,Math.min(c.max,v.w*f));
  const cx=v.x+v.w/2, cy=v.y+v.h/2;
  v.w=nw; v.h=nw*(GEO.H/GEO.W);
  v.x=cx-v.w/2; v.y=cy-v.h/2;
  renderMap();
}
/* マーカータップ→一覧の該当求人へジャンプ（マップの状態は保持） */
function jumpToJob(id, i){
  highlightJob(i);                       // マップ側の見た目も同期
  state._jumpId=String(id);              // マップ復帰時に自動解除するため記録
  state.kw=String(id);
  $("#kw").value=state.kw;
  setView("list");
  apply();
  window.scrollTo({top:0});
}
function highlightJob(i){
  document.querySelectorAll('.job-mark').forEach(el=>el.classList.toggle('hl', +el.dataset.i===i));
  document.querySelectorAll('.ms-card').forEach(el=>el.classList.remove('hl'));
  const card=document.querySelector('.ms-card[data-idx="'+i+'"]');
  if(card){ card.classList.add('hl'); card.scrollIntoView({block:"nearest",behavior:"smooth"}); }
}

/* ホイール（カーソル基準・クランプ付き）・ドラッグ・ピンチ */
let panMoved=false;
(function(){
  const svg=document.getElementById('jpmap');
  const ptrs=new Map();
  let sx=0,sy=0,svx=0,svy=0,unit=1,pinchD=0,pinchC=null;

  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const v=getVB(), c=vbClamp();
    const rect=svg.getBoundingClientRect();
    const px=(e.clientX-rect.left)/rect.width, py=(e.clientY-rect.top)/rect.height;
    const ux=v.x+px*v.w, uy=v.y+py*v.h;
    const f=e.deltaY>0?1.15:0.87;
    const nw=Math.max(c.min,Math.min(c.max,v.w*f));
    v.w=nw; v.h=nw*(GEO.H/GEO.W);
    v.x=ux-px*v.w; v.y=uy-py*v.h;
    renderMap();
  },{passive:false});

  svg.addEventListener('pointerdown',e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){
      panMoved=false;
      sx=e.clientX; sy=e.clientY;
      const v=getVB(); svx=v.x; svy=v.y;
      const rect=svg.getBoundingClientRect();
      unit=v.w/rect.width;
    }else if(ptrs.size===2){
      const [a,b2]=[...ptrs.values()];
      pinchD=Math.hypot(a.x-b2.x,a.y-b2.y);
      const v=getVB(); pinchC={w:v.w};
    }
  });
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){
      const dx=(e.clientX-sx)*unit, dy=(e.clientY-sy)*unit;
      if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>6 && !panMoved){
        panMoved=true;
        svg.classList.add('panning');
        try{ svg.setPointerCapture(e.pointerId); }catch(_){}
      }
      if(!panMoved) return;
      const v=getVB();
      v.x=svx-dx; v.y=svy-dy;
      applyVB();
    }else if(ptrs.size===2 && pinchC){
      const [a,b2]=[...ptrs.values()];
      const d=Math.hypot(a.x-b2.x,a.y-b2.y);
      if(d>10 && pinchD>10){
        const v=getVB(), c=vbClamp();
        const rect=svg.getBoundingClientRect();
        const mx=((a.x+b2.x)/2-rect.left)/rect.width, my=((a.y+b2.y)/2-rect.top)/rect.height;
        const ux=v.x+mx*v.w, uy=v.y+my*v.h;
        const nw=Math.max(c.min,Math.min(c.max,pinchC.w*(pinchD/d)));
        v.w=nw; v.h=nw*(GEO.H/GEO.W);
        v.x=ux-mx*v.w; v.y=uy-my*v.h;
        applyVB();
        panMoved=true;
      }
    }
  });
  const up=e=>{
    ptrs.delete(e.pointerId);
    if(ptrs.size===0){
      svg.classList.remove('panning');
      if(panMoved){ renderMap(); }
      setTimeout(()=>{panMoved=false;},50);
      pinchC=null;
    }
  };
  svg.addEventListener('pointerup',up);
  svg.addEventListener('pointercancel',up);
})();

function mapGoList(){
  if(state.mapPref){
    state.prefs.clear();
    state.prefs.add(state.mapPref);
    if(state.mapCity){ state.kw=state.mapCity; $("#kw").value=state.mapCity; }
    renderRegions(); renderPrefs();
  }
  setView("list");
  apply();
  window.scrollTo({top:0});
}

function renderMapSide(){
  const box=$("#mapside");
  if(!state.mapPref){
    // 全国: 都道府県リスト（フリガナ付き・件数順）
    const byPf=prefCounts();
    const list=Object.entries(byPf).sort((a,b)=>b[1]-a[1]);
    box.innerHTML='<div class="ms-title">都道府県を選んでください</div>'
      +'<div class="ms-sub">地図のピンか、下のボタンから</div>'
      +'<div class="ms-cities">'
      +list.map(([pf,n])=>'<button class="ms-city" onclick="mapZoomIn(\''+esc(pf)+'\')">'+rubyP(pf)+'<b>'+n+'</b></button>').join("")
      +'</div>';
    return;
  }
  if(state.mapCity){
    const pf=state.mapPref, ct=state.mapCity;
    const list=sortedCityJobs(pf,ct);
    const shown=list.slice(0,MAP_LIST_LIMIT);
    let html='<div class="ms-title">'+rubyP(pf)+'　'+rubyC(pf,ct)+'　'+list.length.toLocaleString()+'件</div>'
      +'<div class="ms-sub">マップの番号と下の番号が対応しています。<button class="lnk" onclick="exitCity()" style="font-size:12px;">選択を解除</button></div>'
      +'<div class="ms-list">'
      +shown.map((j,i)=>{
        const m=calcMatch(j); const g=m?m.grade:"";
        return '<div class="ms-card '+g+'" data-idx="'+i+'">'
          +'<div class="ms-co"><span class="ms-num">'+(i+1)+'</span>'+esc(j.co)+'</div>'
          +'<div class="ms-pills">'+pillsHtml(j)+'</div>'
          +'<div class="ms-row">'+salBlock(j,true)
          +'<button class="ms-id" onclick="copyId(this,\''+esc(j.id)+'\')" aria-label="案件ID '+esc(j.id)+' をコピー">#'+esc(j.id)+'</button></div>'
        +'</div>';
      }).join("")
      +'</div>';
    if(list.length>MAP_LIST_LIMIT) html+='<div class="ms-more">上位 '+MAP_LIST_LIMIT+' 件を表示（全 '+list.length+' 件）</div>';
    html+='<button class="ms-golist" onclick="mapGoList()">この条件で一覧を見る</button>';
    box.innerHTML=html;
    return;
  }
  // 都道府県: 市区町村内訳＋求人
  const pf=state.mapPref;
  const base=baseFilter().filter(j=>j.pf===pf);
  const byCt={};
  base.forEach(j=>{ const c=j.ct||"（市区町村なし）"; byCt[c]=(byCt[c]||0)+1; });
  const cities=Object.entries(byCt).sort((a,b)=>b[1]-a[1]);
  let list=base.map(j=>({j,m:calcMatch(j)})).sort((a,b)=>{
    if(!a.m&&!b.m) return (+a.j.pr||9)-(+b.j.pr||9);
    if(!a.m) return 1; if(!b.m) return -1;
    if(a.m.fatal!==b.m.fatal) return a.m.fatal?1:-1;
    if(b.m.pct!==a.m.pct) return b.m.pct-a.m.pct;
    return (+a.j.pr||9)-(+b.j.pr||9);
  }).map(o=>o.j);
  const shown=list.slice(0,MAP_LIST_LIMIT);
  let html='<div class="ms-title">'+rubyP(pf)+'　'+list.length.toLocaleString()+'件</div>'
    +'<div class="ms-sub">市区町村を押すと求人が1件ずつ開きます</div>'
    +'<div class="ms-cities">'
    +cities.slice(0,18).map(([c,n])=>'<button class="ms-city" onclick="selectMapCity(\''+esc(pf)+'\',\''+esc(c)+'\')">'+rubyC(pf,c)+'<b>'+n+'</b></button>').join("")
    +'</div>'
    +'<div class="ms-list">'
    +shown.map(j=>{
      const m=calcMatch(j); const g=m?m.grade:"";
      return '<div class="ms-card '+g+'">'
        +'<div class="ms-co">'+esc(j.co)+'</div>'
        +'<div class="ms-pills">'+pillsHtml(j)+'</div>'
        +'<div class="ms-row">'+salBlock(j,true)
        +'<button class="ms-id" onclick="copyId(this,\''+esc(j.id)+'\')" aria-label="案件ID '+esc(j.id)+' をコピー">#'+esc(j.id)+'</button></div>'
      +'</div>';
    }).join("")
    +'</div>';
  if(list.length>MAP_LIST_LIMIT) html+='<div class="ms-more">上位 '+MAP_LIST_LIMIT+' 件を表示（全 '+list.length+' 件）</div>';
  html+='<button class="ms-golist" onclick="mapGoList()">この条件で一覧を見る</button>';
  box.innerHTML=html;
}

/* ====== 初期化 ====== */
function init(){
  const emps={};
  ALL_JOBS.forEach(j=>{ if(j.emp) emps[j.emp]=(emps[j.emp]||0)+1; });
  $("#emps").innerHTML = Object.entries(emps).sort((a,b)=>b[1]-a[1]).map(([e,c])=>
    '<button class="chk" data-e="'+esc(e)+'" onclick="toggleEmp(\''+esc(e)+'\')" aria-pressed="false"><span class="chk-lab">'+esc(e)+'</span><span class="chk-c">'+c+'</span></button>'
  ).join("");
  const pris=[...new Set(ALL_JOBS.map(j=>j.pr).filter(Boolean))].sort();
  $("#pris").innerHTML = pris.map(p=>
    '<button class="tab" data-p="'+esc(p)+'" onclick="togglePri(\''+esc(p)+'\')" aria-pressed="false">'+esc(p)+'位</button>'
  ).join("");
  renderRegions();
  renderPrefs();
  apply();
}
init();
