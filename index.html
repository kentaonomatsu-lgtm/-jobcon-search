<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>JCSearch｜ジョブコン求人サーチ</title>
<style>
/* ===== トークン ===== */
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --ink:#111827;
  --ink2:#374151;
  --sub:#6b7280;
  --line:#e5e7eb;
  --line2:#d1d5db;

  --pri:#1e9e42;
  --pri-d:#16803a;
  --pri-bg:#edfdf3;
  --pri-line:#86efac;

  --grn:#047857;
  --grn-bg:#ecfdf5;
  --grn-line:#6ee7b7;

  --or:#c2410c;
  --or-bg:#fff7ed;
  --or-line:#fdba74;

  --ylw:#92400e;
  --ylw-bg:#fffbeb;
  --ylw-line:#fcd34d;

  --red:#dc2626;
  --red-bg:#fef2f2;

  --gry:#f3f4f6;
  --hd-h:56px;
  --qbar-h:52px;
  --nav-h:60px;
  --r:14px;
  --r-sm:10px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --sh-md:0 4px 12px rgba(0,0,0,.10),0 2px 4px rgba(0,0,0,.06);
}

/* ===== リセット ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;scroll-behavior:smooth;}
body{
  font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:3px solid #3b82f6;outline-offset:2px;border-radius:4px;}

/* ===== ローディングバー ===== */
#loadbar{
  position:fixed;top:0;left:0;height:3px;
  background:linear-gradient(90deg,var(--pri),#4ade80);
  z-index:9999;transition:width .3s ease,opacity .5s ease;
  width:0;opacity:1;
}
#loadbar.done{width:100%;opacity:0;}

/* ===== ヘッダー ===== */
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--hd-h);
  background:#fff;
  border-bottom:1px solid var(--line);
  box-shadow:var(--sh);
  display:flex;align-items:center;gap:10px;
  padding:0 14px;
  padding-right:max(14px,env(safe-area-inset-right));
  padding-left:max(14px,env(safe-area-inset-left));
}
.hd-brand{display:flex;align-items:center;gap:8px;flex:none;}
.hd-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--pri),#16803a);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex:none;color:#fff;
  box-shadow:0 2px 6px rgba(30,158,66,.35);
}
.hd-logo{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
.hd-logo span{color:var(--pri);}
.hd-search{
  flex:1;min-width:0;position:relative;
}
.hd-search input{
  width:100%;height:38px;
  padding:0 38px 0 14px;
  border:1.5px solid var(--line2);
  border-radius:30px;
  font-size:14px;
  background:var(--gry);
  transition:border-color .15s,background .15s;
}
.hd-search input:focus{
  outline:none;
  border-color:var(--pri);
  background:#fff;
  box-shadow:0 0 0 3px rgba(30,158,66,.12);
}
.hd-search-x{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  color:var(--sub);font-size:18px;
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
}
.hd-cnt{
  flex:none;
  font-size:13px;font-weight:800;
  color:var(--pri);
  background:var(--pri-bg);
  border:1px solid var(--pri-line);
  padding:5px 10px;border-radius:20px;
  white-space:nowrap;
}
.hd-cnt b{font-size:17px;}

/* ===== 送客可否チェック（ヘッダー内） ===== */
.hd-tel-wrap{
  display:flex;align-items:center;gap:4px;flex:none;
  background:var(--gry);
  border:1.5px solid var(--line2);
  border-radius:30px;
  padding:0 4px 0 12px;
  height:38px;
}
.hd-tel-wrap.ng-active{
  border-color:#dc2626;background:#fef2f2;
}
.hd-tel-wrap.ok-active{
  border-color:#16803a;background:#edfdf3;
}
.hd-tel-wrap input{
  border:none;background:none;
  width:190px;font-size:13px;
  color:var(--ink);
}
.hd-tel-wrap input:focus{outline:none;}
.hd-tel-btn{
  height:30px;padding:0 10px;
  background:var(--ink);color:#fff;
  border-radius:20px;font-size:12px;font-weight:800;
  white-space:nowrap;flex:none;
}
.hd-tel-btn:disabled{background:#aaa;cursor:not-allowed;}
.hd-tel-clr{
  height:30px;width:30px;
  color:var(--sub);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;flex:none;
}
/* NG/OK バナー */
#telResultBanner{
  display:none;
  position:fixed;top:calc(var(--hd-h) + var(--qbar-h) + 8px);
  left:50%;transform:translateX(-50%);
  z-index:200;
  background:#fff;
  border-radius:12px;
  box-shadow:var(--sh-md);
  border:2px solid var(--line);
  padding:14px 18px;
  min-width:300px;max-width:90vw;
  font-size:13px;
}
#telResultBanner.show{display:block;}
.trb-head{font-size:20px;font-weight:800;margin-bottom:6px;}
.trb-head.ng{color:#dc2626;}
.trb-head.ok{color:#16803a;}
.trb-list{list-style:none;margin-top:6px;display:flex;flex-direction:column;gap:4px;}
.trb-list li{
  padding:6px 10px;border-radius:8px;
  font-size:12px;font-weight:700;
}
.trb-list li.ng{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
.trb-list li.ok{background:#edfdf3;color:#16803a;border:1px solid #86efac;}
.trb-close{
  display:block;margin-top:10px;width:100%;
  text-align:center;font-size:13px;font-weight:800;
  color:var(--sub);padding:4px;
}
@media(max-width:700px){
  .hd-tel-wrap input{width:110px;}
  .hd-tel-btn{padding:0 8px;}
}

/* ===== クイックバー ===== */
.qbar{
  position:fixed;
  top:var(--hd-h);left:0;right:0;
  z-index:99;
  background:#fff;
  border-bottom:1px solid var(--line);
  height:var(--qbar-h);
  display:flex;align-items:center;
  gap:8px;
  padding:0 14px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.qbar::-webkit-scrollbar{display:none;}
.qb-chip{
  display:inline-flex;align-items:center;gap:5px;
  min-height:36px;padding:0 13px;
  border:1.5px solid var(--line2);
  background:#fff;
  border-radius:30px;
  font-size:13px;font-weight:700;
  color:var(--ink2);
  white-space:nowrap;flex:none;
  transition:all .15s;
}
.qb-chip.active{
  background:var(--pri);border-color:var(--pri);color:#fff;
}
.qb-chip input{
  border:none;background:none;
  width:44px;text-align:center;
  font-size:13px;font-weight:800;
  color:inherit;
  padding:0;
}
.qb-chip input::placeholder{color:rgba(0,0,0,.35);}
.qb-chip.active input::placeholder{color:rgba(255,255,255,.6);}
.qb-chip input:focus{outline:none;}
.qb-sep{width:1px;height:24px;background:var(--line2);flex:none;margin:0 2px;}
.qb-sort{
  display:inline-flex;align-items:center;gap:4px;
  min-height:36px;padding:0 11px;
  border:1.5px solid var(--line2);border-radius:30px;
  font-size:13px;font-weight:700;color:var(--ink2);
  white-space:nowrap;flex:none;background:#fff;
}
.qb-sort select{
  border:none;background:none;padding:0;
  font-size:13px;font-weight:700;color:var(--ink2);
  cursor:pointer;appearance:none;-webkit-appearance:none;
}
.qb-clear-pill{
  display:inline-flex;align-items:center;
  min-height:36px;padding:0 13px;
  border:1.5px solid var(--red);
  background:var(--red-bg);
  border-radius:30px;
  font-size:13px;font-weight:800;
  color:var(--red);
  white-space:nowrap;flex:none;
}

/* ===== ボトムナビ（スマホのみ） ===== */
.bottom-nav{
  display:none;
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:100;
  height:var(--nav-h);
  background:#fff;
  border-top:1px solid var(--line);
  box-shadow:0 -2px 12px rgba(0,0,0,.08);
  padding-bottom:env(safe-area-inset-bottom);
}
.bn-inner{
  display:flex;height:100%;
}
.bn-tab{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;font-size:10px;font-weight:700;
  color:var(--sub);transition:color .15s;
  padding-bottom:2px;
}
.bn-tab.active{color:var(--pri);}
.bn-icon{font-size:22px;line-height:1;}
.bn-badge{
  position:absolute;top:-2px;right:-4px;
  background:var(--red);color:#fff;
  font-size:10px;font-weight:800;
  min-width:18px;height:18px;
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  padding:0 4px;
  border:2px solid #fff;
}
.bn-tab .rel{position:relative;display:inline-block;}

/* ===== メインレイアウト ===== */
.layout{
  display:flex;
  padding-top:calc(var(--hd-h) + var(--qbar-h));
  min-height:100vh;
  max-width:1400px;
  margin:0 auto;
}

/* ===== サイドパネル ===== */
.side{
  width:280px;flex:none;
  position:sticky;
  top:calc(var(--hd-h) + var(--qbar-h));
  height:calc(100vh - var(--hd-h) - var(--qbar-h));
  overflow-y:auto;
  padding:14px;
  display:flex;flex-direction:column;gap:10px;
  scrollbar-width:thin;
  scrollbar-color:var(--line2) transparent;
}
.side::-webkit-scrollbar{width:4px;}
.side::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px;}

/* ===== パネルカード ===== */
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:14px;
  box-shadow:var(--sh);
}
.panel.dorm-panel{
  background:linear-gradient(135deg,#fff7ed,#fff);
  border:1.5px solid var(--or-line);
}
.panel-hd{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.panel-t{font-size:13px;font-weight:800;color:var(--ink);}
.panel-clr{
  font-size:12px;color:var(--pri);font-weight:700;
  text-decoration:underline;
}

/* タイル */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.tile{
  background:#fff;border:2px solid var(--line);
  border-radius:10px;padding:10px 6px;
  text-align:center;transition:all .12s;cursor:pointer;
}
.tile.on{background:var(--or);border-color:var(--or);}
.t-l{font-size:11.5px;font-weight:800;color:#9a3412;margin-bottom:3px;}
.t-c{font-size:18px;font-weight:800;color:var(--or);}
.tile.on .t-l,.tile.on .t-c{color:#fff;}
.tile.on .t-l::before{content:"✓ ";}

/* 年齢 */
.age-row{display:flex;gap:6px;align-items:center;}
.age-btn{
  width:44px;height:44px;
  border:2px solid var(--line);background:var(--gry);
  border-radius:10px;font-size:22px;font-weight:800;
  color:var(--sub);flex:none;
}
.age-in{
  flex:1;height:44px;text-align:center;
  font-size:20px;font-weight:800;
  border:2px solid var(--line);border-radius:10px;
}
.age-in.set{background:var(--ylw-bg);border-color:var(--ylw-line);color:var(--ylw);}
.hint{font-size:12px;color:var(--sub);margin-top:7px;line-height:1.5;}

/* 性別 / タブ */
.tabs{display:flex;gap:6px;}
.tab{
  flex:1;min-height:44px;
  border:2px solid var(--line);background:#fff;
  border-radius:10px;font-size:14px;font-weight:800;
  color:var(--sub);text-align:center;transition:all .12s;
}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.tab.on::before{content:"✓ ";}

/* 月収 */
.sal-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.sal-in{
  width:80px;height:44px;text-align:center;
  font-size:20px;font-weight:800;
  border:2px solid var(--line);border-radius:10px;
}
.sal-in.set{background:var(--grn-bg);border-color:var(--grn-line);color:var(--grn);}
.sal-u{font-size:13px;color:var(--sub);font-weight:800;}
input[type=range]{
  width:100%;-webkit-appearance:none;height:8px;
  background:var(--line);border-radius:4px;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;
  border-radius:50%;background:var(--grn);
  border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);
}

/* チェックリスト */
.chk-list{display:flex;flex-direction:column;gap:5px;}
.co-search{
  width:100%;height:40px;
  border:1.5px solid var(--line2);border-radius:9px;
  font-size:13px;font-weight:700;padding:0 12px;
  margin-bottom:8px;background:var(--gry);
}
.co-search:focus{outline:none;border-color:var(--pri);background:#fff;}
.co-list-wrap{max-height:260px;overflow-y:auto;}
.chk{
  display:flex;align-items:center;justify-content:space-between;
  min-height:46px;padding:0 12px;
  border:1.5px solid var(--line);border-radius:10px;
  background:#fff;font-size:14px;font-weight:700;
  color:var(--ink2);cursor:pointer;transition:all .12s;
}
.chk.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.chk.on .chk-lab::before{content:"✓ ";}
.chk-c{
  font-size:12px;font-weight:800;color:var(--sub);
  background:var(--gry);padding:2px 8px;border-radius:20px;
  flex:none;
}
.chk.on .chk-c{background:rgba(255,255,255,.25);color:#fff;}

/* ===== エリア（地域）===== */
.area-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:13px;
  box-shadow:var(--sh);margin-bottom:10px;
}
.regions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.reg{
  min-height:38px;padding:0 13px;
  border:2px solid var(--line);background:#fff;
  border-radius:30px;font-size:12.5px;font-weight:800;
  color:var(--ink2);cursor:pointer;transition:all .12s;
}
.reg.act{background:var(--pri);border-color:var(--pri);color:#fff;}
.reg.has{border-color:var(--pri);color:var(--pri);background:var(--pri-bg);}
.reg b{font-size:10.5px;opacity:.7;margin-left:3px;}
.prefs-wrap{display:flex;flex-wrap:wrap;gap:5px;padding-top:8px;border-top:1.5px dashed var(--line);}
.prefs-wrap:empty{display:none;}
.pref{
  min-height:36px;padding:0 11px;
  border:1.5px solid var(--line);background:var(--gry);
  border-radius:8px;font-size:12.5px;font-weight:800;
  color:var(--ink2);cursor:pointer;transition:all .12s;
}
.pref.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.pref.on::before{content:"✓ ";}
.pref b{font-size:10.5px;opacity:.7;margin-left:2px;}
.area-hint{font-size:12px;color:var(--sub);margin-top:6px;}

/* ===== アクティブフィルタ ===== */
.active-bar{
  display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;margin-bottom:10px;
}
.active-bar:empty{display:none;}
.af-label{font-size:11.5px;font-weight:800;color:var(--sub);}
.af{
  display:inline-flex;align-items:center;gap:4px;
  background:#fff;border:1.5px solid var(--pri);color:var(--pri);
  min-height:32px;padding:0 4px 0 10px;
  border-radius:30px;font-size:12.5px;font-weight:800;
  box-shadow:var(--sh);
}
.af button{
  color:var(--pri);font-size:16px;
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
}

/* ===== 件数バー ===== */
.count-bar{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:9px 13px;
  box-shadow:var(--sh);margin-bottom:10px;
}
.cnt-text{font-size:13px;font-weight:700;color:var(--sub);}
.cnt-text b{font-size:18px;color:var(--ink);font-weight:800;}
.cnt-sp{flex:1;}

/* ===== メインエリア ===== */
.main{
  flex:1;min-width:0;
  padding:14px;
}

/* ===== カード ===== */
.cards{display:flex;flex-direction:column;gap:10px;}
mark.hit{
  background:#fef08a;color:inherit;
  padding:0 1px;border-radius:2px;font-weight:800;
}

/* 求人カード */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--sh);
  overflow:hidden;
  transition:box-shadow .15s;
}
.card:hover{box-shadow:var(--sh-md);}

/* 枠バナー */
.quota-banner{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:8px 13px;
  font-weight:900;font-size:13px;
}
.quota-banner.qb-group{display:block;border:2px dashed rgba(255,255,255,.6);}
.quota-banner.qb-group.qb-mid,.quota-banner.qb-group.qb-none{border-color:rgba(0,0,0,.2);}
.qb-group-row{margin:0 0 3px;}
.qb-group-tag{
  display:inline-block;font-size:11px;font-weight:800;
  letter-spacing:.02em;padding:2px 8px;border-radius:999px;
  background:rgba(255,255,255,.25);
}
.quota-banner.qb-group.qb-mid .qb-group-tag,
.quota-banner.qb-group.qb-none .qb-group-tag{background:rgba(0,0,0,.07);}
.qb-main-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.quota-banner .qb-label{font-size:12px;opacity:.85;}
.quota-banner .qb-num{font-size:18px;line-height:1;}
.quota-banner .qb-num b{font-size:24px;margin:0 2px;}
.quota-banner .qb-total{font-size:12px;opacity:.8;}
.qb-out{background:var(--red);color:#fff;}
.qb-low{background:var(--or);color:#fff;}
.qb-mid{background:#fde68a;color:#7c4a03;}
.qb-full{background:var(--grn);color:#fff;}
.qb-none{background:var(--gry);color:#6b7280;}

/* 給与バナー */
.sal-banner{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:8px 13px;font-weight:900;font-size:13px;
}
.sal-banner .sb-label{font-size:11.5px;opacity:.85;}
.sal-banner .sb-num{font-size:18px;line-height:1;}
.sal-banner .sb-num b{font-size:24px;margin:0 2px;}
.sal-banner .sb-sub{font-size:11.5px;opacity:.8;}
.sb-m{background:var(--grn-bg);color:var(--grn);border-bottom:1px solid var(--grn-line);}
.sb-h{background:#e0f2fe;color:#0e7490;border-bottom:1px solid #7dd3fc;}

/* カード本体 */
.c-top{padding:13px 14px;display:flex;gap:12px;align-items:flex-start;}
.c-l{flex:1;min-width:0;}
.c-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
.c-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.badge{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:6px;}
.badge.pri{background:var(--gry);color:var(--sub);border:1px solid var(--line);}
.c-co{font-size:16px;font-weight:800;line-height:1.35;word-break:break-all;}
.c-ti{
  font-size:12.5px;color:#4b5563;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;
}
.sal-block{
  background:var(--grn-bg);border:1.5px solid var(--grn-line);
  border-radius:11px;padding:8px 12px;text-align:right;min-width:130px;
}
.sal-tag{
  display:inline-block;font-size:11px;font-weight:800;
  padding:2px 7px;border-radius:5px;margin-bottom:2px;
}
.sal-tag.h{background:#0e7490;color:#fff;}
.sal-tag.m{background:#047857;color:#fff;}
.sal-n{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
.sal-un{font-size:12.5px;font-weight:800;}
.sal-sub{font-size:11.5px;color:#065f46;font-weight:800;margin-top:2px;white-space:nowrap;}
.sal-main{display:flex;align-items:baseline;justify-content:flex-end;gap:2px;color:var(--grn);}

/* コピーID */
.c-id{
  font-size:12px;font-weight:800;color:var(--sub);
  background:var(--gry);border:1.5px solid var(--line);
  min-height:36px;padding:0 10px;border-radius:8px;
  white-space:nowrap;cursor:pointer;transition:all .15s;
}
.c-id.ok{background:#059669;border-color:#059669;color:#fff;}

/* ピル */
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
.pill{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:30px;white-space:nowrap;}
.pill.loc{background:var(--pri-bg);color:var(--pri);}
.pill.age{background:var(--ylw-bg);color:var(--ylw);}
.pill.age.ng{background:var(--red-bg);color:var(--red);border:1.5px solid #fca5a5;}
.pill.gen{background:var(--pri-bg);color:var(--pri);}
.pill.dorm{background:var(--grn-bg);color:var(--grn);}
.pill.free{background:var(--or);color:#fff;}
.pill.sub{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;}
.pill.bx{background:var(--or-bg);color:var(--or);border:1px solid var(--or-line);}
.pill.sf,.pill.emp{background:var(--gry);color:#374151;}

/* メタ */
.c-meta{font-size:11.5px;color:#6b7280;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* フッター */
.c-foot{
  display:flex;gap:7px;align-items:center;
  padding:0 14px 12px;flex-wrap:wrap;
}
.c-btn{
  min-height:38px;padding:0 13px;
  border:1.5px solid var(--line);background:#fff;
  border-radius:9px;font-size:13px;font-weight:800;
  color:var(--ink2);display:inline-flex;align-items:center;
  transition:all .12s;
}
.c-btn:hover{background:var(--gry);}
.c-btn.go{
  background:var(--pri);border-color:var(--pri);color:#fff;
}
.c-btn.go:hover{background:var(--pri-d);}
.c-maker{
  display:inline-flex;align-items:center;
  font-size:12px;font-weight:800;color:var(--sub);
  background:var(--gry);border:1px solid var(--line);
  border-radius:8px;padding:0 10px;min-height:38px;white-space:nowrap;
}

/* 詳細 */
.det{
  display:none;padding:12px 14px;
  background:var(--gry);border-top:1px solid var(--line);
  font-size:13px;line-height:1.7;
}
.det.open{display:block;}
.det dt{font-size:11.5px;font-weight:800;color:var(--sub);margin-top:8px;}
.det dt:first-child{margin-top:0;}
.det dd{color:var(--ink2);}

/* Empty */
.empty{
  background:var(--card);border:2px dashed var(--line);
  border-radius:var(--r);padding:48px 20px;text-align:center;color:var(--sub);
}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px;}

/* もっと読む */
.more-text{text-align:center;padding:10px;color:var(--sub);font-size:12.5px;font-weight:700;}
.load-more{
  display:block;width:100%;min-height:48px;
  background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r-sm);font-size:14px;font-weight:800;
  color:var(--ink2);margin-top:4px;
}

/* スケルトン */
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.skel{
  background:linear-gradient(90deg,#f0f0f0 25%,#f8f8f8 50%,#f0f0f0 75%);
  background-size:600px 100%;animation:shimmer 1.4s infinite;border-radius:8px;
}
.skel-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh);
}
.skel-line{height:14px;margin-bottom:8px;}
.skel-line.w80{width:80%;}.skel-line.w60{width:60%;}.skel-line.w40{width:40%;}

/* ルビ */
ruby{ruby-position:over;}
ruby rt{font-size:58%;opacity:.85;font-weight:700;letter-spacing:0;}

/* ===== ドロワー（スマホのフィルタ） ===== */
.drawer-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.4);z-index:200;
  opacity:0;transition:opacity .25s;
}
.drawer-overlay.open{display:block;opacity:1;}
.drawer{
  position:fixed;bottom:0;left:0;right:0;z-index:201;
  background:#fff;
  border-radius:20px 20px 0 0;
  max-height:88vh;
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.drawer.open{transform:translateY(0);}
.drawer-handle{
  width:40px;height:5px;background:var(--line2);
  border-radius:3px;margin:10px auto 0;flex:none;
}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;border-bottom:1px solid var(--line);flex:none;
}
.drawer-title{font-size:16px;font-weight:800;}
.drawer-close{font-size:24px;color:var(--sub);width:36px;height:36px;display:flex;align-items:center;justify-content:center;}
.drawer-body{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px;
  display:flex;flex-direction:column;gap:12px;
  padding-bottom:max(24px,env(safe-area-inset-bottom));
}
.drawer-body .panel{box-shadow:none;}

/* ===== レスポンシブ ===== */
@media(max-width:768px){
  :root{--hd-h:52px;--qbar-h:48px;--nav-h:60px;}

  .layout{
    flex-direction:column;
    padding-bottom:var(--nav-h);
  }
  .side{display:none;} /* ドロワーに移行 */
  .bottom-nav{display:block;}
  .main{padding:10px;}
  .hd-logo{display:none;}/* スマホは省略 */
  .hd-cnt{display:none;} /* スマホは省略（ドロワーに表示） */

  /* カードをスマホ最適化 */
  .c-top{flex-direction:column;gap:10px;}
  .c-r{flex-direction:row;align-items:center;width:100%;justify-content:space-between;}
  .sal-block{min-width:0;flex:1;text-align:left;}
  .sal-main{justify-content:flex-start;}

  /* クイックバー */
  .qbar{gap:6px;padding:0 10px;}
  .qb-chip{min-height:34px;padding:0 10px;font-size:12.5px;}
  .qb-chip input{width:38px;font-size:12.5px;}
}

@media(min-width:769px){
  .drawer,.drawer-overlay,.bottom-nav{display:none !important;}
}

@media(min-width:769px) and (max-width:1080px){
  .side{width:240px;}
}

<body>

<div id="loadbar"></div>

<!-- ===== ヘッダー ===== -->
<header>
  <div class="hd-brand">
    <div class="hd-icon">🔍</div>
    <div class="hd-logo">ジョブコン<span>サーチ</span></div>
  </div>
  <div class="hd-search">
    <input id="kw" type="search" placeholder="社名・地域・職種・案件IDで検索"
      aria-label="キーワード検索" oninput="setKw(this.value)" autocomplete="off">
    <button class="hd-search-x" id="kwx" aria-label="検索をクリア"
      onclick="setKw('');document.getElementById('kw').value='';" hidden>×</button>
  </div>
  <div class="hd-cnt" aria-live="polite"><b id="hc">-</b> / <span id="ht">-</span>件</div>
  <!-- 送客可否チェック -->
  <div class="hd-tel-wrap" id="hdTelWrap">
    <input id="hdTelInput" type="tel" inputmode="numeric" placeholder="電話番号で送客可否チェック"
      aria-label="電話番号で送客可否チェック" autocomplete="tel"
      onkeydown="if(event.key==='Enter')checkTel()">
    <button class="hd-tel-btn" id="hdTelBtn" onclick="checkTel()">チェック</button>
    <button class="hd-tel-clr" id="hdTelClr" onclick="clearTelCheck()" hidden aria-label="送客可否チェックをクリア">✕</button>
  </div>
</header>

<!-- ===== クイックバー ===== -->
<div class="qbar" aria-label="クイック絞り込み">
  <!-- 更新ボタン -->
  <button class="qb-chip" id="hdRefreshBtn" onclick="manualRefresh()" aria-label="最新を確認">
    <span id="hdRefreshLabel">⟳ 更新</span>
  </button>
  <div class="qb-sep"></div>
  <!-- 年齢 -->
  <label class="qb-chip" id="qb-age-chip">
    <span>年齢</span>
    <input class="age-sync" id="qb-age-in" type="number" inputmode="numeric"
      placeholder="45" min="15" max="80" oninput="onAge(this.value)" aria-label="年齢">
    <span>歳〜</span>
  </label>
  <!-- 性別 -->
  <button class="qb-chip gender-sync" data-g="男性" onclick="setGender('男性')" aria-pressed="false">男性</button>
  <button class="qb-chip gender-sync" data-g="女性" onclick="setGender('女性')" aria-pressed="false">女性</button>
  <div class="qb-sep"></div>
  <!-- 給与 -->
  <label class="qb-chip" id="qb-sal-chip">
    <span>給与</span>
    <input class="sal-sync" id="qb-sal-in" type="number" inputmode="numeric"
      value="0" min="0" max="50" oninput="setSal(this.value)" aria-label="希望給与（万円換算）">
    <span>万〜</span>
  </label>
  <div class="qb-sep"></div>
  <!-- ソート -->
  <div class="qb-sort">
    ↕
    <select id="sort" aria-label="並び順" onchange="setSort(this.value)">
      <option value="pri">優先順位</option>
      <option value="sal_h">給与↑</option>
      <option value="sal_l">給与↓</option>
      <option value="bonus">祝い金</option>
    </select>
  </div>
  <!-- クリア -->
  <button class="qb-clear-pill" id="qbclear" onclick="resetAll()" hidden>✕ クリア</button>
</div>

<!-- ===== ボトムナビ（スマホ） ===== -->
<div class="bottom-nav">
  <div class="bn-inner">
    <button class="bn-tab active" id="bn-list" onclick="showView('list')">
      <span class="bn-icon">📋</span>
      <span>求人一覧</span>
    </button>
    <button class="bn-tab" id="bn-filter" onclick="openDrawer()">
      <span class="rel">
        <span class="bn-icon">🔧</span>
        <span class="bn-badge" id="filter-badge" hidden>0</span>
      </span>
      <span>絞り込み</span>
    </button>
    <button class="bn-tab" id="bn-area" onclick="showView('area')">
      <span class="bn-icon">📍</span>
      <span>エリア</span>
    </button>
  </div>
</div>

<!-- ===== ドロワー（スマホのフィルタ） ===== -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="絞り込み条件">
  <div class="drawer-handle"></div>
  <div class="drawer-head">
    <span class="drawer-title">🔧 絞り込み</span>
    <button class="drawer-close" onclick="closeDrawer()" aria-label="閉じる">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody">
    <!-- JS で共有コンテンツを複製 -->
  </div>
</div>

<!-- ===== メインレイアウト ===== -->
<div class="layout">
  <!-- PC サイドパネル -->
  <aside class="side" aria-label="絞り込みパネル" id="sidePanel">
    <!-- JS で生成 -->
  </aside>

  <!-- メイン -->
  <main class="main" aria-label="求人一覧">
    <!-- エリア（スマホ「エリア」タブでも表示） -->
    <div id="area-section">
      <div class="area-card">
        <div class="regions" id="regs" role="group" aria-label="地方で絞り込み"></div>
        <div class="prefs-wrap" id="prefs" role="group" aria-label="都道府県で絞り込み"></div>
        <div class="area-hint" id="areahint"></div>
      </div>
    </div>

    <!-- 適用中フィルタ -->
    <div class="active-bar" id="active" aria-label="適用中の条件" aria-live="polite"></div>

    <!-- 件数バー -->
    <div class="count-bar">
      <span class="cnt-text"><b id="bc">-</b> / <span id="bt">-</span>件</span>
      <span class="cnt-sp"></span>
      <span id="hdUpdated" style="font-size:11.5px;color:var(--sub);font-weight:700;">読込中…</span>
    </div>

    <!-- カード一覧 -->
    <div class="cards" id="cards">
      <div class="skel-card"><div class="skel skel-line w80"></div><div class="skel skel-line w60"></div><div class="skel skel-line w40"></div></div>
      <div class="skel-card"><div class="skel skel-line w80"></div><div class="skel skel-line w60"></div><div class="skel skel-line w40"></div></div>
      <div class="skel-card"><div class="skel skel-line w80"></div><div class="skel skel-line w60"></div><div class="skel skel-line w40"></div></div>
    </div>
    <div class="more-text" id="more"></div>
    <button id="loadMoreBtn" class="load-more" onclick="loadMore()" hidden>さらに読み込む ▼</button>
  </main>
</div>

<script>
/* ====== 設定 ====== */
const DATA_JSON_URL = "./data.json";
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyDO5dsR1BlXNIIOHTWR21NeVtD91sq-1HREiL9aVQmZZGc-9oK8rbLixZ6PmJAVyY7hw/exec";
// ★ dpt-registration-system が動いているPCのIPアドレスに変更してください
const CHECK_API_URL = "https://revival-whoever-tweed.ngrok-free.dev/api/check-application-history";
/* HOURS/toHourly は v9 で廃止（時給←→月給換算表示を廃止） */
const PAGE_SIZE = 50;
const SW_CACHE = "jcsearch-v2";

const REGIONS = {
  "北海道・東北":["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県"],
  "関東":["東京都","神奈川県","埼玉県","千葉県","茨城県","栃木県","群馬県"],
  "甲信越・北陸":["新潟県","富山県","石川県","福井県","山梨県","長野県"],
  "東海":["愛知県","岐阜県","静岡県","三重県"],
  "近畿":["大阪府","兵庫県","京都府","滋賀県","奈良県","和歌山県"],
  "中国":["鳥取県","島根県","岡山県","広島県","山口県"],
  "四国":["徳島県","香川県","愛媛県","高知県"],
  "九州・沖縄":["福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"]
};

const KANA_PREF={"北海道":"ほっかいどう","青森県":"あおもりけん","岩手県":"いわてけん","宮城県":"みやぎけん","秋田県":"あきたけん","山形県":"やまがたけん","福島県":"ふくしまけん","茨城県":"いばらきけん","栃木県":"とちぎけん","群馬県":"ぐんまけん","埼玉県":"さいたまけん","千葉県":"ちばけん","東京都":"とうきょうと","神奈川県":"かながわけん","新潟県":"にいがたけん","富山県":"とやまけん","石川県":"いしかわけん","福井県":"ふくいけん","山梨県":"やまなしけん","長野県":"ながのけん","岐阜県":"ぎふけん","静岡県":"しずおかけん","愛知県":"あいちけん","三重県":"みえけん","滋賀県":"しがけん","京都府":"きょうとふ","大阪府":"おおさかふ","兵庫県":"ひょうごけん","奈良県":"ならけん","和歌山県":"わかやまけん","鳥取県":"とっとりけん","島根県":"しまねけん","岡山県":"おかやまけん","広島県":"ひろしまけん","山口県":"やまぐちけん","徳島県":"とくしまけん","香川県":"かがわけん","愛媛県":"えひめけん","高知県":"こうちけん","福岡県":"ふくおかけん","佐賀県":"さがけん","長崎県":"ながさきけん","熊本県":"くまもとけん","大分県":"おおいたけん","宮崎県":"みやざきけん","鹿児島県":"かごしまけん","沖縄県":"おきなわけん"};

/* ====== グローバル ====== */
let ALL_JOBS = [];
let LAST_UPDATED_AT = null;
let filtered = [];
let displayCount = PAGE_SIZE;
let _refreshing = false;
let _currentView = "list"; // list | area
let NG_COMPANIES = new Set(); // 送客NG企業名（電話番号チェックで取得）
let _telChecking = false;

const state = {
  kw:"", age:null, gender:"", salMin:0,
  prefs:new Set(), pris:new Set(), quicks:new Set(), emps:new Set(), cos:new Set(),
  sort:"pri", region:""
};

/* ====== util ====== */
const $ = id => document.getElementById(id);
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function escMark(text){
  const t = esc(text);
  const kw = state.kw.trim();
  if(!kw) return t;
  const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  return t.replace(re, m=>'<mark class="hit">'+m+'</mark>');
}
/* toHourly は v9 で廃止 */
/* salVal: フィルター・ソート用の統一万円換算値
   時給(hr円) → hr×173÷10000 万円相当 / 月給(sl万円) → そのまま */
function salVal(j){
  if(j.wt==="時給"&&j.hr>0) return Math.round(j.hr*173/10000*10)/10;
  return j.sl||0;
}
function kanaPref(pf){ return KANA_PREF[pf]||""; }
function rubyP(pf){ const k=kanaPref(pf); return k?'<ruby>'+esc(pf)+'<rt>'+esc(k)+'</rt></ruby>':esc(pf); }

/* ====== 送客可否チェック ====== */
async function checkTel(){
  const tel = ($("hdTelInput").value||"").trim().replace(/[－\-\s]/g,"");
  if(!tel){ alert("電話番号を入力してください"); return; }
  if(_telChecking) return;
  _telChecking = true;
  const btn = $("hdTelBtn");
  btn.disabled = true; btn.textContent = "検索中…";

  try{
    const res = await fetch(CHECK_API_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({tel})
    });
    const data = await res.json();
    if(!data.success) throw new Error(data.error||"エラー");

    // NG企業セットを更新
    NG_COMPANIES = new Set(data.ngCompanies||[]);

    // バナー表示
    showTelBanner(data);

    // フィルター再適用
    renderAll();

    // ヘッダーの色を変える
    const wrap = $("hdTelWrap");
    wrap.classList.remove("ng-active","ok-active");
    if(NG_COMPANIES.size > 0) wrap.classList.add("ng-active");
    else wrap.classList.add("ok-active");

    $("hdTelClr").hidden = false;
  }catch(e){
    alert("取得エラー："+e.message);
  }finally{
    _telChecking = false;
    btn.disabled = false;
    btn.textContent = "チェック";
  }
}

function showTelBanner(data){
  let banner = $("telResultBanner");
  if(!banner){
    banner = document.createElement("div");
    banner.id = "telResultBanner";
    document.body.appendChild(banner);
  }
  const ng = (data.applications||[]).filter(a=>a.period==="1month"||a.period==="3months");
  const ok = (data.applications||[]).filter(a=>a.period==="over3months");
  const isNG = ng.length > 0;

  const ngList = ng.map(a=>`<li class="ng">🚫 ${esc(a.companyName)}（${a.appliedAt}）</li>`).join("");
  const okList = ok.length ? ok.map(a=>`<li class="ok">✅ ${esc(a.companyName)}（${a.appliedAt}）</li>`).join("") : "";
  const noHistory = data.total === 0 ? '<p style="color:var(--sub);margin-top:6px">応募履歴なし → 全求人に送客可</p>' : "";

  banner.innerHTML = `
    <div class="trb-head ${isNG?"ng":"ok"}">${isNG?"⚠️ 送客NG企業あり":"✅ 送客可"}</div>
    <div style="font-size:12px;color:var(--sub)">電話番号：${esc(data.tel)}　/ 総応募${data.total}件</div>
    ${noHistory}
    ${ngList||okList ? `<ul class="trb-list">${ngList}${okList}</ul>` : ""}
    <div style="font-size:11px;color:var(--sub);margin-top:8px">${isNG?"NG企業の求人を一覧から除外しました":"一覧にすべての求人を表示しています"}</div>
    <button class="trb-close" onclick="document.getElementById('telResultBanner').classList.remove('show')">閉じる ✕</button>
  `;
  banner.classList.add("show");
}

function clearTelCheck(){
  NG_COMPANIES = new Set();
  $("hdTelInput").value = "";
  $("hdTelClr").hidden = true;
  const wrap = $("hdTelWrap");
  wrap.classList.remove("ng-active","ok-active");

let _lbTimer=null;
function lbStart(){ const b=$("loadbar");b.style.width="0";b.style.opacity="1";b.style.transition="width 2s ease";requestAnimationFrame(()=>{b.style.width="80%";}); }
function lbDone(){ const b=$("loadbar");b.style.transition="width .2s ease,opacity .5s ease .2s";b.style.width="100%";setTimeout(()=>{b.style.opacity="0";},300); }

/* ====== Service Worker ====== */
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing;
      w.addEventListener('statechange',()=>{ if(w.state==='activated') location.reload(); });
    });
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('message',async e=>{
    if(e.data&&e.data.type==='DATA_UPDATED'){
      try{
        const res=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});
        const data=await res.json();
        if(data&&Array.isArray(data.jobs)&&data.jobs.length>0){
          ALL_JOBS=data.jobs;LAST_UPDATED_AT=data.updatedAt||null;
          renderAll();showUpdatedDate(true);
        }
      }catch(err){}
    }
  });
}

/* ====== データ取得 ====== */
async function loadInitialData(){
  lbStart();
  try{
    const res=await fetch(DATA_JSON_URL,{cache:"no-cache"});
    if(!res.ok) throw new Error("data.json fetch failed");
    const data=await res.json();
    if(data&&Array.isArray(data.jobs)){
      ALL_JOBS=data.jobs;LAST_UPDATED_AT=data.updatedAt||null;
      renderAll();showUpdatedDate();lbDone();
      setTimeout(checkGasUpdate,100);
    }
  }catch(e){
    console.warn("data.json 読み込み失敗、GAS APIにフォールバック:",e);
    await loadFromGAS();lbDone();
  }
}
async function checkGasUpdate(){
  const lastCheck=sessionStorage.getItem("jc_last_check");
  if(lastCheck&&Date.now()-Number(lastCheck)<10*60*1000) return;
  try{
    const res=await fetch(GAS_API_URL,{cache:"no-store"});
    const data=await res.json();
    if(data&&Array.isArray(data.jobs)&&data.jobs.length>0){
      if(!LAST_UPDATED_AT||data.updatedAt>LAST_UPDATED_AT){
        ALL_JOBS=data.jobs;LAST_UPDATED_AT=data.updatedAt||null;
        renderAll();showUpdatedDate(true);
      }
    }
    sessionStorage.setItem("jc_last_check",String(Date.now()));
  }catch(e){}
}
async function loadFromGAS(){
  try{
    const res=await fetch(GAS_API_URL+"?t="+Date.now(),{cache:"no-store"});
    const data=await res.json();
    if(data&&Array.isArray(data.jobs)){ALL_JOBS=data.jobs;LAST_UPDATED_AT=data.updatedAt||null;}
  }catch(e){ console.error("GAS API 取得失敗:",e);ALL_JOBS=[]; }
}

/* ====== フィルタ ====== */
function baseFilter(){
  let r=ALL_JOBS;
  // 送客NG企業を除外（電話番号チェック済みの場合のみ）
  if(NG_COMPANIES.size>0) r=r.filter(j=>!NG_COMPANIES.has(j.co));
  if(state.kw){const k=state.kw.toLowerCase();r=r.filter(j=>(j.co||"").toLowerCase().includes(k)||(j.pf||"").includes(k)||(j.ct||"").includes(k)||(j.sk||"").includes(k)||(j.gy||"").includes(k)||(j.ti||"").includes(k)||(j.id||"").includes(k)||(j.maker||"").toLowerCase().includes(k));}
  if(state.pris.size)  r=r.filter(j=>state.pris.has(j.pr));
  if(state.emps.size)  r=r.filter(j=>state.emps.has(j.emp));
  if(state.cos.size)   r=r.filter(j=>state.cos.has(j.co));
  if(state.age!==null) r=r.filter(j=>j.ag>=state.age);
  if(state.gender)     r=r.filter(j=>j.gn==="不問"||j.gn===state.gender);
  if(state.salMin>0)   r=r.filter(j=>salVal(j)>=state.salMin);
  state.quicks.forEach(q=>{
    if(q==="dorm")       r=r.filter(j=>j.dorm==="1");
    else if(q==="free")  r=r.filter(j=>j.free===1);
    else if(q==="sub")   r=r.filter(j=>j.sub===1);
    else if(q==="bonus") r=r.filter(j=>j.bx>0);
    else if(q==="day")   r=r.filter(j=>(j.sf||"").indexOf("日勤専属")>=0);
    else if(q==="night") r=r.filter(j=>(j.sf||"").indexOf("夜勤専属")>=0);
    else if(q==="2shift") r=r.filter(j=>(j.sf||"").indexOf("2交代")>=0);
  });
  return r;
}
function filterJobs(){ let r=baseFilter();if(state.prefs.size) r=r.filter(j=>state.prefs.has(j.pf));return r; }

/* ====== ソート ====== */
function sortJobs(r){
  const m=state.sort;
  if(m==="pri") r.sort((a,b)=>(+a.pr||9)-(+b.pr||9));
  else if(m==="sal_h") r.sort((a,b)=>salVal(b)-salVal(a));
  else if(m==="sal_l") r.sort((a,b)=>salVal(a)-salVal(b));
  else if(m==="bonus") r.sort((a,b)=>(b.bx||0)-(a.bx||0));
  return r;
}

function quotaBannerHtml(j){
  const hasBudget=j.budget!==null&&j.budget!==undefined;
  const hasRemain=j.remain!==null&&j.remain!==undefined;
  if(!hasBudget&&!hasRemain) return "";
  const isGroup=!!j.utGroup;
  const groupTag=isGroup?'<span class="qb-group-tag">グループ共有：'+esc(j.utGroup)+'</span>':"";
  if(!hasRemain){
    return '<div class="quota-banner qb-none'+(isGroup?" qb-group":"")+'">'
      +(isGroup?'<div class="qb-group-row">'+groupTag+'</div>':"")
      +'<div class="qb-main-row"><span class="qb-label">送客枠</span>'
      +'<span class="qb-num">残 <b>未入力</b></span>'
      +(hasBudget?'<span class="qb-total">予算'+j.budget+'</span>':"")+'</div></div>';
  }
  const remain=Number(j.remain);
  let level,label;
  if(remain<=0){level="qb-out";label=isGroup?"グループ枠切れ":"枠切れ";}
  else if(remain<=3){level="qb-low";label=isGroup?"グループ残りわずか":"残りわずか";}
  else if(remain<=10){level="qb-mid";label=isGroup?"グループ共有枠":"送客枠";}
  else{level="qb-full";label=isGroup?"グループ共有枠":"余裕あり";}
  const usedText=(isGroup&&j.utUsed!==undefined&&j.utUsed!==null)?'（使用'+j.utUsed+'）':"";
  return '<div class="quota-banner '+level+(isGroup?" qb-group":"")+'">'
    +(isGroup?'<div class="qb-group-row">'+groupTag+'</div>':"")
    +'<div class="qb-main-row"><span class="qb-label">'+label+'</span>'
    +'<span class="qb-num">残 <b>'+remain+'</b></span>'
    +(hasBudget?'<span class="qb-total">／予算'+j.budget+usedText+'</span>':"")
    +'</div></div>';
}

    $("cards").innerHTML='<div class="empty"><b>該当する求人がありません</b>条件をゆるめてください</div>';
    $("more").textContent="";$("loadMoreBtn").hidden=true;return;

/* ====== アクティブフィルタ ====== */
function updateActive(){
  const a=[];
  if(state.kw) a.push(["検索: "+state.kw,()=>{setKw("");$("kw").value="";}]);
  if(state.age!==null) a.push([state.age+"歳",()=>setAge(null)]);
  if(state.gender) a.push([state.gender,()=>setGender("")]);
  if(state.salMin>0) a.push(["給与"+state.salMin+"万〜",()=>setSal(0)]);
  state.prefs.forEach(p=>a.push([p,()=>togglePref(p)]));
  state.emps.forEach(e=>a.push([e,()=>toggleEmp(e)]));
  state.cos.forEach(co=>a.push([co,()=>toggleCo(co)]));
  state.pris.forEach(p=>a.push(["優先"+p+"位",()=>togglePri(p)]));
  const QL={dorm:"寮完備",free:"寮費無料",sub:"寮費補助あり",bonus:"祝い金あり",day:"日勤だけ",night:"夜勤だけ","2shift":"2交代"};
  state.quicks.forEach(q=>a.push([QL[q],()=>toggleQuick(q)]));
  const box=$("active");
  if(!a.length){box.innerHTML="";return;}
  box.innerHTML='<span class="af-label">適用中：</span>';
  a.forEach(([label,fn])=>{
    const el=document.createElement("span");
    el.className="af";
    el.innerHTML='<span>'+esc(label)+'</span><button aria-label="'+esc(label)+' を解除">×</button>';
    el.querySelector("button").onclick=fn;
    box.appendChild(el);
  });
}

function updateReset(){
  const on=state.kw||state.age!==null||state.gender||state.salMin>0
    ||state.prefs.size||state.pris.size||state.quicks.size||state.emps.size||state.cos.size;
  $("kwx").hidden=!state.kw;
  $("qbclear").hidden=!on;

}

  const loadMore=$("loadMoreBtn");
  const more=$("more");
  if(view==="area"){
    area.style.display="";cards.style.display="none";
    if(countBar) countBar.style.display="none";
    if(loadMore) loadMore.hidden=true;
    if(more) more.textContent="";
    if(activeBar) activeBar.style.display="none";
  } else {
    area.style.display="";cards.style.display="";
    if(countBar) countBar.style.display="";
    if(activeBar) activeBar.style.display="";
    render();
  }
}

/* ====== コンポーネント同期 ====== */
function syncAllUI(){
  // 年齢
  document.querySelectorAll(".age-sync").forEach(el=>{
    el.value=state.age===null?"":state.age;
    el.classList.toggle("set",state.age!==null);
  });
  // 性別
  document.querySelectorAll(".tab[data-g],.gender-sync").forEach(t=>{
    const on=t.dataset.g===state.gender&&state.gender!=="";
    t.classList.toggle("on",on);t.setAttribute("aria-pressed",on);
  });
  // 月収
  document.querySelectorAll(".sal-sync").forEach(el=>{
    el.value=state.salMin;el.classList.toggle("set",state.salMin>0);
  });
  const salr=$("salr");if(salr) salr.value=Math.min(46,state.salMin);
  // タイル
  ["dorm","free","sub"].forEach(q=>{
    const on=state.quicks.has(q);
    const t=$("t-"+q);if(t){t.classList.toggle("on",on);t.setAttribute("aria-pressed",on);}
  });
  // こだわり
  ["bonus","day","night","2shift"].forEach(q=>{
    const on=state.quicks.has(q);
    const c=$("q-"+q);if(c){c.classList.toggle("on",on);c.setAttribute("aria-pressed",on);}
  });
  // 優先順位・雇用形態 → renderAll で生成後に同期
  document.querySelectorAll("#pris .tab").forEach(t=>{
    const on=state.pris.has(t.dataset.p);
    t.classList.toggle("on",on);t.setAttribute("aria-pressed",on);
  });
  document.querySelectorAll("#emps .chk").forEach(c=>{
    const on=state.emps.has(c.dataset.e);
    c.classList.toggle("on",on);c.setAttribute("aria-pressed",on);
  });
  renderCoList();
}

/* ====== renderAll ====== */
function renderAll(){
  // PCサイドパネルにHTMLをセット
  $("sidePanel").innerHTML=buildFilterHTML();

  const emps={};
  ALL_JOBS.forEach(j=>{if(j.emp) emps[j.emp]=(emps[j.emp]||0)+1;});
  $("emps").innerHTML=Object.entries(emps).sort((a,b)=>b[1]-a[1]).map(([e,c])=>
    '<button class="chk" data-e="'+esc(e)+'" onclick="toggleEmp(\''+esc(e)+'\')" aria-pressed="false"><span class="chk-lab">'+esc(e)+'</span><span class="chk-c">'+c+'</span></button>'
  ).join("");
  const pris=[...new Set(ALL_JOBS.map(j=>j.pr).filter(Boolean))].sort();
  $("pris").innerHTML=pris.map(p=>
    '<button class="tab" data-p="'+esc(p)+'" onclick="togglePri(\''+esc(p)+'\')" aria-pressed="false">'+esc(p)+'位</button>'
  ).join("");
  renderCoList();renderRegions();renderPrefs();
  syncAllUI();
  _applyNow();
}

/* ====== 更新日時 ====== */
function showUpdatedDate(isLive){
  const label=isLive?"✅ ":"";
  if(!LAST_UPDATED_AT){$("hdUpdated").textContent=label+"更新日時 不明";return;}
  const d=new Date(LAST_UPDATED_AT);
  if(isNaN(d.getTime())){$("hdUpdated").textContent=label+LAST_UPDATED_AT;return;}
  const jst=new Date(d.getTime()+9*60*60*1000);
  const hh=String(jst.getUTCHours()).padStart(2,"0");
  const mm=String(jst.getUTCMinutes()).padStart(2,"0");
  $("hdUpdated").textContent=label+(jst.getUTCMonth()+1)+"月"+jst.getUTCDate()+"日 "+hh+":"+mm+" 更新";
}

/* ====== 手動更新 ====== */
async function manualRefresh(){
  if(_refreshing) return;
  _refreshing=true;
  const btn=$("hdRefreshBtn"),label=$("hdRefreshLabel");
  btn.style.opacity=".6";btn.disabled=true;
  label.textContent="確認中…";
  lbStart();
  try{
    const res=await fetch(GAS_API_URL+"?nocache=1&t="+Date.now(),{cache:"no-store"});
    const data=await res.json();
    if(data&&Array.isArray(data.jobs)&&data.jobs.length>0){
      ALL_JOBS=data.jobs;LAST_UPDATED_AT=data.updatedAt||null;
      renderAll();showUpdatedDate(true);
      label.textContent="✅ 最新です";
    } else {
      label.textContent="確認できません";
    }
    sessionStorage.setItem("jc_last_check",String(Date.now()));
  }catch{
    label.textContent="確認できません";
  }finally{
    btn.style.opacity="";btn.disabled=false;
    _refreshing=false;lbDone();
    setTimeout(()=>{label.textContent="⟳ 更新";},2500);
  }
}

/* ====== 雇用形態・会社 ====== */
function renderCoList(){
  const coListEl=$("cos");if(!coListEl) return;
  const q=($("coSearch")?$("coSearch").value:"").trim().toLowerCase();
  const m={};ALL_JOBS.forEach(j=>{if(j.co) m[j.co]=(m[j.co]||0)+1;});
  const list=Object.entries(m).sort((a,b)=>b[1]-a[1]).filter(([co])=>!q||co.toLowerCase().includes(q));
  coListEl.innerHTML=list.map(([co,n])=>
    '<button class="chk'+(state.cos.has(co)?" on":"")
    +'" data-co="'+esc(co)+'" onclick="toggleCo(\''+esc(co)+'\')" aria-pressed="'+state.cos.has(co)+'"><span class="chk-lab">'+esc(co)+'</span><span class="chk-c">'+n+'</span></button>'
  ).join("")||'<div class="hint">一致する会社がありません</div>';
}

/* ====== apply ====== */
let _applyTimer=null;
function apply(){ if(_applyTimer) clearTimeout(_applyTimer);_applyTimer=setTimeout(_applyNow,30); }
function _applyNow(){
  displayCount=PAGE_SIZE;
  filtered=sortJobs(filterJobs());
  render();updateCounts();updateActive();updateReset();
}

/* ====== 操作 ====== */
function setKw(v){state.kw=v.trim();apply();}
function onAge(v){
  const n=parseInt(v,10);
  state.age=(isNaN(n)||n<=0)?null:n;
  document.querySelectorAll(".age-sync").forEach(el=>{if(document.activeElement!==el)el.value=state.age===null?"":state.age;});
  syncAge();apply();
}
function setAge(n){
  state.age=n;
  document.querySelectorAll(".age-sync").forEach(el=>{el.value=n===null?"":n;});
  syncAge();apply();
}
function ageStep(d){const n=(state.age===null?40:state.age)+d;if(n>=15&&n<=80)setAge(n);}
function syncAge(){document.querySelectorAll(".age-sync").forEach(el=>el.classList.toggle("set",state.age!==null));}
function setGender(g){
  state.gender=(state.gender===g)?"":g;
  document.querySelectorAll(".tab[data-g],.gender-sync").forEach(t=>{
    const on=t.dataset.g===state.gender&&state.gender!=="";
    t.classList.toggle("on",on);t.setAttribute("aria-pressed",on);
  });
  apply();
}
function setSal(v){
  const n=Math.max(0,parseFloat(v)||0);
  state.salMin=n;
  document.querySelectorAll(".sal-sync").forEach(el=>{if(document.activeElement!==el)el.value=n;});
  const salr=$("salr");if(salr) salr.value=Math.min(46,n);
  document.querySelectorAll(".sal-sync").forEach(el=>el.classList.toggle("set",n>0));
  apply();
}
function toggleQuick(q){
  state.quicks.has(q)?state.quicks.delete(q):state.quicks.add(q);
  const on=state.quicks.has(q);
  const tile=$("t-"+q),chk=$("q-"+q);
  if(tile){tile.classList.toggle("on",on);tile.setAttribute("aria-pressed",on);}
  if(chk){chk.classList.toggle("on",on);chk.setAttribute("aria-pressed",on);}
  apply();
}
function togglePri(p){
  state.pris.has(p)?state.pris.delete(p):state.pris.add(p);
  document.querySelectorAll("#pris .tab").forEach(t=>{
    const on=state.pris.has(t.dataset.p);
    t.classList.toggle("on",on);t.setAttribute("aria-pressed",on);
  });
  apply();
}
function toggleEmp(e){
  state.emps.has(e)?state.emps.delete(e):state.emps.add(e);
  document.querySelectorAll("#emps .chk").forEach(c=>{
    const on=state.emps.has(c.dataset.e);
    c.classList.toggle("on",on);c.setAttribute("aria-pressed",on);
  });
  apply();
}
function toggleCo(co){state.cos.has(co)?state.cos.delete(co):state.cos.add(co);renderCoList();apply();}
function selectRegion(r){state.region=(state.region===r)?"":r;renderRegions();renderPrefs();apply();}
function togglePref(p){state.prefs.has(p)?state.prefs.delete(p):state.prefs.add(p);renderRegions();renderPrefs();apply();}
function setSort(v){state.sort=v;apply();}
function toggleDet(btn){
  const d=btn.closest(".card").querySelector(".det");
  d.classList.toggle("open");btn.setAttribute("aria-expanded",d.classList.contains("open"));
}
function copyId(btn,id){
  navigator.clipboard.writeText(id).then(()=>{
    btn.classList.add("ok");btn.textContent="#"+id+" ✓";
    setTimeout(()=>{btn.classList.remove("ok");btn.textContent="#"+id+" コピー";},1500);
  });
}

/* ====== クリア ====== */
function clearTiles(){["dorm","free","sub"].forEach(q=>{state.quicks.delete(q);const t=$("t-"+q);if(t){t.classList.remove("on");t.setAttribute("aria-pressed","false");}});apply();}
function clearQuicks(){
  state.quicks.clear();
  ["dorm","free","sub","bonus","day","night","2shift"].forEach(q=>{
    const t=$("t-"+q),c=$("q-"+q);
    if(t){t.classList.remove("on");t.setAttribute("aria-pressed","false");}
    if(c){c.classList.remove("on");c.setAttribute("aria-pressed","false");}
  });
  apply();
}
function clearPris(){state.pris.clear();document.querySelectorAll("#pris .tab").forEach(t=>{t.classList.remove("on");t.setAttribute("aria-pressed","false");});apply();}
function clearEmps(){state.emps.clear();document.querySelectorAll("#emps .chk").forEach(c=>{c.classList.remove("on");c.setAttribute("aria-pressed","false");});apply();}
function clearCos(){state.cos.clear();if($("coSearch")) $("coSearch").value="";renderCoList();apply();}
function resetAll(){
  state.kw="";state.age=null;state.gender="";state.salMin=0;
  state.prefs.clear();state.pris.clear();state.quicks.clear();state.emps.clear();state.cos.clear();
  state.sort="pri";state.region="";
  $("kw").value="";const salr=$("salr");if(salr) salr.value=0;$("sort").value="pri";
  if($("coSearch")) $("coSearch").value="";
  document.querySelectorAll(".age-sync").forEach(el=>el.value="");
  document.querySelectorAll(".gender-sync").forEach(t=>{t.classList.remove("on");t.setAttribute("aria-pressed","false");});
  document.querySelectorAll(".sal-sync").forEach(el=>{el.value=0;el.classList.remove("set");});
  syncAge();renderCoList();renderRegions();renderPrefs();
  apply();
}

/* ====== 起動 ====== */
registerSW();
loadInitialData();
</script>
