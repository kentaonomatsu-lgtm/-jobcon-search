<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JCSearch｜ジョブコン求人サーチ</title>
<style>
:root{
  --bg:#f0f9f1;--card:#fff;--ink:#1a2e1c;--sub:#5c6b5e;--line:#d7e8d9;
  --pri:#1e9e42;--pri-bg:#e9fbec;
  --grn:#047857;--grn-bg:#ecfdf5;
  --or:#c2410c;--or-bg:#fff7ed;
  --ylw:#92400e;--ylw-bg:#fffbeb;
  --red:#d92b2b;--red-bg:#fef2f2;
  --gry-bg:#f1f5f1;--hd:#fff;--hdink:#1a2e1c;
  --r:12px;--sh:0 1px 2px rgba(26,46,28,.06),0 1px 3px rgba(26,46,28,.1);
  --fs:15px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{font-family:"Yu Gothic","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.6;-webkit-text-size-adjust:100%;}
button,input,select{font-family:inherit;font-size:inherit;}
button{cursor:pointer;}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px;border-radius:4px;}

/* ===== ヘッダー ===== */
header{position:sticky;top:0;z-index:50;background:var(--hd);padding:9px 18px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--pri);box-shadow:0 2px 8px rgba(26,46,28,.08);flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:9px;flex:none;}
.brand-icon{width:42px;height:42px;border-radius:50%;border:2px solid var(--pri);object-fit:cover;background:var(--pri-bg);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;}
.logo{color:var(--hdink);font-weight:800;font-size:17px;letter-spacing:.02em;white-space:nowrap;}
.logo span{color:var(--pri);}
.hd-meta{font-size:11px;color:var(--sub);font-weight:700;white-space:nowrap;}
.hd-meta-row{display:flex;align-items:center;gap:8px;margin-top:2px;}
.hd-refresh{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 10px;border:1.5px solid var(--pri);background:var(--pri-bg);color:var(--pri);border-radius:20px;font-weight:800;font-size:11px;cursor:pointer;white-space:nowrap;transition:.15s;}
.hd-refresh:hover{background:var(--pri);color:#fff;}
.hd-refresh:active{transform:scale(.96);}
.hd-refresh.checking .hd-refresh-ic{display:inline-block;animation:spin .7s linear infinite;}
.hd-refresh.latest{border-color:#059669;background:#ecfdf5;color:#059669;}
.hd-refresh-ic{font-size:13px;line-height:1;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.search-wrap{flex:1;position:relative;max-width:560px;min-width:180px;}
.search{width:100%;min-height:44px;padding:0 40px 0 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:#fff;}
.search:focus{outline:2px solid var(--pri);border-color:var(--pri);}
.search-x{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:#6b7280;font-size:20px;line-height:1;min-width:36px;min-height:36px;}
.hd-cnt{color:var(--hdink);font-size:14px;font-weight:700;white-space:nowrap;background:var(--pri-bg);border:1px solid #bfe8c6;padding:6px 12px;border-radius:20px;}
.hd-cnt b{color:var(--pri);font-size:19px;}
.hd-reset{background:var(--red);color:#fff;border:0;min-height:44px;padding:0 16px;border-radius:10px;font-weight:800;font-size:14px;white-space:nowrap;}
.hd-reset[hidden]{display:none;}

/* ===== クイックバー ===== */
.qbar{position:sticky;top:68px;z-index:49;background:#fff;border-bottom:2px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 2px 6px rgba(17,24,39,.06);}
.qb-grp{display:flex;align-items:center;gap:7px;}
.qb-lab{font-size:11.5px;font-weight:800;color:var(--sub);white-space:nowrap;}
.qb-age{width:60px;height:40px;text-align:center;font-size:16px;font-weight:800;border:2px solid var(--line);border-radius:9px;}
.qb-age.set{background:var(--ylw-bg);border-color:#f59e0b;color:var(--ylw);}
.qb-gbtn{min-height:40px;padding:0 13px;border:2px solid var(--line);background:#fff;border-radius:9px;font-size:13px;font-weight:800;color:var(--sub);}
.qb-gbtn.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.qb-sal{width:58px;height:40px;text-align:center;font-size:16px;font-weight:800;border:2px solid var(--line);border-radius:9px;}
.qb-sal.set{background:var(--grn-bg);border-color:#10b981;color:var(--grn);}
.qb-clear{min-height:40px;padding:0 14px;border:2px solid var(--red);background:#fff;color:var(--red);border-radius:9px;font-size:12.5px;font-weight:800;margin-left:auto;}
.qb-clear[hidden]{display:none;}
.qb-result{font-size:12.5px;color:var(--sub);font-weight:700;white-space:nowrap;}
.qb-result b{font-size:16px;color:var(--ink);}
mark.hit{background:#fef08a;color:inherit;padding:0 1px;border-radius:2px;font-weight:800;}

/* ===== レイアウト ===== */
.wrap{display:flex;align-items:flex-start;gap:14px;padding:14px;max-width:1500px;margin:0 auto;}
.side{width:300px;flex:none;position:sticky;top:116px;max-height:calc(100vh - 130px);overflow-y:auto;display:flex;flex-direction:column;gap:13px;padding-bottom:4px;}
.main{flex:1;min-width:0;}

/* ===== サイドパネル ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);}
.panel-t{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;}
.panel-t .lnk{font-size:12px;color:var(--pri);cursor:pointer;font-weight:700;background:none;border:0;text-decoration:underline;}
.panel.dorm{background:var(--or-bg);border:2px solid #fb923c;}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.tiles3{grid-template-columns:1fr 1fr 1fr;}
.tiles3 .t-l{font-size:12px;}
.tiles3 .t-c{font-size:16px;}
.tile{background:#fff;border:2px solid var(--line);border-radius:10px;min-height:66px;padding:9px 7px;text-align:center;transition:.12s;cursor:pointer;}
.tile.on{background:var(--or);border-color:var(--or);}
.tile.on .t-l,.tile.on .t-c{color:#fff;}
.tile.on .t-l::before{content:"✓ ";}
.t-l{font-size:13px;font-weight:800;color:#9a3412;}
.t-c{font-size:19px;font-weight:800;color:var(--or);}
.age-row{display:flex;gap:7px;align-items:center;}
.age-btn{width:48px;height:48px;border:2px solid var(--line);background:var(--gry-bg);border-radius:10px;font-size:24px;font-weight:800;color:var(--sub);flex:none;}
.age-in{flex:1;min-width:0;height:48px;text-align:center;font-size:21px;font-weight:800;border:2px solid var(--line);border-radius:10px;padding:0 4px;}
.age-in.set{background:var(--ylw-bg);border-color:#f59e0b;color:var(--ylw);}
.hint{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.5;}
.tabs{display:flex;gap:6px;}
.tab{flex:1;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:15px;font-weight:800;color:var(--sub);text-align:center;}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.tab.on::before{content:"✓ ";}
.sal-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.sal-in{width:80px;height:48px;text-align:center;font-size:21px;font-weight:800;border:2px solid var(--line);border-radius:10px;}
.sal-in.set{background:var(--grn-bg);border-color:#10b981;color:var(--grn);}
.sal-u{font-size:14px;color:var(--sub);font-weight:800;}
input[type=range]{width:100%;-webkit-appearance:none;height:8px;background:var(--line);border-radius:4px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--grn);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);}
.checks{display:flex;flex-direction:column;gap:6px;}
.co-search{width:100%;height:44px;border:2px solid var(--line);border-radius:9px;font-size:14px;font-weight:700;padding:0 12px;margin-bottom:9px;}
.co-list{max-height:280px;overflow-y:auto;padding-right:2px;}
.chk{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 13px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:15px;font-weight:800;color:#374151;cursor:pointer;}
.chk.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.chk.on .chk-lab::before{content:"✓ ";}
.chk-c{font-size:12px;font-weight:800;color:var(--sub);background:var(--gry-bg);padding:3px 8px;border-radius:20px;}
.chk.on .chk-c{background:rgba(255,255,255,.25);color:#fff;}

/* ===== エリア ===== */
.area{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--sh);margin-bottom:12px;}
.regions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px;}
.reg{min-height:40px;padding:0 14px;border:2px solid var(--line);background:#fff;border-radius:20px;font-size:13px;font-weight:800;color:#374151;cursor:pointer;}
.reg.act{background:var(--pri);border-color:var(--pri);color:#fff;}
.reg.has{border-color:var(--pri);color:var(--pri);background:var(--pri-bg);}
.reg b{font-size:11px;opacity:.75;margin-left:4px;}
.prefs{display:flex;flex-wrap:wrap;gap:6px;padding-top:9px;border-top:2px dashed var(--line);}
.prefs:empty{display:none;}
.pref{min-height:40px;padding:0 12px;border:2px solid var(--line);background:var(--gry-bg);border-radius:9px;font-size:13px;font-weight:800;color:#374151;cursor:pointer;}
.pref.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.pref.on::before{content:"✓ ";}
.pref b{font-size:10.5px;opacity:.7;margin-left:3px;}
.area-hint{font-size:12.5px;color:var(--sub);}

/* ===== アクティブフィルタ ===== */
.active{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:11px;}
.active:empty{display:none;}
.af-lab{font-size:12px;font-weight:800;color:var(--sub);}
.af{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--pri);color:var(--pri);min-height:36px;padding:0 5px 0 12px;border-radius:20px;font-size:13px;font-weight:800;box-shadow:var(--sh);}
.af button{background:none;border:0;color:var(--pri);font-weight:800;font-size:17px;min-width:30px;min-height:30px;line-height:1;}
.af button:hover{color:var(--red);}

/* ===== ツールバー ===== */
.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 13px;box-shadow:var(--sh);margin-bottom:12px;}
.bar-cnt{font-size:14px;font-weight:700;color:var(--sub);}
.bar-cnt b{font-size:20px;color:var(--ink);font-weight:800;}
.bar-sp{flex:1;}
.btn{min-height:42px;padding:0 14px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:13px;font-weight:800;color:#374151;}
select.btn{padding:0 10px;}

/* ===== カード ===== */
.cards{display:flex;flex-direction:column;gap:10px;}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid #cbd5e1;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
.c-top{display:flex;gap:14px;padding:13px 15px;align-items:flex-start;}
.c-l{flex:1;min-width:0;}
.c-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
.c-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px;}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:6px;}
.badge.pri{background:var(--gry-bg);color:var(--sub);border:1px solid var(--line);}
.c-co{font-size:17px;font-weight:800;line-height:1.35;}
.c-ti{font-size:13px;color:#4b5563;margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
.sal{background:var(--grn-bg);border:2px solid #6ee7b7;border-radius:11px;padding:7px 13px;text-align:right;min-width:145px;}
.sal-tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;margin-bottom:2px;}
.sal-tag.h{background:#0e7490;color:#fff;}
.sal-tag.m{background:#047857;color:#fff;}
.sal-n{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
.sal-un{font-size:13px;font-weight:800;}
.sal-sub{font-size:12px;color:#065f46;font-weight:800;margin-top:2px;white-space:nowrap;}
.sal-main{display:flex;align-items:baseline;justify-content:flex-end;gap:2px;color:var(--grn);}
.c-id{font-size:13px;font-weight:800;color:var(--sub);background:var(--gry-bg);border:2px solid var(--line);min-height:38px;padding:0 11px;border-radius:8px;white-space:nowrap;cursor:pointer;}
.c-id.ok{background:#059669;border-color:#059669;color:#fff;}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.pill{font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:14px;white-space:nowrap;}
.pill.loc{background:var(--pri-bg);color:var(--pri);}
.pill.age{background:var(--ylw-bg);color:var(--ylw);}
.pill.age.ng{background:var(--red-bg);color:var(--red);border:2px solid #fca5a5;}
.pill.gen{background:var(--pri-bg);color:var(--pri);}
.pill.dorm{background:var(--grn-bg);color:var(--grn);}
.pill.free{background:var(--or);color:#fff;}
.pill.sub{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;}
.pill.bx{background:var(--or-bg);color:var(--or);border:1px solid #fdba74;}
.pill.sf,.pill.emp{background:var(--gry-bg);color:#374151;}
.c-meta{font-size:12px;color:#6b7280;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.c-foot{display:flex;gap:8px;align-items:center;padding:0 15px 12px;flex-wrap:wrap;}
.c-btn{min-height:40px;padding:0 14px;border:2px solid var(--line);background:#fff;border-radius:9px;font-size:13px;font-weight:800;color:#374151;display:inline-flex;align-items:center;text-decoration:none;}
.c-btn.go{background:var(--pri);border-color:var(--pri);color:#fff;}
.c-maker{display:inline-flex;align-items:center;font-size:12.5px;font-weight:800;color:var(--sub);background:var(--gry-bg);border:1.5px solid var(--line);border-radius:9px;padding:0 11px;min-height:40px;white-space:nowrap;}
.det{display:none;padding:12px 15px;background:var(--gry-bg);border-top:1px solid var(--line);font-size:13.5px;line-height:1.7;}
.det.open{display:block;}
.det dt{font-size:11.5px;font-weight:800;color:var(--sub);margin-top:8px;}
.det dt:first-child{margin-top:0;}
.det dd{color:#374151;}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:46px 20px;text-align:center;color:var(--sub);}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px;}
.more{text-align:center;padding:14px;color:var(--sub);font-size:13px;font-weight:700;}

/* ===== 送客枠バナー ===== */
.quota-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;margin:0 0 10px;border-radius:10px;font-weight:900;}
.quota-banner.qb-group{display:block;border:2px dashed rgba(255,255,255,.7);}
.quota-banner.qb-group.qb-mid,.quota-banner.qb-group.qb-none{border-color:rgba(0,0,0,.25);}
.qb-group-row{margin:0 0 4px;}
.qb-group-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.02em;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.28);}
.quota-banner.qb-group.qb-mid .qb-group-tag,.quota-banner.qb-group.qb-none .qb-group-tag{background:rgba(0,0,0,.08);}
.qb-main-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.quota-banner .qb-label{font-size:12.5px;opacity:.85;}
.quota-banner .qb-num{font-size:20px;line-height:1;}
.quota-banner .qb-num b{font-size:26px;margin:0 2px;}
.quota-banner .qb-total{font-size:12.5px;opacity:.85;}
.qb-out{background:var(--red);color:#fff;}
.qb-low{background:var(--or);color:#fff;}
.qb-mid{background:#fde68a;color:#7c4a03;}
.qb-full{background:var(--grn);color:#fff;}
.qb-none{background:var(--gry-bg);color:#6b7280;}

/* ===== 給与バナー ===== */
.sal-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;margin:0 0 10px;border-radius:10px;font-weight:900;}
.sal-banner .sb-label{font-size:12.5px;opacity:.85;}
.sal-banner .sb-num{font-size:20px;line-height:1;}
.sal-banner .sb-num b{font-size:26px;margin:0 2px;}
.sal-banner .sb-sub{font-size:12.5px;opacity:.85;}
.sb-m{background:var(--grn-bg);color:var(--grn);border:2px solid #6ee7b7;}
.sb-h{background:#e0f2fe;color:#0e7490;border:2px solid #7dd3fc;}

/* ===== スケルトン（初期表示） ===== */
@keyframes shimmer{0%{background-position:-800px 0}100%{background-position:800px 0}}
.skel{background:linear-gradient(90deg,#e8f5ea 25%,#f0f9f1 50%,#e8f5ea 75%);background-size:800px 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
.skel-card{background:var(--card);border:1px solid var(--line);border-left:6px solid #cbd5e1;border-radius:var(--r);padding:16px;box-shadow:var(--sh);}
.skel-line{height:14px;margin-bottom:8px;}
.skel-line.w80{width:80%;}
.skel-line.w60{width:60%;}
.skel-line.w40{width:40%;}

/* ===== ローディングバー（上部） ===== */
#loadbar{position:fixed;top:0;left:0;height:3px;background:var(--pri);z-index:9999;transition:width .3s ease,opacity .5s ease;width:0;opacity:1;}
#loadbar.done{width:100%;opacity:0;}

/* ===== モバイル ===== */
@media(max-width:900px){
  .qbar{top:60px;padding:8px 10px;gap:8px 10px;}
  .qb-result{width:100%;order:-1;}
  header{flex-wrap:wrap;padding:9px 12px;gap:8px;}
  .logo{font-size:15px;}
  .search-wrap{order:4;flex-basis:100%;max-width:none;}
  .wrap{flex-direction:column;align-items:stretch;padding:10px;gap:10px;}
  .main{width:100%;}
  .side{width:100%;position:static;max-height:none;}
  .side.hide{display:none;}
  .side-toggle{display:block;width:100%;min-height:48px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);font-weight:800;font-size:14px;box-shadow:var(--sh);}
  .c-top{flex-direction:column;gap:10px;}
  .c-r{flex-direction:row;align-items:center;width:100%;justify-content:space-between;}
  .sal{min-width:0;flex:1;text-align:left;}
  .sal-main{justify-content:flex-start;}
}
@media(min-width:901px){.side-toggle{display:none;}}
ruby{ruby-position:over;}
ruby rt{font-size:58%;opacity:.85;font-weight:700;letter-spacing:0;}
</style>
</head>
<body>

<div id="loadbar"></div>

<header>
  <div class="brand">
    <div class="brand-icon">🔍</div>
    <div>
      <div class="logo">ジョブコン<span>サーチ</span></div>
      <div class="hd-meta-row">
        <span class="hd-meta" id="hdUpdated">読み込み中…</span>
        <button class="hd-refresh" id="hdRefreshBtn" onclick="manualRefresh()" aria-label="最新求人を確認する">
          <span class="hd-refresh-ic">⟳</span><span id="hdRefreshLabel">最新に更新</span>
        </button>
      </div>
    </div>
  </div>
  <div class="search-wrap">
    <input class="search" id="kw" type="search" placeholder="社名・地域・職種・案件IDで検索" aria-label="キーワード検索" oninput="setKw(this.value)">
    <button class="search-x" id="kwx" aria-label="検索をクリア" onclick="setKw('');document.getElementById('kw').value='';" hidden>&times;</button>
  </div>
  <div class="hd-cnt" aria-live="polite"><b id="hc">-</b> / <span id="ht">-</span>件</div>
  <button class="hd-reset" id="hr" onclick="resetAll()" hidden>すべてクリア</button>
</header>

<div class="qbar" aria-label="よく使う絞り込み">
  <div class="qb-grp">
    <span class="qb-lab">年齢</span>
    <input class="qb-age age-sync" type="number" inputmode="numeric" placeholder="45" aria-label="求職者の年齢" oninput="onAge(this.value)">
    <span class="qb-lab">歳〜</span>

<script>
/* ====== 設定 ====== */
// data.json は同じリポジトリのルートに置く（GitHub Pages用）
const DATA_JSON_URL = "./data.json";
// GAS API は「最新に更新」ボタン押下時のみ使用（通常表示には不使用）
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyDO5dsR1BlXNIIOHTWR21NeVtD91sq-1HREiL9aVQmZZGc-9oK8rbLixZ6PmJAVyY7hw/exec";
const HOURS = 173;
const PAGE_SIZE = 50;
// Service Worker キャッシュ名（更新時はバージョンを上げる）
const SW_CACHE = "jcsearch-v1";

const REGIONS = {
  "北海道・東北":["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県"],
  "関東":["東京都","神奈川県","埼玉県","千葉県","茨城県","栃木県","群馬県"],
  "甲信越・北陸":["新潟県","富山県","石川県","福井県","山梨県","長野県"],
  "東海":["愛知県","岐阜県","静岡県","三重県"],
  "近畿":["大阪府","兵庫県","京都府","滋賀県","奈良県","和歌山県"],
  "中国":["鳥取県","島根県","岡山県","広島県","山口県"],
  "四国":["徳島県","香川県","愛媛県","高知県"],
  "九州・沖縄":["福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"]
};

const KANA_PREF={"北海道":"ほっかいどう","青森県":"あおもりけん","岩手県":"いわてけん","宮城県":"みやぎけん","秋田県":"あきたけん","山形県":"やまがたけん","福島県":"ふくしまけん","茨城県":"いばらきけん","栃木県":"とちぎけん","群馬県":"ぐんまけん","埼玉県":"さいたまけん","千葉県":"ちばけん","東京都":"とうきょうと","神奈川県":"かながわけん","新潟県":"にいがたけん","富山県":"とやまけん","石川県":"いしかわけん","福井県":"ふくいけん","山梨県":"やまなしけん","長野県":"ながのけん","岐阜県":"ぎふけん","静岡県":"しずおかけん","愛知県":"あいちけん","三重県":"みえけん","滋賀県":"しがけん","京都府":"きょうとふ","大阪府":"おおさかふ","兵庫県":"ひょうごけん","奈良県":"ならけん","和歌山県":"わかやまけん","鳥取県":"とっとりけん","島根県":"しまねけん","岡山県":"おかやまけん","広島県":"ひろしまけん","山口県":"やまぐちけん","徳島県":"とくしまけん","香川県":"かがわけん","愛媛県":"えひめけん","高知県":"こうちけん","福岡県":"ふくおかけん","佐賀県":"さがけん","長崎県":"ながさきけん","熊本県":"くまもとけん","大分県":"おおいたけん","宮崎県":"みやざきけん","鹿児島県":"かごしまけん","沖縄県":"おきなわけん"};

/* ====== グローバル変数 ====== */
let ALL_JOBS = [];
let LAST_UPDATED_AT = null;
let filtered = [];
let displayCount = PAGE_SIZE;
let _refreshing = false;

const state = {
  kw:"", age:null, gender:"", salMin:0,
  prefs:new Set(), pris:new Set(), quicks:new Set(), emps:new Set(), cos:new Set(),
  sort:"pri", region:""
};

/* ====== ユーティリティ ====== */
const $ = id => document.getElementById(id);
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function escMark(text){
  const t = esc(text);
  const kw = state.kw.trim();
  if(!kw) return t;
  const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  return t.replace(re, m=>'<mark class="hit">'+m+'</mark>');
}
function toHourly(sl){ return Math.round(sl*10000/HOURS); }
function kanaPref(pf){ return KANA_PREF[pf]||""; }
function rubyP(pf){ const k=kanaPref(pf); return k?'<ruby>'+esc(pf)+'<rt>'+esc(k)+'</rt></ruby>':esc(pf); }

/* ====== ローディングバー ====== */
let _lbTimer = null;
function lbStart(){
  const b = $("loadbar");
  b.style.width="0"; b.style.opacity="1";
  b.style.transition="width 2s ease";
  requestAnimationFrame(()=>{ b.style.width="80%"; });
}
function lbDone(){
  const b = $("loadbar");
  b.style.transition="width .2s ease,opacity .5s ease .2s";
  b.style.width="100%";
  setTimeout(()=>{ b.style.opacity="0"; }, 300);
}

/* ====== Service Worker 登録 ====== */
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

/* ====== データ取得（2段階：静的JSON → GAS差分更新） ====== */
async function loadInitialData(){
  lbStart();
  try{
    // Step1: 静的JSONを即時取得（GitHub PagesのCDNから高速配信）
    const res = await fetch(DATA_JSON_URL, {cache:"force-cache"});
    if(!res.ok) throw new Error("data.json fetch failed");
    const data = await res.json();
    if(data && Array.isArray(data.jobs)){
      ALL_JOBS = data.jobs;
      LAST_UPDATED_AT = data.updatedAt || null;
      renderAll();
      showUpdatedDate();
      lbDone();
      // Step2: バックグラウンドでGAS APIから最新差分を確認（非ブロッキング）
      setTimeout(checkGasUpdate, 100);
    }
  }catch(e){
    console.warn("data.json 読み込み失敗、GAS APIにフォールバック:", e);
    await loadFromGAS();
    lbDone();
  }
}

async function checkGasUpdate(){
  // GASキャッシュが10分以内なら再取得しない（サーバー負荷軽減）
  const lastCheck = sessionStorage.getItem("jc_last_check");
  if(lastCheck && Date.now() - Number(lastCheck) < 10 * 60 * 1000) return;
  try{
    const res = await fetch(GAS_API_URL, {cache:"no-store"});
    const data = await res.json();
    if(data && Array.isArray(data.jobs) && data.jobs.length > 0){
      // データが新しければ更新
      if(!LAST_UPDATED_AT || data.updatedAt > LAST_UPDATED_AT){
        ALL_JOBS = data.jobs;
        LAST_UPDATED_AT = data.updatedAt || null;
        renderAll();
        showUpdatedDate(true); // 「最新」表示
      }
    }
    sessionStorage.setItem("jc_last_check", String(Date.now()));
  }catch(e){
    // バックグラウンド更新失敗はサイレント
  }
}

async function loadFromGAS(){
  try{
    const res = await fetch(GAS_API_URL+"?t="+Date.now(), {cache:"no-store"});
    const data = await res.json();
    if(data && Array.isArray(data.jobs)){
      ALL_JOBS = data.jobs;
      LAST_UPDATED_AT = data.updatedAt || null;
    }
  }catch(e){
    console.error("GAS API 取得失敗:", e);
    ALL_JOBS = [];
  }
}

/* ====== フィルタ ====== */
function baseFilter(){
  let r = ALL_JOBS;
  if(state.kw){
    const k=state.kw.toLowerCase();
    r=r.filter(j=>(j.co||"").toLowerCase().includes(k)||(j.pf||"").includes(k)||(j.ct||"").includes(k)
      ||(j.sk||"").includes(k)||(j.gy||"").includes(k)||(j.ti||"").includes(k)||(j.id||"").includes(k)
      ||(j.maker||"").toLowerCase().includes(k));
  }
  if(state.pris.size)  r=r.filter(j=>state.pris.has(j.pr));
  if(state.emps.size)  r=r.filter(j=>state.emps.has(j.emp));
  if(state.cos.size)   r=r.filter(j=>state.cos.has(j.co));
  if(state.age!==null) r=r.filter(j=>j.ag>=state.age);
  if(state.gender)     r=r.filter(j=>j.gn==="不問"||j.gn===state.gender);
  if(state.salMin>0)   r=r.filter(j=>j.sl>=state.salMin);
  state.quicks.forEach(q=>{
    if(q==="dorm")        r=r.filter(j=>j.dorm==="1");
    else if(q==="free")   r=r.filter(j=>j.free===1);
    else if(q==="sub")    r=r.filter(j=>j.sub===1);
    else if(q==="bonus")  r=r.filter(j=>j.bx>0);
    else if(q==="day")    r=r.filter(j=>(j.sf||"").indexOf("日勤専属")>=0);
    else if(q==="night")  r=r.filter(j=>(j.sf||"").indexOf("夜勤専属")>=0);
    else if(q==="2shift") r=r.filter(j=>(j.sf||"").indexOf("2交代")>=0);
  });
  return r;
}
function filterJobs(){
  let r = baseFilter();
  if(state.prefs.size) r=r.filter(j=>state.prefs.has(j.pf));
  return r;
}

/* ====== ソート ====== */
function sortJobs(r){
  const m=state.sort;
  if(m==="pri") r.sort((a,b)=>(+a.pr||9)-(+b.pr||9));
  else if(m==="sal_h") r.sort((a,b)=>(b.sl||0)-(a.sl||0));
  else if(m==="sal_l") r.sort((a,b)=>(a.sl||0)-(b.sl||0));
  else if(m==="bonus") r.sort((a,b)=>(b.bx||0)-(a.bx||0));
  return r;
}

/* ====== HTML生成 ====== */
function pillsHtml(j){
  const ageNG = state.age!==null && j.ag < state.age;
  let p="";
  if(j.pf) p+='<span class="pill loc">'+rubyP(j.pf)+(j.ct?" "+esc(j.ct):"")+'</span>';
  if(j.ag) p+='<span class="pill age'+(ageNG?' ng':'')+'">〜'+j.ag+'歳'+(ageNG?'（対象外）':'')+'</span>';
  if(j.gn) p+='<span class="pill gen">'+esc(j.gn)+'</span>';
  if(j.free===1) p+='<span class="pill free">寮費無料</span>';
  else if(j.sub===1) p+='<span class="pill sub">寮費補助あり</span>';
  else if(j.dorm==="1") p+='<span class="pill dorm">寮完備</span>';
  if(j.bx>0) p+='<span class="pill bx">祝い金'+j.bx+'万</span>';
  if(j.sf) p+='<span class="pill sf">'+esc(j.sf)+'</span>';
  if(j.emp) p+='<span class="pill emp">'+esc(j.emp)+'</span>';
  return p;
}

function salBlock(j){
  if(j.wt==="時給例" && j.hr>0){
    return '<div class="sal"><span class="sal-tag h">時給例</span>'
      +'<div class="sal-main"><span class="sal-n">'+j.hr.toLocaleString()+'</span><span class="sal-un">円</span></div>'
      +'<div class="sal-sub">月収にすると 約'+j.sl.toFixed(1).replace(/\.0$/,"")+'万円</div></div>';
  }
  if(j.sl>0){
    return '<div class="sal"><span class="sal-tag m">月収例</span>'
      +'<div class="sal-main"><span class="sal-n">'+j.sl.toFixed(1).replace(/\.0$/,"")+'</span><span class="sal-un">万円</span></div>'
      +'<div class="sal-sub">時給にすると 約'+toHourly(j.sl).toLocaleString()+'円</div></div>';
  }
  return "";
}

function salBannerHtml(j){
  if(j.wt==="時給例" && j.hr>0){
    return '<div class="sal-banner sb-h"><span class="sb-label">時給例</span>'
      +'<span class="sb-num"><b>'+j.hr.toLocaleString()+'</b>円</span>'
      +'<span class="sb-sub">月収にすると約'+j.sl.toFixed(1).replace(/\.0$/,"")+'万円</span></div>';
  }
  if(j.sl>0){
    return '<div class="sal-banner sb-m"><span class="sb-label">月収例</span>'
      +'<span class="sb-num"><b>'+j.sl.toFixed(1).replace(/\.0$/,"")+'</b>万円</span>'
      +'<span class="sb-sub">時給にすると約'+toHourly(j.sl).toLocaleString()+'円</span></div>';
  }
  return "";
}

function quotaBannerHtml(j){
  const hasBudget = j.budget!==null && j.budget!==undefined;
  const hasRemain = j.remain!==null && j.remain!==undefined;
  if(!hasBudget && !hasRemain) return "";
  const isGroup = !!j.utGroup;
  const groupTag = isGroup?'<span class="qb-group-tag">グループ共有：'+esc(j.utGroup)+'</span>':"";
  if(!hasRemain){
    return '<div class="quota-banner qb-none'+(isGroup?" qb-group":"")+'">'
      +(isGroup?'<div class="qb-group-row">'+groupTag+'</div>':"")
      +'<div class="qb-main-row"><span class="qb-label">送客枠</span>'
      +'<span class="qb-num">残 <b>未入力</b></span>'
      +'<span class="qb-total">予算'+j.budget+'</span></div></div>';
  }
  const remain = Number(j.remain);
  let level,label;
  if(remain<=0){level="qb-out";label=isGroup?"グループ枠切れ":"枠切れ";}
  else if(remain<=3){level="qb-low";label=isGroup?"グループ残りわずか":"残りわずか";}
  else if(remain<=10){level="qb-mid";label=isGroup?"グループ共有枠":"送客枠";}
  else{level="qb-full";label=isGroup?"グループ共有枠":"余裕あり";}
  const usedText=(isGroup&&j.utUsed!==undefined&&j.utUsed!==null)?'（使用'+j.utUsed+'）':"";
  return '<div class="quota-banner '+level+(isGroup?" qb-group":"")+'">'
    +(isGroup?'<div class="qb-group-row">'+groupTag+'</div>':"")
    +'<div class="qb-main-row"><span class="qb-label">'+label+'</span>'
    +'<span class="qb-num">残 <b>'+remain+'</b></span>'
    +(hasBudget?'<span class="qb-total">／予算'+j.budget+usedText+'</span>':"")
    +'</div></div>';
}

function cardHtml(j){
  const meta=[j.gy,j.sk].filter(Boolean).map(escMark).join("　/　");
  return '<div class="card">'
    +quotaBannerHtml(j)
    +salBannerHtml(j)
    +'<div class="c-top">'
      +'<div class="c-l">'
        +'<div class="c-h"><span class="badge pri">優先'+esc(j.pr||"－")+'位</span></div>'
        +'<div class="c-co">'+escMark(j.co)+'</div>'
        +(j.ti?'<div class="c-ti">'+escMark(j.ti)+'</div>':"")
        +'<div class="pills">'+pillsHtml(j)+'</div>'
        +(meta?'<div class="c-meta">'+meta+'</div>':"")
      +'</div>'
      +'<div class="c-r">'+salBlock(j)
        +'<button class="c-id" onclick="copyId(this,\''+esc(j.id)+'\')" aria-label="案件ID '+esc(j.id)+' をコピー">#'+esc(j.id)+' コピー</button>'
      +'</div>'
    +'</div>'
    +'<div class="c-foot">'
      +'<button class="c-btn" onclick="toggleDet(this)" aria-expanded="false">詳細を見る</button>'
      +(j.maker?'<span class="c-maker">勤務先：'+esc(j.maker)+'</span>':"")
      +(j.ur?'<a class="c-btn go" href="'+esc(j.ur)+'" target="_blank" rel="noopener">求人ページを開く</a>':"")
    +'</div>'
    +'<dl class="det">'
      +(j.st?'<dt>最寄り駅・交通</dt><dd>'+esc(j.st)+'</dd>':"")
      +(j.ca?'<dt>仕事内容</dt><dd>'+esc(j.ca)+'</dd>':"")
      +'<dt>案件ID / 仕事No.</dt><dd>'+esc(j.id)+'　/　'+esc(j.jn||"－")+'</dd>'
    +'</dl>'
  +'</div>';
}

/* ====== レンダリング（ページング） ====== */
function render(){
  const list = filtered.slice(0, displayCount);
  if(!list.length){
    $("cards").innerHTML='<div class="empty"><b>該当する求人がありません</b>条件をゆるめてください</div>';
    $("more").textContent="";
    $("loadMoreBtn").hidden=true;
    return;
  }
  // innerHTML一括セット（DocumentFragment より高速なケースが多い）
  $("cards").innerHTML = list.map(cardHtml).join("");
  const hasMore = filtered.length > displayCount;
  $("more").textContent = hasMore
    ? "上位 "+list.length+" 件を表示中（全 "+filtered.length.toLocaleString()+" 件）— 条件を絞るか「さらに読み込む」"
    : (filtered.length>PAGE_SIZE ? "全"+filtered.length.toLocaleString()+"件を表示中" : "");
  $("loadMoreBtn").hidden = !hasMore;
}

function loadMore(){
  displayCount += PAGE_SIZE;
  render();
}

/* ====== カウント更新 ====== */
function updateCounts(){
  const n=filtered.length, t=ALL_JOBS.length;
  $("hc").textContent=n.toLocaleString();
  $("ht").textContent=t.toLocaleString();
  $("bc").textContent=n.toLocaleString();
  $("bt").textContent=t.toLocaleString();
  $("qbc").textContent=n.toLocaleString();
  $("qbt").textContent=t.toLocaleString();
  const cnt=f=>ALL_JOBS.filter(f).length;
  $("c-dorm").textContent=cnt(j=>j.dorm==="1").toLocaleString();
  $("c-free").textContent=cnt(j=>j.free===1).toLocaleString();
  $("c-sub").textContent=cnt(j=>j.sub===1).toLocaleString();
  $("c-bonus").textContent=cnt(j=>j.bx>0);
  $("c-day").textContent=cnt(j=>(j.sf||"").indexOf("日勤専属")>=0);
  $("c-night").textContent=cnt(j=>(j.sf||"").indexOf("夜勤専属")>=0);
  $("c-2shift").textContent=cnt(j=>(j.sf||"").indexOf("2交代")>=0);
}

/* ====== アクティブフィルタ ====== */
function updateActive(){
  const a=[];
  if(state.kw) a.push(["検索: "+state.kw,()=>{setKw("");$("kw").value="";}]);
  if(state.age!==null) a.push([state.age+"歳",()=>setAge(null)]);
  if(state.gender) a.push([state.gender,()=>setGender("")]);
  if(state.salMin>0) a.push(["月収"+state.salMin+"万〜",()=>setSal(0)]);
  state.prefs.forEach(p=>a.push([p,()=>togglePref(p)]));
  state.emps.forEach(e=>a.push([e,()=>toggleEmp(e)]));
  state.cos.forEach(co=>a.push([co,()=>toggleCo(co)]));
  state.pris.forEach(p=>a.push(["優先"+p+"位",()=>togglePri(p)]));
  const QL={dorm:"寮完備",free:"寮費無料",sub:"寮費補助あり",bonus:"祝い金あり",day:"日勤だけ",night:"夜勤だけ","2shift":"2交代"};
  state.quicks.forEach(q=>a.push([QL[q],()=>toggleQuick(q)]));
  const box=$("active");
  if(!a.length){box.innerHTML="";return;}
  box.innerHTML='<span class="af-lab">適用中の条件</span>';
  a.forEach(([label,fn])=>{
    const el=document.createElement("span");
    el.className="af";
    el.innerHTML='<span>'+esc(label)+'</span><button aria-label="'+esc(label)+' を解除">&times;</button>';
    el.querySelector("button").onclick=fn;
    box.appendChild(el);
  });
}

function updateReset(){
  const on=state.kw||state.age!==null||state.gender||state.salMin>0
    ||state.prefs.size||state.pris.size||state.quicks.size||state.emps.size||state.cos.size;
  $("hr").hidden=!on;
  $("kwx").hidden=!state.kw;
  $("qbclear").hidden=!on;
}

/* ====== エリア ====== */
function renderRegions(){
  $("regs").innerHTML=Object.keys(REGIONS).map(r=>{
    const set=new Set(REGIONS[r]);
    const c=ALL_JOBS.filter(j=>set.has(j.pf)).length;
    if(!c) return "";
    const has=REGIONS[r].some(p=>state.prefs.has(p));
    const cls="reg"+(state.region===r?" act":(has?" has":""));
    return '<button class="'+cls+'" onclick="selectRegion(\''+esc(r)+'\')" aria-pressed="'+(state.region===r)+'">'+esc(r)+'<b>'+c+'</b></button>';
  }).join("");
}
function renderPrefs(){
  const r=state.region;
  const pfs=r?REGIONS[r]:[];
  $("prefs").innerHTML=pfs.map(p=>{
    const c=ALL_JOBS.filter(j=>j.pf===p).length;
    if(!c) return "";
    return '<button class="pref'+(state.prefs.has(p)?" on":"")
      +'" onclick="togglePref(\''+esc(p)+'\')" aria-pressed="'+state.prefs.has(p)+'">'+rubyP(p)+'<b>'+c+'</b></button>';
  }).join("");
  $("areahint").textContent=r?"都道府県を選んで絞り込めます":"地方ボタンを押すと都道府県が出ます";
}

/* ====== 雇用形態・会社・優先順位 ====== */
function renderCoList(){
  const q=($("coSearch").value||"").trim().toLowerCase();
  const m={};
  ALL_JOBS.forEach(j=>{if(j.co) m[j.co]=(m[j.co]||0)+1;});
  const list=Object.entries(m).sort((a,b)=>b[1]-a[1]).filter(([co])=>!q||co.toLowerCase().includes(q));
  $("cos").innerHTML=list.map(([co,n])=>
    '<button class="chk'+(state.cos.has(co)?" on":"")
    +'" data-co="'+esc(co)+'" onclick="toggleCo(\''+esc(co)+'\')" aria-pressed="'+state.cos.has(co)+'"><span class="chk-lab">'+esc(co)+'</span><span class="chk-c">'+n+'</span></button>'
  ).join("")||'<div class="hint">一致する会社がありません</div>';
}

/* ====== apply（debounce付き） ====== */
let _applyTimer=null;
function apply(){
  if(_applyTimer) clearTimeout(_applyTimer);
  _applyTimer=setTimeout(_applyNow, 30);
}
function _applyNow(){
  displayCount=PAGE_SIZE;
  filtered=sortJobs(filterJobs());
  render();
  updateCounts();
  updateActive();
  updateReset();
}

/* ====== 操作系 ====== */
function setKw(v){state.kw=v.trim();apply();}
function onAge(v){
  const n=parseInt(v,10);
  state.age=(isNaN(n)||n<=0)?null:n;
  document.querySelectorAll(".age-sync").forEach(el=>{if(document.activeElement!==el)el.value=state.age===null?"":state.age;});
  syncAge();apply();
}
function setAge(n){
  state.age=n;
  document.querySelectorAll(".age-sync").forEach(el=>{if(document.activeElement!==el)el.value=n===null?"":n;});
  syncAge();apply();
}
function ageStep(d){const n=(state.age===null?40:state.age)+d;if(n>=15&&n<=80)setAge(n);}
function syncAge(){document.querySelectorAll(".age-sync").forEach(el=>el.classList.toggle("set",state.age!==null));}
function setGender(g){
  state.gender=(state.gender===g)?"":g;
  document.querySelectorAll(".tab[data-g],.gender-sync").forEach(t=>{
    const on=t.dataset.g===state.gender&&state.gender!=="";
    t.classList.toggle("on",on);t.setAttribute("aria-pressed",on);
  });
  apply();
}
function setSal(v){
  const n=Math.max(0,parseFloat(v)||0);
  state.salMin=n;
  document.querySelectorAll(".sal-sync").forEach(el=>{if(document.activeElement!==el)el.value=n;});
  $("salr").value=Math.min(46,n);
  document.querySelectorAll(".sal-sync").forEach(el=>el.classList.toggle("set",n>0));
  apply();
}
function toggleQuick(q){
  state.quicks.has(q)?state.quicks.delete(q):state.quicks.add(q);
  const on=state.quicks.has(q);
  const tile=$("t-"+q),chk=$("q-"+q);
  if(tile){tile.classList.toggle("on",on);tile.setAttribute("aria-pressed",on);}
  if(chk){chk.classList.toggle("on",on);chk.setAttribute("aria-pressed",on);}
  apply();
}
function togglePri(p){
  state.pris.has(p)?state.pris.delete(p):state.pris.add(p);
  document.querySelectorAll("#pris .tab").forEach(t=>{
    const on=state.pris.has(t.dataset.p);
    t.classList.toggle("on",on);t.setAttribute("aria-pressed",on);
  });
  apply();
}
function toggleEmp(e){
  state.emps.has(e)?state.emps.delete(e):state.emps.add(e);
  document.querySelectorAll("#emps .chk").forEach(c=>{
    const on=state.emps.has(c.dataset.e);
    c.classList.toggle("on",on);c.setAttribute("aria-pressed",on);
  });
  apply();
}
function toggleCo(co){
  state.cos.has(co)?state.cos.delete(co):state.cos.add(co);
  renderCoList();apply();
}
function selectRegion(r){state.region=(state.region===r)?"":r;renderRegions();renderPrefs();apply();}
function togglePref(p){state.prefs.has(p)?state.prefs.delete(p):state.prefs.add(p);renderRegions();renderPrefs();apply();}
function setSort(v){state.sort=v;apply();}
function toggleDet(btn){
  const d=btn.closest(".card").querySelector(".det");
  d.classList.toggle("open");
  btn.setAttribute("aria-expanded",d.classList.contains("open"));
}
function copyId(btn,id){
  navigator.clipboard.writeText(id).then(()=>{
    btn.classList.add("ok");btn.textContent="#"+id+" ✓";
    setTimeout(()=>{btn.classList.remove("ok");btn.textContent="#"+id+" コピー";},1500);
  });
}

/* クリア系 */
function clearTiles(){["dorm","free","sub"].forEach(q=>{state.quicks.delete(q);const t=$("t-"+q);if(t){t.classList.remove("on");t.setAttribute("aria-pressed","false");}});apply();}
function clearQuicks(){state.quicks.clear();["dorm","free","sub","bonus","day","night","2shift"].forEach(q=>{const t=$("t-"+q),c=$("q-"+q);if(t){t.classList.remove("on");t.setAttribute("aria-pressed","false");}if(c){c.classList.remove("on");c.setAttribute("aria-pressed","false");}});apply();}
function clearPris(){state.pris.clear();document.querySelectorAll("#pris .tab").forEach(t=>{t.classList.remove("on");t.setAttribute("aria-pressed","false");});apply();}
function clearEmps(){state.emps.clear();document.querySelectorAll("#emps .chk").forEach(c=>{c.classList.remove("on");c.setAttribute("aria-pressed","false");});apply();}
function clearCos(){state.cos.clear();$("coSearch").value="";renderCoList();apply();}
function resetAll(){
  state.kw="";state.age=null;state.gender="";state.salMin=0;
  state.prefs.clear();state.pris.clear();state.quicks.clear();state.emps.clear();state.cos.clear();
  state.sort="pri";state.region="";
  $("kw").value="";$("salr").value=0;$("sort").value="pri";
  $("coSearch").value="";
  document.querySelectorAll(".age-sync").forEach(el=>el.value="");
  document.querySelectorAll(".gender-sync").forEach(t=>{t.classList.remove("on");t.setAttribute("aria-pressed","false");});
  document.querySelectorAll(".sal-sync").forEach(el=>{el.value=0;el.classList.remove("set");});
  syncAge();
  renderCoList();renderRegions();renderPrefs();
  apply();
}

/* ====== renderAll（データ更新後に呼ぶ） ====== */
function renderAll(){
  const emps={};
  ALL_JOBS.forEach(j=>{if(j.emp)emps[j.emp]=(emps[j.emp]||0)+1;});
  $("emps").innerHTML=Object.entries(emps).sort((a,b)=>b[1]-a[1]).map(([e,c])=>
    '<button class="chk" data-e="'+esc(e)+'" onclick="toggleEmp(\''+esc(e)+'\')" aria-pressed="false"><span class="chk-lab">'+esc(e)+'</span><span class="chk-c">'+c+'</span></button>'
  ).join("");
  const pris=[...new Set(ALL_JOBS.map(j=>j.pr).filter(Boolean))].sort();
  $("pris").innerHTML=pris.map(p=>
    '<button class="tab" data-p="'+esc(p)+'" onclick="togglePri(\''+esc(p)+'\')" aria-pressed="false">'+esc(p)+'位</button>'
  ).join("");
  renderCoList();
  renderRegions();
  renderPrefs();
  _applyNow();
}

/* ====== 更新日時表示 ====== */
function showUpdatedDate(isLive){
  const label = isLive ? "✅ ライブ更新：" : "更新日時：";
  if(!LAST_UPDATED_AT){$("hdUpdated").textContent=label+"不明";return;}
  const d=new Date(LAST_UPDATED_AT);
  if(isNaN(d.getTime())){$("hdUpdated").textContent=label+LAST_UPDATED_AT;return;}
  const jst=new Date(d.getTime()+9*60*60*1000);
  const hh=String(jst.getUTCHours()).padStart(2,"0");
  const mm=String(jst.getUTCMinutes()).padStart(2,"0");
  $("hdUpdated").textContent=label+(jst.getUTCMonth()+1)+"月"+jst.getUTCDate()+"日 "+hh+":"+mm;
}

/* ====== 手動更新ボタン（GAS直接フェッチ） ====== */
async function manualRefresh(){
  if(_refreshing) return;
  _refreshing=true;
  const btn=$("hdRefreshBtn"),label=$("hdRefreshLabel");
  btn.classList.add("checking");btn.disabled=true;
  lbStart();
  try{
    const res=await fetch(GAS_API_URL+"?nocache=1&t="+Date.now(),{cache:"no-store"});
    const data=await res.json();
    if(data && Array.isArray(data.jobs) && data.jobs.length > 0){
      ALL_JOBS=data.jobs;
      LAST_UPDATED_AT=data.updatedAt||null;
      renderAll();
      showUpdatedDate(true);
      btn.classList.add("latest");label.textContent="最新です";
    }else{
      label.textContent="確認できません";
    }
    sessionStorage.setItem("jc_last_check",String(Date.now()));
  }catch{
    label.textContent="確認できません";
  }finally{
    btn.classList.remove("checking");btn.disabled=false;
    _refreshing=false;
    lbDone();
    setTimeout(()=>{btn.classList.remove("latest");label.textContent="最新に更新";},2500);
  }
}

/* ====== 初期化 ====== */
registerSW();
loadInitialData();
</script>
